      - textbox [ref=e84]: "\\documentclass[11pt]{article} \\usepackage[utf8]{inputenc} \\usepackage{amsmath, amssymb, amsthm} \\usepackage{graphicx} \\usepackage{tikz} \\usepackage[numbers]{natbib} \\usepackage{hyperref} \\newcommand{\\norm}[1]{\\left\\|#1\\right\\|} \\newcommand{\\inner}[2]{\\langle #1,\\, #2 \\rangle} \\newtheorem{theorem}{Theorem}[section] \\newtheorem{definition}{Definition}[section] \\title{Real-Time \\LaTeX: A Researcher-Grade Scratchpad} \\author{Jane Doe \\and John Smith} \\date{\\today} \\begin{document} \\maketitle \\begin{abstract} This document is compiled by a \\emph{real} TeX Live engine over the network: TikZ, \\texttt{natbib} citations, custom macros, theorem environments, and multi-file \\texttt{\\textbackslash input} all work exactly as in a desktop LaTeX install. The instant HTML preview gives you sub-second feedback while you type; hit \\textbf{Compile} for the submission-grade PDF. \\end{abstract} \\input{intro.tex} \\section{The Cauchy-Schwarz Inequality} \\label{sec:cs} Let $H$ be a Hilbert space with inner product $\\inner{\\cdot}{\\cdot}$ and induced norm $\\norm{x} = \\sqrt{\\inner{x}{x}}$. \\begin{theorem}[Cauchy-Schwarz] \\label{thm:cs} For all $x, y \\in H$, \\begin{equation} \\label{eq:cs} |\\inner{x}{y}|^2 \\leq \\inner{x}{x}\\cdot\\inner{y}{y}. \\end{equation} \\end{theorem} Equation~\\eqref{eq:cs} is the cornerstone of inner-product geometry; see~\\citet{rudin1976} for a classical treatment. \\section{A TikZ Figure} \\begin{figure}[ht] \\centering \\begin{tikzpicture}[scale=1.4] \\draw[->] (-0.2,0) -- (2.4,0) node[right] {$x$}; \\draw[->] (0,-0.2) -- (0,2.4) node[above] {$y$}; \\draw[thick,blue] (0,0) -- (2,1.2) node[midway,above left] {$x$}; \\draw[thick,red] (0,0) -- (1.2,2) node[midway,right] {$y$}; \\draw (0,0) circle (0.4); \\end{tikzpicture} \\caption{Two vectors in $H$ and the angle between them.} \\label{fig:vectors} \\end{figure} Figure~\\ref{fig:vectors} illustrates the geometry behind~\\eqref{eq:cs}. \\bibliographystyle{plainnat} \\bibliography{refs} \\end{document}"
