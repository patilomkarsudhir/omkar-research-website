<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulletCAD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.umd.cjs"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #111; color: #fff; overflow: hidden; }
        
        .app { display: grid; grid-template-columns: 240px 1fr 260px; grid-template-rows: 50px 1fr 28px; height: 100vh; }
        
        .header { grid-column: 1/-1; background: #1a1a1a; display: flex; align-items: center; padding: 0 16px; gap: 16px; border-bottom: 1px solid #333; }
        .logo { font-weight: 700; font-size: 16px; color: #f97316; }
        
        .toolbar { display: flex; gap: 4px; flex: 1; }
        .tool-group { display: flex; gap: 2px; padding: 0 8px; border-right: 1px solid #333; }
        .tool-btn { width: 36px; height: 36px; background: transparent; border: none; border-radius: 6px; color: #999; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tool-btn:hover { background: #2a2a2a; color: #fff; }
        .tool-btn.active { background: #f97316; color: #fff; }
        .tool-btn:disabled { opacity: 0.3; cursor: default; }
        .tool-btn svg { width: 18px; height: 18px; }

        .segmented { display: flex; background: #252525; border: 1px solid #333; border-radius: 8px; overflow: hidden; height: 36px; align-items: stretch; }
        .seg-btn { padding: 0 10px; background: transparent; border: none; color: #999; cursor: pointer; font-size: 12px; }
        .seg-btn:hover { background: #2a2a2a; color: #fff; }
        .seg-btn.active { background: rgba(249,115,22,0.25); color: #f97316; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: #f97316; color: #fff; }
        .btn-primary:hover { background: #fb923c; }
        
        .render-modes { display: flex; gap: 4px; }
        .render-btn { width: 28px; height: 28px; background: transparent; border: 1px solid #333; border-radius: 4px; color: #999; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .render-btn:hover { background: #252525; color: #fff; }
        .render-btn.active { background: #f97316; border-color: #f97316; color: #fff; }
        
        .panel { background: #1a1a1a; border-right: 1px solid #333; overflow-y: auto; }
        .panel-right { border-right: none; border-left: 1px solid #333; }
        
        .section { padding: 12px; border-bottom: 1px solid #333; }
        .section-title { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 10px; }
        
        .prim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .prim-btn { aspect-ratio: 1; background: #252525; border: 1px solid #333; border-radius: 8px; color: #999; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; }
        .prim-btn:hover { background: #f97316; border-color: #f97316; color: #fff; }
        .prim-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .feature-btn { padding: 10px; background: #252525; border: 1px solid #333; border-radius: 6px; color: #999; cursor: pointer; font-size: 11px; text-align: center; }
        .feature-btn:hover { border-color: #f97316; color: #fff; }
        .feature-btn:disabled { opacity: 0.4; cursor: default; }

        
        
        .tree-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #999; display: flex; align-items: center; gap: 8px; margin: 2px 0; }
        .tree-item:hover { background: #252525; color: #fff; }
        .tree-item.selected { background: rgba(249,115,22,0.2); color: #f97316; }

        .feature-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #999; display: flex; align-items: center; gap: 8px; margin: 2px 0; }
        .feature-item:hover { background: #252525; color: #fff; }
        .feature-item.selected { background: rgba(249,115,22,0.2); color: #f97316; }
        
        .viewport { background: #0a0a0a; position: relative; }
        #canvas { width: 100%; height: 100%; display: block; }
        
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-size: 12px; display: none; }
        .hud.active { display: block; }
        .hud.sketch { border: 1px solid #8b5cf6; color: #8b5cf6; }
        .hud.face { border: 1px solid #06b6d4; color: #06b6d4; }

        .numhud { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none; border: 1px solid #333; min-width: 240px; }
        .numhud.active { display: block; }
        .numhud-title { font-size: 11px; color: #bbb; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
        .numhud-hint { font-size: 10px; color: #666; }
        .numhud-row { display: grid; grid-template-columns: 16px 1fr 16px 1fr 16px 1fr; gap: 6px; align-items: center; }
        .numhud-row label { font-family: monospace; font-size: 11px; color: #888; }
        .numhud-row input { width: 100%; padding: 6px; background: #252525; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 11px; font-family: monospace; }
        .numhud-row input:focus { border-color: #f97316; outline: none; }
        
        .coords { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 4px; font-size: 11px; font-family: monospace; color: #666; }
        
        .status { grid-column: 1/-1; background: #1a1a1a; display: flex; align-items: center; padding: 0 16px; font-size: 11px; color: #666; gap: 20px; border-top: 1px solid #333; }
        
        .toast-container { position: fixed; top: 60px; right: 16px; z-index: 1000; }
        .toast { background: #252525; border-left: 3px solid #f97316; padding: 10px 16px; margin-bottom: 8px; border-radius: 4px; font-size: 13px; animation: slideIn 0.2s ease; }
        .toast.success { border-color: #22c55e; }
        .toast.error { border-color: #ef4444; }
        .toast.warning { border-color: #f59e0b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-box { background: #1a1a1a; border-radius: 12px; padding: 20px; width: 320px; }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .modal-input { width: 100%; padding: 10px; background: #252525; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; margin-bottom: 12px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
        .modal-cancel { background: #333; color: #fff; }
        .modal-confirm { background: #f97316; color: #fff; }

        .empty { padding: 30px; text-align: center; color: #555; font-size: 12px; }

        .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .prop-label { font-size: 11px; color: #666; width: 50px; }
        .prop-inputs { display: flex; gap: 4px; flex: 1; }
        .prop-input { flex: 1; padding: 6px; background: #252525; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 11px; font-family: monospace; width: 100%; }
        .prop-input:focus { border-color: #f97316; outline: none; }

        .color-row { display: flex; align-items: center; gap: 10px; }
        .color-swatch { width: 32px; height: 32px; border-radius: 6px; border: 2px solid #444; cursor: pointer; }
        .color-hex { font-family: monospace; font-size: 11px; color: #888; }
        input[type="color"] { opacity: 0; position: absolute; pointer-events: none; }
        
        .material-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; }
        .material-row { display: grid; grid-template-columns: 60px 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
        .material-label { font-size: 10px; color: #666; text-transform: uppercase; }
        .material-input { padding: 4px; background: #252525; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 10px; }
        .material-input:focus { border-color: #f97316; outline: none; }
        
        .geometry-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; }
        .geometry-stat { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-bottom: 8px; font-size: 11px; }
        .geometry-label { color: #666; }
        .geometry-value { color: #f97316; font-family: monospace; font-weight: 600; }
    </style>
</head>

<body>
<div class="app">
    <header class="header">
        <div class="logo">⬡ BulletCAD</div>
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" id="t-select" title="Select (V)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 17 2.5-7.5L20 10 3 3z"/></svg>
                </button>
                <button class="tool-btn" id="t-face" title="Select Face (F)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h16M12 4v16"/></svg>
                </button>
                <button class="tool-btn" id="t-move" title="Move (G)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
                </button>
                <button class="tool-btn" id="t-rotate" title="Rotate (R)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6-8.5"/><path d="M21 3v5h-5"/></svg>
                </button>
                <button class="tool-btn" id="t-scale" title="Scale (S)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m6 6v-5m0 5h-5M3 16v5h5M21 8V3h-5M3 8V3h5"/></svg>
                </button>
            </div>

            <div class="tool-group" title="Selection Mode">
                <div class="segmented" id="sel-mode">
                    <button class="seg-btn active" data-selmode="body" title="Body selection (V)">Body</button>
                    <button class="seg-btn" data-selmode="face" title="Face selection (F)">Face</button>
                    <button class="seg-btn" data-selmode="edge" title="Edge selection (E)">Edge</button>
                    <button class="seg-btn" data-selmode="vertex" title="Vertex selection (X)">Vtx</button>
                </div>
            </div>

            <div class="tool-group">
                <button class="tool-btn" id="t-line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/></svg></button>
                <button class="tool-btn" id="t-rect" title="Rectangle (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg></button>
                <button class="tool-btn" id="t-circle" title="Circle (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></button>
                <button class="tool-btn" id="t-measure" title="Measure (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L20 4"/><path d="M8 4h12v12"/></svg></button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" id="t-undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg></button>
                <button class="tool-btn" id="t-redo" title="Redo (Ctrl+Y)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg></button>
            </div>

            <div class="tool-group" title="Render Mode">
                <div class="render-modes">
                    <button class="render-btn active" id="render-shaded" title="Shaded">◯</button>
                    <button class="render-btn" id="render-wireframe" title="Wireframe">⬚</button>
                    <button class="render-btn" id="render-edges" title="Edges">◻</button>
                </div>
            </div>
        </div>

        <button class="btn btn-primary" id="btn-save">Save</button>
        <button class="btn btn-primary" id="btn-load">Load</button>
        <button class="btn btn-primary" id="btn-import">Import STL</button>
        <button class="btn btn-primary" id="btn-export">Export STL</button>
        <button class="btn btn-primary" id="btn-export-step">Export STEP</button>
        <input type="file" id="stl-file-input" accept=".stl" style="display:none" />
    </header>

    <aside class="panel">
        <div class="section">
            <div class="section-title">Primitives</div>
            <div class="prim-grid">
                <button class="prim-btn" data-prim="box"><svg viewBox="0 0 24 24"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Box</button>
                <button class="prim-btn" data-prim="sphere"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3"/></svg>Sphere</button>
                <button class="prim-btn" data-prim="cylinder"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/></svg>Cyl</button>
                <button class="prim-btn" data-prim="cone"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="19" rx="8" ry="3"/><path d="M4 19L12 4l8 15"/></svg>Cone</button>
                <button class="prim-btn" data-prim="torus"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="4" ry="1.5"/></svg>Torus</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Operations</div>
            <div class="feature-grid">
                <button class="feature-btn" id="f-extrude">Extrude</button>
                <button class="feature-btn" id="f-cut">Cut</button>
                <button class="feature-btn" id="f-fillet">Fillet</button>
                <button class="feature-btn" id="f-chamfer">Chamfer</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Features</div>
            <div id="features"><div class="empty">No features yet.</div></div>
        </div>

        <div class="section">
            <div class="section-title">Objects</div>
            <div id="tree"><div class="empty">No objects. Create a primitive.</div></div>
        </div>
    </aside>

    <main class="viewport">
        <canvas id="canvas"></canvas>
        <div class="hud" id="hud"></div>
        <div class="numhud" id="numhud" aria-hidden="true">
            <div class="numhud-title">
                <span id="numhud-title">Transform</span>
                <span class="numhud-hint">Enter=Apply · Esc=Hide</span>
            </div>
            <div class="numhud-row">
                <label for="numhud-x">X</label><input id="numhud-x" inputmode="decimal" placeholder="0" />
                <label for="numhud-y">Y</label><input id="numhud-y" inputmode="decimal" placeholder="0" />
                <label for="numhud-z">Z</label><input id="numhud-z" inputmode="decimal" placeholder="0" />
            </div>
        </div>
        <div class="coords" id="coords">X: 0 Y: 0 Z: 0</div>
    </main>

    <aside class="panel panel-right">
        <div class="section">
            <div class="section-title">Properties</div>
            <div id="props"><div class="empty">Select an object</div></div>
        </div>
    </aside>

    <footer class="status">
        <span>Objects: <strong id="s-obj">0</strong></span>
        <span>Selected: <strong id="s-sel">None</strong></span>
    </footer>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal" id="m-extrude">
    <div class="modal-box">
        <div class="modal-title">Extrude</div>
        <input type="number" class="modal-input" id="extrude-val" value="20" placeholder="Distance (mm)" />
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" onclick="closeModal('m-extrude')">Cancel</button>
            <button class="modal-btn modal-confirm" id="extrude-ok">Extrude</button>
        </div>
    </div>
</div>

<div class="modal" id="m-cut">
    <div class="modal-box">
        <div class="modal-title">Cut</div>
        <input type="number" class="modal-input" id="cut-val" value="20" placeholder="Cut depth (mm)" />
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" onclick="closeModal('m-cut')">Cancel</button>
            <button class="modal-btn modal-confirm" id="cut-ok">Cut</button>
        </div>
    </div>
</div>

<div class="modal" id="m-fillet">
    <div class="modal-box">
        <div class="modal-title">Fillet</div>
        <input type="number" class="modal-input" id="fillet-val" value="2" placeholder="Radius (mm)" />
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" onclick="closeModal('m-fillet')">Cancel</button>
            <button class="modal-btn modal-confirm" id="fillet-ok">Apply</button>
        </div>
    </div>
</div>

<div class="modal" id="m-chamfer">
    <div class="modal-box">
        <div class="modal-title">Chamfer</div>
        <input type="number" class="modal-input" id="chamfer-val" value="2" placeholder="Distance (mm)" />
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" onclick="closeModal('m-chamfer')">Cancel</button>
            <button class="modal-btn modal-confirm" id="chamfer-ok">Apply</button>
        </div>
    </div>
</div>

<div class="modal" id="m-sketch-dim">
    <div class="modal-box">
        <div class="modal-title" id="skdim-title">Sketch Dimension</div>
        <input type="number" class="modal-input" id="skdim-a" placeholder="Value" />
        <input type="number" class="modal-input" id="skdim-b" placeholder="Value" style="display:none" />
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" onclick="closeModal('m-sketch-dim')">Cancel</button>
            <button class="modal-btn modal-confirm" id="skdim-ok">Apply</button>
        </div>
    </div>
</div>

<script>
// CSG Library for Boolean Operations (based on csg.js by Evan Wallace)
const CSG = (function() {
    const EPSILON = 1e-5;

    class Vector {
        constructor(x = 0, y = 0, z = 0) {
            this.x = x; this.y = y; this.z = z;
        }
        clone() { return new Vector(this.x, this.y, this.z); }
        negated() { return new Vector(-this.x, -this.y, -this.z); }
        plus(a) { return new Vector(this.x + a.x, this.y + a.y, this.z + a.z); }
        minus(a) { return new Vector(this.x - a.x, this.y - a.y, this.z - a.z); }
        times(a) { return new Vector(this.x * a, this.y * a, this.z * a); }
        dividedBy(a) { return new Vector(this.x / a, this.y / a, this.z / a); }
        dot(a) { return this.x * a.x + this.y * a.y + this.z * a.z; }
        lerp(a, t) { return this.plus(a.minus(this).times(t)); }
        length() { return Math.sqrt(this.dot(this)); }
        unit() { return this.dividedBy(this.length()); }
        cross(a) {
            return new Vector(
                this.y * a.z - this.z * a.y,
                this.z * a.x - this.x * a.z,
                this.x * a.y - this.y * a.x
            );
        }
    }

    class Vertex {
        constructor(pos, normal) {
            this.pos = new Vector(pos.x, pos.y, pos.z);
            this.normal = new Vector(normal.x, normal.y, normal.z);
        }
        clone() { return new Vertex(this.pos.clone(), this.normal.clone()); }
        flip() { this.normal = this.normal.negated(); }
        interpolate(other, t) {
            return new Vertex(this.pos.lerp(other.pos, t), this.normal.lerp(other.normal, t));
        }
    }

    class Plane {
        constructor(normal, w) {
            this.normal = normal;
            this.w = w;
        }
        clone() { return new Plane(this.normal.clone(), this.w); }
        flip() { this.normal = this.normal.negated(); this.w = -this.w; }

        splitPolygon(polygon, coplanarFront, coplanarBack, front, back) {
            const COPLANAR = 0, FRONT = 1, BACK = 2, SPANNING = 3;
            let polygonType = 0;
            const types = [];
            for (let i = 0; i < polygon.vertices.length; i++) {
                const t = this.normal.dot(polygon.vertices[i].pos) - this.w;
                const type = (t < -EPSILON) ? BACK : (t > EPSILON) ? FRONT : COPLANAR;
                polygonType |= type;
                types.push(type);
            }
            switch (polygonType) {
                case COPLANAR:
                    (this.normal.dot(polygon.plane.normal) > 0 ? coplanarFront : coplanarBack).push(polygon);
                    break;
                case FRONT:
                    front.push(polygon);
                    break;
                case BACK:
                    back.push(polygon);
                    break;
                case SPANNING:
                    const f = [], b = [];
                    for (let i = 0; i < polygon.vertices.length; i++) {
                        const j = (i + 1) % polygon.vertices.length;
                        const ti = types[i], tj = types[j];
                        const vi = polygon.vertices[i], vj = polygon.vertices[j];
                        if (ti !== BACK) f.push(vi);
                        if (ti !== FRONT) b.push(ti !== BACK ? vi.clone() : vi);
                        if ((ti | tj) === SPANNING) {
                            const t = (this.w - this.normal.dot(vi.pos)) / this.normal.dot(vj.pos.minus(vi.pos));
                            const v = vi.interpolate(vj, t);
                            f.push(v);
                            b.push(v.clone());
                        }
                    }
                    if (f.length >= 3) front.push(new Polygon(f, polygon.shared));
                    if (b.length >= 3) back.push(new Polygon(b, polygon.shared));
                    break;
            }
        }

        static fromPoints(a, b, c) {
            const n = b.minus(a).cross(c.minus(a)).unit();
            return new Plane(n, n.dot(a));
        }
    }

    class Polygon {
        constructor(vertices, shared) {
            this.vertices = vertices;
            this.shared = shared;
            this.plane = Plane.fromPoints(vertices[0].pos, vertices[1].pos, vertices[2].pos);
        }
        clone() {
            return new Polygon(this.vertices.map(v => v.clone()), this.shared);
        }
        flip() {
            this.vertices.reverse().forEach(v => v.flip());
            this.plane.flip();
        }
    }

    class Node {
        constructor(polygons) {
            this.plane = null;
            this.front = null;
            this.back = null;
            this.polygons = [];
            if (polygons) this.build(polygons);
        }
        clone() {
            const node = new Node();
            node.plane = this.plane && this.plane.clone();
            node.front = this.front && this.front.clone();
            node.back = this.back && this.back.clone();
            node.polygons = this.polygons.map(p => p.clone());
            return node;
        }
        invert() {
            for (let i = 0; i < this.polygons.length; i++) this.polygons[i].flip();
            this.plane && this.plane.flip();
            this.front && this.front.invert();
            this.back && this.back.invert();
            const temp = this.front; this.front = this.back; this.back = temp;
        }
        clipPolygons(polygons) {
            if (!this.plane) return polygons.slice();
            let front = [], back = [];
            for (let i = 0; i < polygons.length; i++) {
                this.plane.splitPolygon(polygons[i], front, back, front, back);
            }
            if (this.front) front = this.front.clipPolygons(front);
            if (this.back) back = this.back.clipPolygons(back);
            else back = [];
            return front.concat(back);
        }
        clipTo(bsp) {
            this.polygons = bsp.clipPolygons(this.polygons);
            if (this.front) this.front.clipTo(bsp);
            if (this.back) this.back.clipTo(bsp);
        }
        allPolygons() {
            let polygons = this.polygons.slice();
            if (this.front) polygons = polygons.concat(this.front.allPolygons());
            if (this.back) polygons = polygons.concat(this.back.allPolygons());
            return polygons;
        }
        build(polygons) {
            if (!polygons.length) return;
            if (!this.plane) this.plane = polygons[0].plane.clone();
            const front = [], back = [];
            for (let i = 0; i < polygons.length; i++) {
                this.plane.splitPolygon(polygons[i], this.polygons, this.polygons, front, back);
            }
            if (front.length) {
                if (!this.front) this.front = new Node();
                this.front.build(front);
            }
            if (back.length) {
                if (!this.back) this.back = new Node();
                this.back.build(back);
            }
        }
    }

    class CSG {
        constructor() { this.polygons = []; }
        clone() {
            const csg = new CSG();
            csg.polygons = this.polygons.map(p => p.clone());
            return csg;
        }
        toPolygons() { return this.polygons; }

        union(csg) {
            const a = new Node(this.clone().polygons);
            const b = new Node(csg.clone().polygons);
            a.clipTo(b);
            b.clipTo(a);
            b.invert();
            b.clipTo(a);
            b.invert();
            a.build(b.allPolygons());
            return CSG.fromPolygons(a.allPolygons());
        }

        subtract(csg) {
            const a = new Node(this.clone().polygons);
            const b = new Node(csg.clone().polygons);
            a.invert();
            a.clipTo(b);
            b.clipTo(a);
            b.invert();
            b.clipTo(a);
            b.invert();
            a.build(b.allPolygons());
            a.invert();
            return CSG.fromPolygons(a.allPolygons());
        }

        intersect(csg) {
            const a = new Node(this.clone().polygons);
            const b = new Node(csg.clone().polygons);
            a.invert();
            b.clipTo(a);
            b.invert();
            a.clipTo(b);
            b.clipTo(a);
            a.build(b.allPolygons());
            a.invert();
            return CSG.fromPolygons(a.allPolygons());
        }

        inverse() {
            const csg = this.clone();
            csg.polygons.forEach(p => p.flip());
            return csg;
        }

        static fromPolygons(polygons) {
            const csg = new CSG();
            csg.polygons = polygons;
            return csg;
        }

        static fromGeometry(geom, matrix) {
            const polys = [];
            const posAttr = geom.attributes.position;
            const normAttr = geom.attributes.normal;
            const idx = geom.index;

            const tempVert = new THREE.Vector3();
            const tempNorm = new THREE.Vector3();
            const normalMatrix = matrix ? new THREE.Matrix3().getNormalMatrix(matrix) : null;

            const getVertex = (i) => {
                tempVert.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
                if (matrix) tempVert.applyMatrix4(matrix);
                tempNorm.set(normAttr.getX(i), normAttr.getY(i), normAttr.getZ(i));
                if (normalMatrix) tempNorm.applyMatrix3(normalMatrix).normalize();
                return new Vertex(
                    { x: tempVert.x, y: tempVert.y, z: tempVert.z },
                    { x: tempNorm.x, y: tempNorm.y, z: tempNorm.z }
                );
            };

            if (idx) {
                for (let i = 0; i < idx.count; i += 3) {
                    const a = idx.getX(i), b = idx.getX(i + 1), c = idx.getX(i + 2);
                    polys.push(new Polygon([getVertex(a), getVertex(b), getVertex(c)]));
                }
            } else {
                for (let i = 0; i < posAttr.count; i += 3) {
                    polys.push(new Polygon([getVertex(i), getVertex(i + 1), getVertex(i + 2)]));
                }
            }
            return CSG.fromPolygons(polys);
        }

        toGeometry() {
            const positions = [];
            const normals = [];
            for (const poly of this.polygons) {
                const verts = poly.vertices;
                for (let i = 2; i < verts.length; i++) {
                    positions.push(verts[0].pos.x, verts[0].pos.y, verts[0].pos.z);
                    positions.push(verts[i - 1].pos.x, verts[i - 1].pos.y, verts[i - 1].pos.z);
                    positions.push(verts[i].pos.x, verts[i].pos.y, verts[i].pos.z);
                    normals.push(verts[0].normal.x, verts[0].normal.y, verts[0].normal.z);
                    normals.push(verts[i - 1].normal.x, verts[i - 1].normal.y, verts[i - 1].normal.z);
                    normals.push(verts[i].normal.x, verts[i].normal.y, verts[i].normal.z);
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            return geom;
        }
    }

    return CSG;
})();
</script>

<script>
const CONFIG = Object.freeze({
    DEFAULT_BOX_SIZE: 20,
    DEFAULT_SPHERE_RADIUS: 12,
    DEFAULT_CYLINDER_RADIUS: 10,
    DEFAULT_CYLINDER_HEIGHT: 25,
    DEFAULT_CONE_RADIUS: 12,
    DEFAULT_CONE_HEIGHT: 25,
    DEFAULT_TORUS_RADIUS: 12,
    DEFAULT_TORUS_TUBE: 4,
    DEFAULT_PLANE_SIZE: 40,
    DEFAULT_EXTRUDE_DEPTH: 20,
    DEFAULT_FILLET_RADIUS: 2,
    DEFAULT_CHAMFER_DISTANCE: 2,
    GRID_SIZE: 200,
    GRID_DIVISIONS: 20,
    PRIMITIVE_SPACING: 25,
    PRIMITIVE_GRID_WIDTH: 100,
    GEOMETRY_SEGMENTS: 64,
    GEOMETRY_SEGMENTS_TORUS_RADIAL: 32,
    GEOMETRY_SEGMENTS_TORUS_TUBULAR: 96,
    SKETCH_CIRCLE_POINTS: 50,
    SKETCH_LINE_COLOR: 0x8b5cf6,
    SKETCH_SELECT_COLOR: 0xf97316,
    SKETCH_PICK_THRESHOLD: 0.25,
    SKETCH_POINT_PICK_THRESHOLD: 0.6,
    SKETCH_SNAP_GRID: 1,
    SKETCH_SNAP_THRESHOLD: 0.75,
    SKETCH_INFER_HV_THRESHOLD: 0.75,
    BEVEL_SEGMENTS: 8,
    TOAST_DURATION: 2500,
    FILLET_CHAMFER_MAX_RATIO: 0.9,

    // Step 12: measure tool
    MEASURE_MARKER_RADIUS: 0.9,

    // Step 13: transform snapping (Shift)
    TRANSFORM_TRANSLATE_SNAP: 1,
    TRANSFORM_ROTATE_SNAP_DEG: 15,
    TRANSFORM_SCALE_SNAP: 0.1,

    // Step 15: persistence
    STORAGE_KEY: 'bulletcad.project.v1',
});

class BulletCADApp {
    constructor() {
        // DOM
        this.canvas = document.getElementById('canvas');
        this.hudEl = document.getElementById('hud');
        this.numHudEl = document.getElementById('numhud');
        this.numHudTitleEl = document.getElementById('numhud-title');
        this.numHudXEl = document.getElementById('numhud-x');
        this.numHudYEl = document.getElementById('numhud-y');
        this.numHudZEl = document.getElementById('numhud-z');
        this.coordsEl = document.getElementById('coords');
        this.toastsEl = document.getElementById('toasts');
        this.treeEl = document.getElementById('tree');
        this.featuresEl = document.getElementById('features');
        this.propsEl = document.getElementById('props');
        this.statusObjEl = document.getElementById('s-obj');
        this.statusSelEl = document.getElementById('s-sel');
        this.stlFileInputEl = document.getElementById('stl-file-input');

        // Save/Load buttons
        this.saveBtnEl = document.getElementById('btn-save');
        this.loadBtnEl = document.getElementById('btn-load');

        // Sketch dimension modal
        this.skdimTitleEl = document.getElementById('skdim-title');
        this.skdimAEl = document.getElementById('skdim-a');
        this.skdimBEl = document.getElementById('skdim-b');

        // Three
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.orbit = null;
        this.transform = null;
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        // Scene state
        this.objects = [];
        this.selectedObj = null;
        this.selectedFace = null;
        this.currentTool = 'select';

        // Step 12: measure tool
        this.measure = { points: [], markers: [], line: null, value: null };

        // Step 13: transform snapping
        this.shiftDown = false;

        // Step 14: isolate selection
        this.isolate = { active: false, prev: new Map() };

        // Step 1: selection
        this.selectionMode = 'body'; // body | face | edge | vertex
        this.selection = [];
        this.hoverSelection = null;
        this.pickEdgeThresholdPx = 8;
        this.pickVertexThresholdPx = 10;

        // Step 2: highlights
        this.highlight = {
            group: null,
            hover: { outline: null, face: null, vertex: null },
            selected: { outlines: [], face: null, vertex: null },
        };

        // History
        this.undoStack = [];
        this.redoStack = [];
        this.objCounter = 0;

        // Step 11: feature tree (non-parametric history)
        this.features = [];
        this.featureCounter = 0;
        this.selectedFeatureId = null;

        // Step 4: command system
        this.activeCommand = null;

        // Step 5: previews for multi-step commands
        this.preview = { mesh: null };

        // Step 6: numeric HUD state
        this.numericHudKind = null; // move | rotate | scale

        // Sketch (baseline)
        this.sketchMode = false;
        this.sketchPoints = [];
        this.sketchLines = [];
        this.sketchPlane = null; // { origin: Vector3, u: Vector3, v: Vector3, w: Vector3, offset: number }

        // Sketch UX: pick a plane/face first
        this.pendingSketchPlanePick = false;
        this.sketchViz = { group: null, plane: null, grid: null };

        // Sketch UX: hover + rubber-band previews
        this.sketchHover = { group: null, marker: null, geom: null, mat: null };
        this.sketchDraft = { obj: null, geometry: null, material: null, kind: null };

        // Step 9: sketch selection + dimensions
        this.sketchSelection = [];

        // Step 10: sketch constraints/relations
        this.sketchPointSelection = []; // [{ entity, ref }]
        this.sketchConstraints = []; // [{ type, ... }]
        this.sketchPointViz = { group: null, geom: null, mat: null };

        // Bind handlers
        this.onCanvasClick = this.onCanvasClick.bind(this);
        this.onCanvasMove = this.onCanvasMove.bind(this);
        this.onKeyDown = this.onKeyDown.bind(this);
        this.onKeyUp = this.onKeyUp.bind(this);
        this.onResize = this.onResize.bind(this);
        this.animate = this.animate.bind(this);
    }

    // Step 12 helpers
    clearMeasure() {
        if (!this.scene) return;
        this.measure.value = null;
        this.measure.points = [];

        if (this.measure.line) {
            this.scene.remove(this.measure.line);
            this.measure.line.geometry?.dispose?.();
            this.measure.line.material?.dispose?.();
            this.measure.line = null;
        }
        for (const m of this.measure.markers || []) {
            this.scene.remove(m);
            m.geometry?.dispose?.();
            m.material?.dispose?.();
        }
        this.measure.markers = [];
        this.setHUD('', null);
    }

    addMeasurePoint(p3) {
        if (!this.scene || !p3) return;
        const geom = new THREE.SphereGeometry(CONFIG.MEASURE_MARKER_RADIUS, 16, 16);
        const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.9, depthTest: false });
        const s = new THREE.Mesh(geom, mat);
        s.position.copy(p3);
        this.scene.add(s);
        this.measure.markers.push(s);
        this.measure.points.push(p3.clone());

        if (this.measure.points.length === 2) {
            const [a, b] = this.measure.points;
            const d = a.distanceTo(b);
            this.measure.value = d;

            // Dispose previous measure line if exists
            if (this.measure.line) {
                this.scene.remove(this.measure.line);
                this.measure.line.geometry?.dispose?.();
                this.measure.line.material?.dispose?.();
            }
            const lineGeom = new THREE.BufferGeometry().setFromPoints([a, b]);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.9, depthTest: false });
            const line = new THREE.Line(lineGeom, lineMat);
            this.scene.add(line);
            this.measure.line = line;

            this.setHUD(`Measure: ${d.toFixed(3)} mm (Esc to clear)`, 'face');
            // Keep last point as start for chaining
            this.measure.points = [b.clone()];
            // Dispose old markers except the last one for chaining
            const lastMarker = this.measure.markers[this.measure.markers.length - 1];
            for (let i = 0; i < this.measure.markers.length - 1; i++) {
                const m = this.measure.markers[i];
                this.scene.remove(m);
                m.geometry?.dispose?.();
                m.material?.dispose?.();
            }
            this.measure.markers = lastMarker ? [lastMarker] : [];
        } else {
            this.setHUD('Measure: pick second point… (Esc to clear)', 'face');
        }
    }

    getWorldPointFromMouse() {
        const picked = this.pickAtMouse();
        if (picked?.point) return picked.point.clone();

        // fallback: sketch plane if sketch mode, else ground plane
        if (this.sketchMode) {
            if (!this.sketchPlane) this.sketchPlane = this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane();
            const sp = this.sketchPlane || this.getDefaultSketchPlane();
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sp.w, sp.origin);
            const pt = new THREE.Vector3();
            const hit = this.raycaster.ray.intersectPlane(plane, pt);
            if (hit) return pt.clone();
            return null;
        }

        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const pt = new THREE.Vector3();
        const hit = this.raycaster.ray.intersectPlane(plane, pt);
        return hit ? pt.clone() : null;
    }

    // Step 13 helpers
    updateTransformSnapping() {
        if (!this.transform) return;
        const enable = !!this.shiftDown;
        if (!enable) {
            this.transform.setTranslationSnap(null);
            this.transform.setRotationSnap(null);
            this.transform.setScaleSnap(null);
            return;
        }
        this.transform.setTranslationSnap(CONFIG.TRANSFORM_TRANSLATE_SNAP);
        this.transform.setRotationSnap(THREE.MathUtils.degToRad(CONFIG.TRANSFORM_ROTATE_SNAP_DEG));
        this.transform.setScaleSnap(CONFIG.TRANSFORM_SCALE_SNAP);
    }

    // Step 14 helpers
    toggleIsolate() {
        const selected = this.getSelectedBodies();
        if (!this.isolate.active) {
            if (!selected || selected.length === 0) {
                this.toast('Select bodies to isolate', 'warning');
                return;
            }
            this.isolate.prev = new Map();
            for (const o of this.objects || []) this.isolate.prev.set(o.id, !!o.mesh.visible);

            const selectedIds = new Set(selected.map(o => o.id));
            for (const o of this.objects || []) o.mesh.visible = selectedIds.has(o.id);
            this.isolate.active = true;
            this.toast('Isolate ON (press I to toggle)', 'info');
            return;
        }

        for (const o of this.objects || []) {
            const prev = this.isolate.prev.get(o.id);
            o.mesh.visible = prev == null ? true : prev;
        }
        this.isolate.active = false;
        this.isolate.prev = new Map();
        this.toast('Isolate OFF', 'info');
    }

    // Step 15 helpers
    geometryToData(geometry) {
        if (!geometry) return null;
        const g = geometry.clone();
        g.computeVertexNormals?.();

        const out = { index: null, attributes: {} };
        const idx = g.index?.array ? Array.from(g.index.array) : (Array.isArray(g.index) ? g.index : null);
        out.index = idx;

        const attrs = g.attributes || {};
        for (const key of Object.keys(attrs)) {
            const a = attrs[key];
            if (!a?.array || !a?.itemSize) continue;
            out.attributes[key] = { itemSize: a.itemSize, array: Array.from(a.array) };
        }
        return out;
    }

    dataToGeometry(data) {
        if (!data?.attributes?.position) return null;
        const g = new THREE.BufferGeometry();
        for (const [name, spec] of Object.entries(data.attributes || {})) {
            if (!spec?.array || !spec?.itemSize) continue;
            const arr = new Float32Array(spec.array);
            g.setAttribute(name, new THREE.BufferAttribute(arr, spec.itemSize));
        }
        if (Array.isArray(data.index) && data.index.length > 0) g.setIndex(data.index);
        g.computeBoundingSphere();
        return g;
    }

    serializeProject() {
        const objects = (this.objects || []).map(o => {
            const mesh = o.mesh;
            const mat = mesh.material;
            return {
                id: o.id,
                name: o.name,
                type: o.type,
                params: o.params || {},
                transform: {
                    position: { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z },
                    rotation: { x: mesh.rotation.x, y: mesh.rotation.y, z: mesh.rotation.z },
                    scale: { x: mesh.scale.x, y: mesh.scale.y, z: mesh.scale.z },
                    visible: !!mesh.visible,
                },
                material: {
                    color: mat?.color ? mat.color.getHex() : 0xffffff,
                    roughness: mat?.roughness ?? 0.5,
                    metalness: mat?.metalness ?? 0.1,
                },
                geometry: this.geometryToData(mesh.geometry),
            };
        });

        return {
            version: 1,
            objCounter: this.objCounter,
            featureCounter: this.featureCounter,
            objects,
            features: this.features || [],
        };
    }

    resetModel() {
        // Exit sketch mode if active to clean up sketch resources
        if (this.sketchMode) {
            this.exitSketchMode();
        }
        
        this.clearPreview();
        this.clearMeasure();

        for (const o of this.objects || []) {
            if (o?.wireframeHelper) {
                try {
                    o.wireframeHelper.parent?.remove(o.wireframeHelper);
                    o.wireframeHelper.geometry?.dispose?.();
                    o.wireframeHelper.material?.dispose?.();
                } catch (_) { /* ignore */ }
                o.wireframeHelper = null;
            }
            this.scene?.remove(o.mesh);
            o.mesh.geometry?.dispose?.();
            o.mesh.material?.dispose?.();
        }
        this.objects = [];
        this.selection = [];
        this.selectedObj = null;
        this.selectedFace = null;
        this.features = [];
        this.featureCounter = 0;
        this.selectedFeatureId = null;
        this.undoStack = [];
        this.redoStack = [];
        this.updateUndoButtons?.();
        this.updateUI();
        this.updateHighlights();
    }

    saveProject() {
        try {
            const data = this.serializeProject();
            localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
            this.toast('Saved', 'success');
        } catch (err) {
            console.error('Save failed:', err);
            this.toast('Save failed: ' + (err?.message ?? String(err)), 'error');
        }
    }

    loadProject() {
        try {
            const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
            if (!raw) {
                this.toast('No saved project found', 'warning');
                return;
            }
            const data = JSON.parse(raw);
            if (!data?.objects) {
                this.toast('Invalid save data', 'error');
                return;
            }

            this.resetModel();
            this.objCounter = data.objCounter || 0;
            this.featureCounter = data.featureCounter || 0;
            this.features = Array.isArray(data.features) ? data.features : [];

            for (const o of data.objects) {
                const g = this.dataToGeometry(o.geometry);
                if (!g) continue;
                const m = new THREE.MeshStandardMaterial({
                    color: o.material?.color ?? 0xffffff,
                    roughness: o.material?.roughness ?? 0.5,
                    metalness: o.material?.metalness ?? 0.1,
                });
                const mesh = new THREE.Mesh(g, m);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                const t = o.transform || {};
                mesh.position.set(t.position?.x ?? 0, t.position?.y ?? 0, t.position?.z ?? 0);
                mesh.rotation.set(t.rotation?.x ?? 0, t.rotation?.y ?? 0, t.rotation?.z ?? 0);
                mesh.scale.set(t.scale?.x ?? 1, t.scale?.y ?? 1, t.scale?.z ?? 1);
                mesh.visible = t.visible ?? true;

                const obj = { id: o.id, name: o.name, type: o.type, mesh, params: o.params || {} };
                mesh.userData.obj = obj;
                this.scene.add(mesh);
                this.objects.push(obj);
                this.applyRenderModeToObject(obj);
            }

            this.updateUI();
            this.toast('Loaded', 'success');
        } catch (err) {
            console.error('Load failed:', err);
            this.toast('Load failed: ' + (err?.message ?? String(err)), 'error');
        }
    }

    getDefaultSketchPlane() {
        return {
            origin: new THREE.Vector3(0, 0, 0),
            u: new THREE.Vector3(1, 0, 0),
            v: new THREE.Vector3(0, 0, 1),
            w: new THREE.Vector3(0, 1, 0),
            offset: 0.1,
        };
    }

    createSketchPlaneAtWorldPoint(worldPoint) {
        const base = this.getDefaultSketchPlane();
        base.origin = worldPoint ? worldPoint.clone() : base.origin;
        base.offset = 0.15;
        return base;
    }

    ensureSketchHoverViz() {
        if (!this.scene) return;
        if (!this.sketchHover.group) {
            const g = new THREE.Group();
            g.name = 'sketch-hover';
            this.scene.add(g);
            this.sketchHover.group = g;
        }
        if (!this.sketchHover.geom) this.sketchHover.geom = new THREE.SphereGeometry(0.45, 12, 12);
        if (!this.sketchHover.mat) this.sketchHover.mat = new THREE.MeshBasicMaterial({
            color: 0x06b6d4,
            transparent: true,
            opacity: 0.9,
            depthTest: false,
        });
        if (!this.sketchHover.marker) {
            const m = new THREE.Mesh(this.sketchHover.geom, this.sketchHover.mat);
            m.visible = false;
            m.renderOrder = 20;
            this.sketchHover.group.add(m);
            this.sketchHover.marker = m;
        }
    }

    setSketchHoverMarkerWorld(worldPoint, { visible = true } = {}) {
        if (!this.scene) return;
        this.ensureSketchHoverViz();
        if (!this.sketchHover.marker) return;
        if (!worldPoint) {
            this.sketchHover.marker.visible = false;
            return;
        }
        this.sketchHover.marker.position.copy(worldPoint);
        this.sketchHover.marker.visible = !!visible;
    }

    clearSketchHoverViz() {
        if (!this.scene) return;
        if (this.sketchHover.marker) this.sketchHover.marker.visible = false;
        if (this.sketchHover.group) this.scene.remove(this.sketchHover.group);
        this.sketchHover.group = null;
        this.sketchHover.marker = null;
        this.sketchHover.geom?.dispose?.();
        this.sketchHover.mat?.dispose?.();
        this.sketchHover.geom = null;
        this.sketchHover.mat = null;
    }

    clearSketchDraft() {
        if (!this.scene) return;
        const o = this.sketchDraft.obj;
        if (o) this.scene.remove(o);
        this.sketchDraft.geometry?.dispose?.();
        this.sketchDraft.material?.dispose?.();
        this.sketchDraft = { obj: null, geometry: null, material: null, kind: null };
    }

    ensureSketchDraft(kind) {
        if (!this.scene) return;
        if (this.sketchDraft.obj && this.sketchDraft.kind === kind) return;
        this.clearSketchDraft();
        const material = new THREE.LineBasicMaterial({
            color: 0x06b6d4,
            transparent: true,
            opacity: 0.8,
            depthTest: false,
        });
        const geometry = new THREE.BufferGeometry();
        const line = new THREE.Line(geometry, material);
        line.renderOrder = 9;
        line.frustumCulled = false;
        line.name = 'sketch-draft';
        this.scene.add(line);
        this.sketchDraft = { obj: line, geometry, material, kind };
    }

    getSketchCursor2D({ disableSnap = false } = {}) {
        if (!this.raycaster?.ray) return null;
        if (!this.sketchPlane) this.sketchPlane = this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane();
        const sp = this.sketchPlane || this.getDefaultSketchPlane();
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sp.w, sp.origin);
        const pt = new THREE.Vector3();
        const hit = this.raycaster.ray.intersectPlane(plane, pt);
        if (!hit) return null;
        const raw = this.worldToSketch(pt);
        let p = this.snapSketchPoint(raw, { disableSnap });
        p = this.applySketchInference(p, { disableSnap });
        return p;
    }

    updateSketchRubberBand({ disableSnap = false } = {}) {
        if (!this.scene || !this.sketchMode) return;
        if (!['line', 'rect', 'circle'].includes(this.currentTool)) {
            this.clearSketchDraft();
            return;
        }

        const p = this.getSketchCursor2D({ disableSnap });
        if (!p) {
            this.setSketchHoverMarkerWorld(null);
            this.clearSketchDraft();
            return;
        }

        // Always show snapped cursor point in sketch
        this.setSketchHoverMarkerWorld(this.sketchToWorld(p), { visible: true });

        if ((this.sketchPoints || []).length !== 1) {
            this.clearSketchDraft();
            return;
        }

        const a = this.sketchPoints[0];
        const b = p;
        const kind = this.currentTool;
        this.ensureSketchDraft(kind);

        let pointsW = [];
        if (kind === 'line') {
            pointsW = [this.sketchToWorld(a), this.sketchToWorld(b)];
        } else if (kind === 'rect') {
            pointsW = [
                this.sketchToWorld(new THREE.Vector2(a.x, a.y)),
                this.sketchToWorld(new THREE.Vector2(b.x, a.y)),
                this.sketchToWorld(new THREE.Vector2(b.x, b.y)),
                this.sketchToWorld(new THREE.Vector2(a.x, b.y)),
                this.sketchToWorld(new THREE.Vector2(a.x, a.y)),
            ];
        } else {
            const r = Math.sqrt(Math.pow(b.x - a.x, 2) + Math.pow(b.y - a.y, 2));
            const curve = new THREE.EllipseCurve(a.x, a.y, r, r, 0, 2 * Math.PI, false, 0);
            pointsW = curve.getPoints(CONFIG.SKETCH_CIRCLE_POINTS).map(pt2 => this.sketchToWorld(new THREE.Vector2(pt2.x, pt2.y)));
        }

        const oldGeom = this.sketchDraft.obj.geometry;
        const newGeom = new THREE.BufferGeometry().setFromPoints(pointsW);
        this.sketchDraft.obj.geometry = newGeom;
        this.sketchDraft.geometry = newGeom;
        oldGeom?.dispose?.();
    }

    ensureSketchViz() {
        if (!this.scene) return;
        if (!this.sketchViz.group) {
            const g = new THREE.Group();
            g.name = 'sketch-viz';
            this.scene.add(g);
            this.sketchViz.group = g;
        }
        if (!this.sketchViz.plane) {
            const geom = new THREE.PlaneGeometry(200, 200);
            const mat = new THREE.MeshBasicMaterial({
                color: CONFIG.SKETCH_LINE_COLOR,
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false,
            });
            const m = new THREE.Mesh(geom, mat);
            m.renderOrder = 5;
            this.sketchViz.group.add(m);
            this.sketchViz.plane = m;
        }
        if (!this.sketchViz.grid) {
            const grid = new THREE.GridHelper(200, 40, 0x444444, 0x222222);
            grid.material.transparent = true;
            grid.material.opacity = 0.45;
            grid.material.depthTest = false;
            grid.renderOrder = 6;
            this.sketchViz.group.add(grid);
            this.sketchViz.grid = grid;
        }
    }

    updateSketchViz() {
        if (!this.scene) return;
        this.ensureSketchViz();
        const sp = this.sketchPlane || this.getDefaultSketchPlane();
        const pos = sp.origin.clone().addScaledVector(sp.w, sp.offset);
        const u = sp.u.clone().normalize();
        const v = sp.v.clone().normalize();
        const w = sp.w.clone().normalize();

        // PlaneGeometry is XY with +Z normal => map x->u, y->v, z->w
        const planeQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(u, v, w));
        // GridHelper is XZ with +Y normal => map x->u, z->v, y->w
        const gridQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(u, w, v));

        if (this.sketchViz.plane) {
            this.sketchViz.plane.position.copy(pos);
            this.sketchViz.plane.quaternion.copy(planeQ);
        }
        if (this.sketchViz.grid) {
            this.sketchViz.grid.position.copy(pos);
            this.sketchViz.grid.quaternion.copy(gridQ);
        }
    }

    clearSketchViz() {
        if (!this.scene) return;
        const g = this.sketchViz.group;
        if (g) this.scene.remove(g);
        if (this.sketchViz.plane) {
            this.sketchViz.plane.geometry?.dispose?.();
            this.sketchViz.plane.material?.dispose?.();
        }
        if (this.sketchViz.grid) {
            this.sketchViz.grid.geometry?.dispose?.();
            this.sketchViz.grid.material?.dispose?.();
        }
        this.sketchViz = { group: null, plane: null, grid: null };
    }

    startSketchSession({ plane, tool = null } = {}) {
        // Clear any existing sketch entities from scene
        for (const ent of this.sketchLines || []) {
            if (ent?.line) this.scene?.remove(ent.line);
            ent?.geometry?.dispose?.();
            ent?.line?.material?.dispose?.();
        }

        this.sketchMode = true;
        this.pendingSketchPlanePick = false;
        this.sketchPoints = [];
        this.sketchLines = [];
        this.sketchPlane = plane || this.getDefaultSketchPlane();
        this.clearSketchSelection();
        this.sketchConstraints = [];
        this.updateSketchViz();
        this.ensureSketchHoverViz();
        this.setSketchHoverMarkerWorld(null);

        this.setHUD('Sketch: pick points (Esc to exit)', 'sketch');
        if (tool) this.setTool(tool);
    }

    pickFaceAtMouse() {
        const meshes = this.objects.map(o => o.mesh);
        if (meshes.length === 0) return null;
        const hits = this.raycaster.intersectObjects(meshes);
        const hit = hits[0];
        if (!hit?.object) return null;
        const obj = hit.object.userData.obj;
        if (!obj) return null;
        return {
            obj,
            faceIdx: hit.faceIndex,
            point: hit.point.clone(),
            normal: hit.face?.normal?.clone?.() ?? new THREE.Vector3(0, 1, 0),
        };
    }

    computeSketchPlaneFromSelectedFace() {
        if (!this.selectedFace?.obj?.mesh) return this.getDefaultSketchPlane();

        const origin = this.selectedFace.point.clone();
        const w = this.selectedFace.normal.clone();
        w.transformDirection(this.selectedFace.obj.mesh.matrixWorld);
        w.normalize();

        const worldUp = new THREE.Vector3(0, 1, 0);
        const worldRight = new THREE.Vector3(1, 0, 0);
        let u = new THREE.Vector3().crossVectors(worldUp, w);
        if (u.lengthSq() < 1e-6) u = new THREE.Vector3().crossVectors(worldRight, w);
        u.normalize();
        const v = new THREE.Vector3().crossVectors(w, u).normalize();

        return { origin, u, v, w, offset: 0.15 };
    }

    getSketchPoint2(entity, ref) {
        if (!entity || !ref) return null;
        if (entity.type === 'circle') {
            if (ref === 'center') return entity.center?.clone?.() ?? null;
            return null;
        }
        if (entity.type === 'rect') {
            const p1 = entity.p1;
            const p2 = entity.p2;
            if (!p1 || !p2) return null;
            if (ref === 'p1') return p1.clone();
            if (ref === 'p2') return p2.clone();
            if (ref === 'p2x_p1y') return new THREE.Vector2(p2.x, p1.y);
            if (ref === 'p1x_p2y') return new THREE.Vector2(p1.x, p2.y);
            return null;
        }
        // line
        if (ref === 'p1') return entity.p1?.clone?.() ?? null;
        if (ref === 'p2') return entity.p2?.clone?.() ?? null;
        return null;
    }

    setSketchPoint2(entity, ref, p2) {
        if (!entity || !ref || !p2) return false;
        if (entity.type === 'circle') {
            if (ref !== 'center') return false;
            entity.center = p2.clone();
            return true;
        }
        if (entity.type === 'rect') {
            if (!entity.p1 || !entity.p2) return false;
            if (ref === 'p1') {
                entity.p1 = p2.clone();
                return true;
            }
            if (ref === 'p2') {
                entity.p2 = p2.clone();
                return true;
            }
            if (ref === 'p2x_p1y') {
                entity.p2 = new THREE.Vector2(p2.x, entity.p2.y);
                entity.p1 = new THREE.Vector2(entity.p1.x, p2.y);
                return true;
            }
            if (ref === 'p1x_p2y') {
                entity.p1 = new THREE.Vector2(p2.x, entity.p1.y);
                entity.p2 = new THREE.Vector2(entity.p2.x, p2.y);
                return true;
            }
            return false;
        }
        // line
        if (ref === 'p1') {
            entity.p1 = p2.clone();
            return true;
        }
        if (ref === 'p2') {
            entity.p2 = p2.clone();
            return true;
        }
        return false;
    }

    getSketchSelectablePointRefs(entity) {
        if (!entity) return [];
        if (entity.type === 'circle') return [{ entity, ref: 'center' }];
        if (entity.type === 'rect') {
            return [
                { entity, ref: 'p1' },
                { entity, ref: 'p2' },
                { entity, ref: 'p2x_p1y' },
                { entity, ref: 'p1x_p2y' },
            ];
        }
        return [{ entity, ref: 'p1' }, { entity, ref: 'p2' }];
    }

    pickSketchPointAt(p2) {
        if (!p2) return null;
        let best = null;
        let bestD2 = Infinity;
        const th = CONFIG.SKETCH_POINT_PICK_THRESHOLD;
        const th2 = th * th;
        for (const ent of this.sketchLines || []) {
            const refs = this.getSketchSelectablePointRefs(ent);
            for (const r of refs) {
                const sp = this.getSketchPoint2(r.entity, r.ref);
                if (!sp) continue;
                const dx = sp.x - p2.x;
                const dy = sp.y - p2.y;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestD2) {
                    bestD2 = d2;
                    best = r;
                }
            }
        }
        if (best && bestD2 <= th2) return best;
        return null;
    }

    updateSketchPointMarkers() {
        if (!this.scene) return;
        if (!this.sketchPointViz.group) {
            this.sketchPointViz.group = new THREE.Group();
            this.sketchPointViz.group.name = 'sketch-point-selection';
            this.scene.add(this.sketchPointViz.group);
        }
        if (!this.sketchPointViz.geom) this.sketchPointViz.geom = new THREE.SphereGeometry(0.35, 10, 10);
        if (!this.sketchPointViz.mat) this.sketchPointViz.mat = new THREE.MeshBasicMaterial({ color: CONFIG.SKETCH_SELECT_COLOR });

        const g = this.sketchPointViz.group;
        while (g.children.length) {
            const c = g.children.pop();
            c.geometry?.dispose?.();
            c.material?.dispose?.();
        }

        for (const s of this.sketchPointSelection || []) {
            const p = this.getSketchPoint2(s.entity, s.ref);
            if (!p) continue;
            const m = new THREE.Mesh(this.sketchPointViz.geom.clone(), this.sketchPointViz.mat.clone());
            m.position.copy(this.sketchToWorld(p));
            g.add(m);
        }
    }

    clearSketchPointSelection() {
        this.sketchPointSelection = [];
        this.updateSketchPointMarkers();
    }

    setSketchPointSelection(pointRef) {
        this.sketchPointSelection = pointRef ? [pointRef] : [];
        this.updateSketchPointMarkers();
    }

    toggleSketchPointSelection(pointRef) {
        if (!pointRef?.entity || !pointRef?.ref) return;
        const key = pointRef.entity.line?.id + ':' + pointRef.ref;
        const exists = (this.sketchPointSelection || []).some(s => (s?.entity?.line?.id + ':' + s?.ref) === key);
        this.sketchPointSelection = exists
            ? (this.sketchPointSelection || []).filter(s => (s?.entity?.line?.id + ':' + s?.ref) !== key)
            : [...(this.sketchPointSelection || []), pointRef];
        this.updateSketchPointMarkers();
    }

    solveSketchConstraints() {
        if (!this.sketchConstraints || this.sketchConstraints.length === 0) return;
        // small fixed-point loop
        for (let iter = 0; iter < 3; iter++) {
            for (const c of this.sketchConstraints) {
                if (!c) continue;
                if (c.type === 'horizontal') {
                    const ent = c.entity;
                    if (ent?.type !== 'line' || !ent.p1 || !ent.p2) continue;
                    ent.p2 = new THREE.Vector2(ent.p2.x, ent.p1.y);
                } else if (c.type === 'vertical') {
                    const ent = c.entity;
                    if (ent?.type !== 'line' || !ent.p1 || !ent.p2) continue;
                    ent.p2 = new THREE.Vector2(ent.p1.x, ent.p2.y);
                } else if (c.type === 'coincident') {
                    const a = c.a;
                    const b = c.b;
                    const pa = this.getSketchPoint2(a?.entity, a?.ref);
                    if (!pa) continue;
                    this.setSketchPoint2(b?.entity, b?.ref, pa);
                }
            }
        }

        // refresh entities that might have changed
        const touched = new Set();
        for (const c of this.sketchConstraints) {
            if (c?.entity?.line?.id) touched.add(c.entity.line.id);
            if (c?.a?.entity?.line?.id) touched.add(c.a.entity.line.id);
            if (c?.b?.entity?.line?.id) touched.add(c.b.entity.line.id);
        }
        for (const ent of this.sketchLines || []) {
            if (touched.has(ent?.line?.id)) this.refreshSketchEntity(ent);
        }
        this.updateSketchPointMarkers();
        this.updateSketchSelectionVisuals();
    }

    hasSketchConstraint(type, entity) {
        return (this.sketchConstraints || []).some(c => c?.type === type && c?.entity?.line?.id === entity?.line?.id);
    }

    applyLineConstraint(type) {
        const ent = (this.sketchSelection || [])[0];
        if (!this.sketchMode || this.currentTool !== 'select') return;
        if (!ent || ent.type !== 'line') {
            this.toast('Select a sketch line', 'warning');
            return;
        }
        if (this.hasSketchConstraint(type, ent)) {
            this.toast('Constraint already applied', 'info');
            return;
        }
        this.sketchConstraints.push({ type, entity: ent });
        this.solveSketchConstraints();
        this.toast((type === 'horizontal' ? 'Horizontal' : 'Vertical') + ' constraint added', 'success');
    }

    applyCoincidentConstraintFromSelection() {
        if (!this.sketchMode || this.currentTool !== 'select') return;
        if ((this.sketchPointSelection || []).length !== 2) {
            this.toast('Select two sketch points', 'warning');
            return;
        }
        const a = this.sketchPointSelection[0];
        const b = this.sketchPointSelection[1];
        this.sketchConstraints.push({ type: 'coincident', a, b });
        this.solveSketchConstraints();
        this.toast('Coincident constraint added', 'success');
    }

    getSketchEntityLabel(entity) {
        if (!entity) return 'Sketch';
        if (entity.type === 'rect') return 'Rectangle';
        if (entity.type === 'circle') return 'Circle';
        return 'Line';
    }

    updateSketchSelectionVisuals() {
        const selected = new Set((this.sketchSelection || []).map(s => s?.line?.id));
        for (const s of this.sketchLines || []) {
            const mat = s?.line?.material;
            if (!mat?.color) continue;
            const isSelected = selected.has(s.line.id);
            mat.color.setHex(isSelected ? CONFIG.SKETCH_SELECT_COLOR : (s.baseColor ?? CONFIG.SKETCH_LINE_COLOR));
        }
        this.updateSketchPointMarkers();
    }

    clearSketchSelection() {
        this.sketchSelection = [];
        this.clearSketchPointSelection();
        this.updateSketchSelectionVisuals();
    }

    toggleSketchSelection(entity) {
        if (!entity?.line) return;
        const id = entity.line.id;
        const exists = (this.sketchSelection || []).some(s => s?.line?.id === id);
        this.sketchSelection = exists
            ? (this.sketchSelection || []).filter(s => s?.line?.id !== id)
            : [...(this.sketchSelection || []), entity];
        this.updateSketchSelectionVisuals();
    }

    setSketchSelection(entity) {
        this.sketchSelection = entity ? [entity] : [];
        this.updateSketchSelectionVisuals();
    }

    pickSketchEntityAtMouse() {
        const lines = (this.sketchLines || []).map(s => s?.line).filter(Boolean);
        if (lines.length === 0) return null;

        const hits = this.raycaster.intersectObjects(lines, true);
        if (!hits || hits.length === 0) return null;
        const hitObj = hits[0].object;
        const ent = (this.sketchLines || []).find(s => s?.line === hitObj);
        return ent || null;
    }

    refreshSketchEntity(entity) {
        if (!entity?.line || !this.scene) return;
        const oldGeom = entity.line.geometry;

        if (entity.type === 'rect') {
            const p1 = entity.p1;
            const p2 = entity.p2;
            const points = [
                this.sketchToWorld(new THREE.Vector2(p1.x, p1.y)),
                this.sketchToWorld(new THREE.Vector2(p2.x, p1.y)),
                this.sketchToWorld(new THREE.Vector2(p2.x, p2.y)),
                this.sketchToWorld(new THREE.Vector2(p1.x, p2.y)),
                this.sketchToWorld(new THREE.Vector2(p1.x, p1.y)),
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            entity.geometry = geometry;
            entity.line.geometry = geometry;
        } else if (entity.type === 'circle') {
            const curve = new THREE.EllipseCurve(entity.center.x, entity.center.y, entity.radius, entity.radius, 0, 2 * Math.PI, false, 0);
            const points = curve.getPoints(CONFIG.SKETCH_CIRCLE_POINTS).map(p => this.sketchToWorld(new THREE.Vector2(p.x, p.y)));
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            entity.geometry = geometry;
            entity.line.geometry = geometry;
        } else {
            const points = [
                this.sketchToWorld(new THREE.Vector2(entity.p1.x, entity.p1.y)),
                this.sketchToWorld(new THREE.Vector2(entity.p2.x, entity.p2.y)),
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            entity.geometry = geometry;
            entity.line.geometry = geometry;
        }

        oldGeom?.dispose?.();
    }

    configureSketchDimModalFor(entity) {
        if (!entity) return;
        const title = this.getSketchEntityLabel(entity) + ' Dimension';
        if (this.skdimTitleEl) this.skdimTitleEl.textContent = title;

        const a = this.skdimAEl;
        const b = this.skdimBEl;
        if (!a || !b) return;

        b.style.display = 'none';
        a.value = '';
        b.value = '';

        if (entity.type === 'rect') {
            const w = Math.abs(entity.p2.x - entity.p1.x);
            const h = Math.abs(entity.p2.y - entity.p1.y);
            a.placeholder = 'Width (mm)';
            b.placeholder = 'Height (mm)';
            a.value = w.toFixed(2);
            b.value = h.toFixed(2);
            b.style.display = '';
        } else if (entity.type === 'circle') {
            a.placeholder = 'Radius (mm)';
            a.value = (entity.radius ?? 1).toFixed(2);
        } else {
            const dx = entity.p2.x - entity.p1.x;
            const dy = entity.p2.y - entity.p1.y;
            const len = Math.sqrt(dx * dx + dy * dy);
            a.placeholder = 'Length (mm)';
            a.value = len.toFixed(2);
        }
    }

    applySketchDimFromModal(entity) {
        if (!entity || !this.skdimAEl || !this.skdimBEl) return false;
        const parse = (el) => {
            const t = (el.value ?? '').toString().trim();
            const n = parseFloat(t);
            return Number.isFinite(n) ? n : null;
        };
        const a = parse(this.skdimAEl);
        const b = parse(this.skdimBEl);
        if (a == null || a <= 0) {
            this.toast('Enter a positive value', 'warning');
            return false;
        }

        if (entity.type === 'rect') {
            if (b == null || b <= 0) {
                this.toast('Enter width and height', 'warning');
                return false;
            }
            const sx = Math.sign(entity.p2.x - entity.p1.x) || 1;
            const sy = Math.sign(entity.p2.y - entity.p1.y) || 1;
            entity.p2 = new THREE.Vector2(entity.p1.x + sx * a, entity.p1.y + sy * b);
        } else if (entity.type === 'circle') {
            entity.radius = a;
        } else {
            const dir = entity.p2.clone().sub(entity.p1);
            const len = dir.length();
            if (len < 1e-6) {
                entity.p2 = entity.p1.clone().add(new THREE.Vector2(a, 0));
            } else {
                dir.multiplyScalar(a / len);
                entity.p2 = entity.p1.clone().add(dir);
            }
        }
        this.refreshSketchEntity(entity);
        this.updateSketchSelectionVisuals();
        this.solveSketchConstraints();
        return true;
    }

    startSketchDimCommand(entity) {
        if (!this.sketchMode) return;
        if (!entity) return;

        const modalId = 'm-sketch-dim';
        this.configureSketchDimModalFor(entity);

        this.startCommand({
            name: 'sketch-dim',
            title: 'Sketch Dimension',
            hudKind: 'sketch',
            hint: 'Enter=Apply, Esc=Cancel',
            modalId,
            start: () => {
                this.openModal(modalId);
                setTimeout(() => this.skdimAEl?.focus?.(), 0);
            },
            confirm: () => {
                const ok = this.applySketchDimFromModal(entity);
                if (!ok) {
                    // keep command active by restarting it
                    this.activeCommand = null;
                    this.startSketchDimCommand(entity);
                    return;
                }
                this.closeModal(modalId);
                this.toast(this.getSketchEntityLabel(entity) + ' updated', 'success');
            },
            cancel: () => {
                this.closeModal(modalId);
            },
        });
    }

    sketchToWorld(p2) {
        const sp = this.sketchPlane || this.getDefaultSketchPlane();
        return sp.origin.clone()
            .addScaledVector(sp.u, p2.x)
            .addScaledVector(sp.v, p2.y)
            .addScaledVector(sp.w, sp.offset);
    }

    worldToSketch(p3) {
        const sp = this.sketchPlane || this.getDefaultSketchPlane();
        const d = p3.clone().sub(sp.origin);
        return new THREE.Vector2(d.dot(sp.u), d.dot(sp.v));
    }

    hasBodySelection() {
        return (this.selection || []).some(p => p?.kind === 'body' && p?.obj?.mesh);
    }

    getSelectedBodies() {
        const bodies = (this.selection || []).filter(p => p?.kind === 'body' && p?.obj?.mesh).map(p => p.obj);
        if (bodies.length > 0) return bodies;
        return this.selectedObj?.mesh ? [this.selectedObj] : [];
    }

    showNumericHUD(kind) {
        if (!this.numHudEl) return;
        this.numericHudKind = kind;

        const title = kind === 'move' ? 'Move Δ (mm)' : kind === 'rotate' ? 'Rotate Δ (deg)' : 'Scale × (factor)';
        if (this.numHudTitleEl) this.numHudTitleEl.textContent = title;

        const defaults = kind === 'scale' ? { x: '1', y: '1', z: '1' } : { x: '0', y: '0', z: '0' };
        if (this.numHudXEl) this.numHudXEl.placeholder = defaults.x;
        if (this.numHudYEl) this.numHudYEl.placeholder = defaults.y;
        if (this.numHudZEl) this.numHudZEl.placeholder = defaults.z;

        this.numHudEl.classList.add('active');
        this.numHudEl.setAttribute('aria-hidden', 'false');
        setTimeout(() => this.numHudXEl?.focus?.(), 0);
    }

    hideNumericHUD() {
        if (!this.numHudEl) return;
        this.numericHudKind = null;
        this.numHudEl.classList.remove('active');
        this.numHudEl.setAttribute('aria-hidden', 'true');
    }

    clearNumericHUDInputs() {
        if (this.numHudXEl) this.numHudXEl.value = '';
        if (this.numHudYEl) this.numHudYEl.value = '';
        if (this.numHudZEl) this.numHudZEl.value = '';
    }

    parseNumericHUDVector(kind) {
        const parse = (val) => {
            const t = (val ?? '').toString().trim();
            if (!t) return null;
            const n = parseFloat(t);
            return Number.isFinite(n) ? n : null;
        };
        const x = parse(this.numHudXEl?.value);
        const y = parse(this.numHudYEl?.value);
        const z = parse(this.numHudZEl?.value);
        if (x == null && y == null && z == null) {
            return kind === 'scale' ? { x: 1, y: 1, z: 1 } : { x: 0, y: 0, z: 0 };
        }
        return {
            x: x == null ? (kind === 'scale' ? 1 : 0) : x,
            y: y == null ? (kind === 'scale' ? 1 : 0) : y,
            z: z == null ? (kind === 'scale' ? 1 : 0) : z,
        };
    }

    applyNumericHUD() {
        const kind = this.numericHudKind;
        if (!kind) return;
        const targets = this.getSelectedBodies();
        if (targets.length === 0) {
            this.toast('Select a body first', 'warning');
            return;
        }
        const v = this.parseNumericHUDVector(kind);
        if (!v) return;

        if (kind === 'move') {
            targets.forEach(obj => {
                obj.mesh.position.x += v.x;
                obj.mesh.position.y += v.y;
                obj.mesh.position.z += v.z;
            });
            this.toast(`Moved Δ(${v.x}, ${v.y}, ${v.z})`, 'success');
        } else if (kind === 'rotate') {
            const rx = THREE.MathUtils.degToRad(v.x);
            const ry = THREE.MathUtils.degToRad(v.y);
            const rz = THREE.MathUtils.degToRad(v.z);
            targets.forEach(obj => {
                obj.mesh.rotation.x += rx;
                obj.mesh.rotation.y += ry;
                obj.mesh.rotation.z += rz;
            });
            this.toast(`Rotated Δ(${v.x}°, ${v.y}°, ${v.z}°)`, 'success');
        } else if (kind === 'scale') {
            targets.forEach(obj => {
                obj.mesh.scale.x *= v.x;
                obj.mesh.scale.y *= v.y;
                obj.mesh.scale.z *= v.z;
            });
            this.toast(`Scaled ×(${v.x}, ${v.y}, ${v.z})`, 'success');
        }

        this.updateProps();
        this.updateTree();
        this.clearNumericHUDInputs();
    }

    clearPreview() {
        if (!this.preview?.mesh) return;
        const m = this.preview.mesh;
        this.scene?.remove(m);
        m.geometry?.dispose?.();
        m.material?.dispose?.();
        this.preview.mesh = null;
    }

    setPreviewMesh(mesh) {
        this.clearPreview();
        if (!mesh) return;
        this.preview.mesh = mesh;
        this.scene.add(mesh);
    }

    buildExtrudePreviewMesh(depth) {
        if (!this.scene) return null;

        let d = parseFloat(depth);
        if (isNaN(d) || d === 0) d = CONFIG.DEFAULT_EXTRUDE_DEPTH;
        const sign = Math.sign(d) || 1;
        const absDepth = Math.abs(d);
        if (absDepth < 0.1) return null;

        const previewMat = new THREE.MeshStandardMaterial({
            color: 0xf97316,
            transparent: true,
            opacity: 0.25,
            roughness: 0.5,
            metalness: 0.1,
            depthWrite: false,
        });

        const sp = this.sketchPlane || (this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane());

        // Preview from sketch
        if (this.sketchLines.length > 0) {
            const sketch = this.sketchLines[this.sketchLines.length - 1];
            let geometry;
            if (sketch.type === 'rect') {
