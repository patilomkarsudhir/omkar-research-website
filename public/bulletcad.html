    onCanvasClick(e) {
        if (this.transform?.dragging) return;
        const rect = this.canvas.getBoundingClientRect();
        this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        this.raycaster.setFromCamera(this.mouse, this.camera);

        if (this.currentTool === 'measure') {
            const p = this.getWorldPointFromMouse();
            if (p) this.addMeasurePoint(p);
            return;
        }

        // If a sketch tool is active but we haven't picked a plane yet, first click chooses the plane.
        if (!this.sketchMode && this.pendingSketchPlanePick && ['line', 'rect', 'circle'].includes(this.currentTool)) {
            const facePick = this.pickFaceAtMouse();
            if (facePick) {
                this.selectFace(facePick.obj, facePick.faceIdx, facePick.point, facePick.normal);
                this.sketchPlane = this.computeSketchPlaneFromSelectedFace();
                this.startSketchSession({ plane: this.sketchPlane });
                this.setHUD('Sketch: ' + this.currentTool + ' (ESC to exit)', 'sketch');
                return;
            }

            // Fallback to ground/grid plane
            const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const pt = new THREE.Vector3();
            const hit = this.raycaster.ray.intersectPlane(ground, pt);
            if (hit) {
                this.clearSelection();
                const plane = this.createSketchPlaneAtWorldPoint(pt);
                this.startSketchSession({ plane });
                this.setHUD('Sketch: ' + this.currentTool + ' (ESC to exit)', 'sketch');
                return;
            }
            return;
        }

        if (this.sketchMode || ['line', 'rect', 'circle'].includes(this.currentTool)) {
            // In sketch mode, Select tool performs sketch entity selection.
            if (this.sketchMode && this.currentTool === 'select') {
                if (!this.sketchPlane) {
                    this.sketchPlane = this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane();
                }
                const sp = this.sketchPlane || this.getDefaultSketchPlane();
                const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sp.w, sp.origin);
                const pt = new THREE.Vector3();
                const hit = this.raycaster.ray.intersectPlane(plane, pt);
                const p2 = hit ? this.worldToSketch(pt) : null;
                const pickedPoint = p2 ? this.pickSketchPointAt(p2) : null;
                if (pickedPoint) {
                    // point selection
                    if (e.shiftKey || e.ctrlKey || e.metaKey) this.toggleSketchPointSelection(pickedPoint);
                    else this.setSketchPointSelection(pickedPoint);
                    if (!e.shiftKey && !e.ctrlKey && !e.metaKey) this.sketchSelection = [];
                    this.updateSketchSelectionVisuals();
                    return;
                }

                const ent = this.pickSketchEntityAtMouse();
                if (!ent) {
                    if (!e.shiftKey && !e.ctrlKey && !e.metaKey) this.clearSketchSelection();
                    return;
                }
                if (e.shiftKey || e.ctrlKey || e.metaKey) this.toggleSketchSelection(ent);
                else this.setSketchSelection(ent);
                if (!e.shiftKey && !e.ctrlKey && !e.metaKey) this.clearSketchPointSelection();
                return;
            }

            if (!this.sketchPlane) {
                this.sketchPlane = this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane();
            }
            const sp = this.sketchPlane || this.getDefaultSketchPlane();
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sp.w, sp.origin);
            const pt = new THREE.Vector3();
            const hit = this.raycaster.ray.intersectPlane(plane, pt);
            if (hit) {
                const p2 = this.worldToSketch(pt);
                this.addSketchPoint(p2, { disableSnap: e.shiftKey });
            }
            return;
        }

        const picked = this.pickAtMouse();
        const mode = this.currentTool === 'face' ? 'face' : this.selectionMode;
        if (!picked) {
            if (e.shiftKey || e.ctrlKey || e.metaKey) return;
            this.clearSelection();
            this.hudEl.className = 'hud';
            return;
        }

        if (mode === 'body') {
            if (e.shiftKey) this.addBodyToSelection(picked);
            else if (e.ctrlKey || e.metaKey) this.toggleBodySelection(picked);
            else this.setBodySelection(picked);
            return;
        }
        if (mode === 'face') {
            const faceIdx = picked.faceIdx ?? picked.hit?.faceIndex;
            const normal = picked.normal ?? picked.hit?.face?.normal ?? new THREE.Vector3(0, 1, 0);
            this.selectFace(picked.obj, faceIdx, picked.point, normal);
            return;
        }

        this.selection = [picked];
        this.selectedFace = null;
        this.selectObject(picked.obj);
        this.updateSelectionStatus();
    }

    onKeyUp(e) {
        if (e.key === 'Shift') {
            this.shiftDown = false;
            this.updateTransformSnapping();
        }
    }

    onCanvasMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        this.raycaster.setFromCamera(this.mouse, this.camera);

        const meshes = this.objects.map(o => o.mesh);
        const hits = this.raycaster.intersectObjects(meshes);
        if (hits.length > 0) {
            const point = hits[0].point;
            this.coordsEl.textContent = `X: ${point.x.toFixed(1)} Y: ${point.y.toFixed(1)} Z: ${point.z.toFixed(1)}`;
        } else {
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const pt = new THREE.Vector3();
            this.raycaster.ray.intersectPlane(plane, pt);
            if (pt) this.coordsEl.textContent = `X: ${pt.x.toFixed(1)} Y: ${pt.y.toFixed(1)} Z: ${pt.z.toFixed(1)}`;
        }

        // Sketch UX: hover feedback + rubber-band previews
        if (this.sketchMode) {
            if (['line', 'rect', 'circle'].includes(this.currentTool)) {
                this.updateSketchRubberBand({ disableSnap: e.shiftKey });
            } else if (this.currentTool === 'select') {
                // Show hover marker for selectable sketch points
                if (!this.sketchPlane) this.sketchPlane = this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane();
                const sp = this.sketchPlane || this.getDefaultSketchPlane();
                const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sp.w, sp.origin);
                const pt = new THREE.Vector3();
                const hit = this.raycaster.ray.intersectPlane(plane, pt);
                const p2 = hit ? this.worldToSketch(pt) : null;
                const pickedPoint = p2 ? this.pickSketchPointAt(p2) : null;
                if (pickedPoint) {
                    const pSel = this.getSketchPoint2(pickedPoint.entity, pickedPoint.ref);
                    this.setSketchHoverMarkerWorld(pSel ? this.sketchToWorld(pSel) : null, { visible: true });
                } else {
                    this.setSketchHoverMarkerWorld(null);
                }
            } else {
                this.setSketchHoverMarkerWorld(null);
                this.clearSketchDraft();
            }
        }

        const prev = this.hoverSelection;

        // While picking a sketch plane, always hover faces (not bodies) so the user sees the target.
        if (!this.sketchMode && this.pendingSketchPlanePick && ['line', 'rect', 'circle'].includes(this.currentTool)) {
            const facePick = this.pickFaceAtMouse();
            if (facePick) {
                this.hoverSelection = { kind: 'face', obj: facePick.obj, faceIdx: facePick.faceIdx, point: facePick.point.clone(), normal: facePick.normal.clone() };
                this.setSketchHoverMarkerWorld(facePick.point, { visible: true });
            } else {
                this.hoverSelection = null;
                // Ground plane hover marker
                const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                const pt = new THREE.Vector3();
                const hit = this.raycaster.ray.intersectPlane(ground, pt);
                this.setSketchHoverMarkerWorld(hit ? pt : null, { visible: !!hit });
            }
        } else {
            this.hoverSelection = this.pickAtMouse();
            if (!this.sketchMode) this.setSketchHoverMarkerWorld(null);
        }

        const changed = (prev?.kind ?? null) !== (this.hoverSelection?.kind ?? null)
            || (prev?.obj?.id ?? null) !== (this.hoverSelection?.obj?.id ?? null)
            || (prev?.faceIdx ?? null) !== (this.hoverSelection?.faceIdx ?? null);
        if (changed) this.updateHighlights();
    }

    onKeyDown(e) {
        const key = e.key.toLowerCase();

        // Step 4: command confirm/cancel should work even inside inputs
        if (this.activeCommand) {
            if (key === 'escape') {
                e.preventDefault();
                this.cancelActiveCommand();
                return;
            }
            if (key === 'enter') {
                e.preventDefault();
                this.confirmActiveCommand();
                return;
            }
        }

        if (e.target.tagName === 'INPUT') return;

        if (e.key === 'Shift') {
            this.shiftDown = true;
            this.updateTransformSnapping();
        }

        // Step 9: quick sketch dimension editing
        if (key === 'enter' && this.sketchMode && this.currentTool === 'select' && (this.sketchSelection || []).length === 1) {
            e.preventDefault();
            this.startSketchDimCommand(this.sketchSelection[0]);
            return;
        }

        // Step 10: basic constraints/relations (sketch select tool)
        if (this.sketchMode && this.currentTool === 'select') {
            if (key === 'h') {
                e.preventDefault();
                this.applyLineConstraint('horizontal');
                return;
            }
            if (key === 'j') {
                e.preventDefault();
                this.applyLineConstraint('vertical');
                return;
            }
            if (key === 'o') {
                e.preventDefault();
                this.applyCoincidentConstraintFromSelection();
                return;
            }
        }

        if (key === 'v') {
            this.setTool('select');
            this.setSelectionMode('body');
        }
        if (key === 'f') {
            this.setTool('face');
            this.setSelectionMode('face');
        }
        if (key === 'e' && !e.ctrlKey && !e.metaKey) this.setSelectionMode('edge');
        if (key === 'x' && !e.ctrlKey && !e.metaKey) this.setSelectionMode('vertex');
        if (key === 'g') this.setTool('move');
        if (key === 'r') this.setTool('rotate');
        if (key === 's' && !e.ctrlKey) this.setTool('scale');
        if (key === 'l') this.setTool('line');
        if (key === 'b') this.setTool('rect');
        if (key === 'c') this.setTool('circle');
        if (key === 'k') this.enterSketchMode();

        if (key === 'm') this.setTool('measure');
        if (key === 'i') this.toggleIsolate();

        if (key === 'delete' || key === 'backspace') this.deleteSelected();
        if (key === 'escape') {
            if (this.currentTool === 'measure') {
                this.clearMeasure();
                return;
            }
            if (this.sketchMode) this.exitSketchMode();
            else this.clearSelection();
        }

        if ((e.ctrlKey || e.metaKey) && key === 'z') {
            e.preventDefault();
            this.undo();
        }
        if ((e.ctrlKey || e.metaKey) && key === 'y') {
            e.preventDefault();
            this.redo();
        }
        if ((e.ctrlKey || e.metaKey) && key === 'd') {
            e.preventDefault();
            this.duplicateSelected();
        }
        if ((e.ctrlKey || e.metaKey) && key === 'e') {
            e.preventDefault();
            this.startExtrudeCommand({ title: 'Extrude' });
        }
    }

    onResize() {
        const w = Math.max(1, this.canvas.clientWidth || 0);
        const h = Math.max(1, this.canvas.clientHeight || 0);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h);
    }

    bindEvents() {
        this.canvas.addEventListener('click', this.onCanvasClick);
        this.canvas.addEventListener('mousemove', this.onCanvasMove);
        document.addEventListener('keydown', this.onKeyDown);
        document.addEventListener('keyup', this.onKeyUp);
        window.addEventListener('resize', this.onResize);

        document.getElementById('t-select').addEventListener('click', () => {
            this.setTool('select');
            this.setSelectionMode('body');
        });
        document.getElementById('t-face').addEventListener('click', () => {
            this.setTool('face');
            this.setSelectionMode('face');
        });
        document.getElementById('t-move').addEventListener('click', () => this.setTool('move'));
        document.getElementById('t-rotate').addEventListener('click', () => this.setTool('rotate'));
        document.getElementById('t-scale').addEventListener('click', () => this.setTool('scale'));
        document.getElementById('t-line').addEventListener('click', () => this.setTool('line'));
        document.getElementById('t-rect').addEventListener('click', () => this.setTool('rect'));
        document.getElementById('t-circle').addEventListener('click', () => this.setTool('circle'));
        document.getElementById('t-measure').addEventListener('click', () => this.setTool('measure'));
        document.getElementById('t-undo').addEventListener('click', () => this.undo());
        document.getElementById('t-redo').addEventListener('click', () => this.redo());

        document.querySelectorAll('#sel-mode .seg-btn').forEach(b => {
            b.addEventListener('click', () => {
                this.setSelectionMode(b.dataset.selmode);
                if (b.dataset.selmode === 'face') this.setTool('face');
                else if (this.currentTool === 'face') this.setTool('select');
            });

        document.querySelectorAll('.prim-btn').forEach(btn => btn.addEventListener('click', () => this.createPrimitive(btn.dataset.prim)));

        document.getElementById('f-extrude').addEventListener('click', () => {
            this.startExtrudeCommand({ title: 'Extrude' });
        });
        document.getElementById('f-cut').addEventListener('click', () => {

            }

        });

            this.startModalCommand({
                modalId: 'm-fillet',
                title: 'Fillet',

            });
        });
        document.getElementById('f-chamfer').addEventListener('click', () => {
            this.startModalCommand({
                modalId: 'm-chamfer',
                title: 'Chamfer',
                hudKind: 'face',
                confirmLabel: 'Apply',
                confirm: () => this.doChamfer(),
            });
        });

        document.getElementById('extrude-ok').addEventListener('click', () => {
            if (this.activeCommand?.modalId === 'm-extrude') this.confirmActiveCommand();
            else {
                this.doExtrude();
                this.closeModal('m-extrude');
            }
        });
        document.getElementById('cut-ok').addEventListener('click', () => {
            if (this.activeCommand?.modalId === 'm-cut') this.confirmActiveCommand();
            else {
                this.doCut();
                this.closeModal('m-cut');
            }
        });
        document.getElementById('fillet-ok').addEventListener('click', () => {
            if (this.activeCommand?.modalId === 'm-fillet') this.confirmActiveCommand();
            else {
                this.doFillet();
                this.closeModal('m-fillet');
            }
        });
        document.getElementById('chamfer-ok').addEventListener('click', () => {
            if (this.activeCommand?.modalId === 'm-chamfer') this.confirmActiveCommand();
            else {
                this.doChamfer();
                this.closeModal('m-chamfer');
            }
        });

        document.getElementById('skdim-ok')?.addEventListener('click', () => {
            if (this.activeCommand?.modalId === 'm-sketch-dim') this.confirmActiveCommand();
            else {
                const ent = (this.sketchSelection || [])[0];
                if (ent && this.applySketchDimFromModal(ent)) {
                    this.toast(this.getSketchEntityLabel(ent) + ' updated', 'success');
                    this.closeModal('m-sketch-dim');
                }
            }
        });

        this.saveBtnEl?.addEventListener('click', () => this.saveProject());
        this.loadBtnEl?.addEventListener('click', () => this.loadProject());

        document.getElementById('btn-import').addEventListener('click', () => this.importSTL());
        this.stlFileInputEl.addEventListener('change', e => this.handleSTLImport(e));
        document.getElementById('btn-export').addEventListener('click', () => this.exportSTL());
        document.getElementById('btn-export-step').addEventListener('click', () => this.exportSTEP());

        document.getElementById('render-shaded').addEventListener('click', () => this.setRenderMode('shaded'));
        document.getElementById('render-wireframe').addEventListener('click', () => this.setRenderMode('wireframe'));
        document.getElementById('render-edges').addEventListener('click', () => this.setRenderMode('edges'));

        // Step 6: numeric HUD keyboard handling
        const onNumKey = (e) => {
            if (!this.numericHudKind) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                this.applyNumericHUD();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                this.hideNumericHUD();
            }
        };
        this.numHudXEl?.addEventListener('keydown', onNumKey);
        this.numHudYEl?.addEventListener('keydown', onNumKey);
        this.numHudZEl?.addEventListener('keydown', onNumKey);
    }

    animate() {
        requestAnimationFrame(this.animate);
        this.orbit.update();
        this.renderer.render(this.scene, this.camera);
    }

    start() {
        this.initThree();
        this.bindEvents();
        this.onResize();
        this.updateUndoButtons();
        this.setSelectionMode('body');
        this.animate();
        this.toast('BulletCAD ready! Create shapes to begin.', 'success');
    }
}

const __bulletCadApp = new BulletCADApp();
window.toast = (...args) => __bulletCadApp.toast(...args);
window.openModal = id => __bulletCadApp.openModal(id);
window.closeModal = id => __bulletCadApp.onModalCancel(id);
__bulletCadApp.start();
</script>

</body>
</html>
