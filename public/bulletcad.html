                const w = Math.abs(sketch.p2.x - sketch.p1.x);
                const dz = Math.abs(sketch.p2.y - sketch.p1.y);
                geometry = new THREE.BoxGeometry(w, absDepth, dz);
            } else if (sketch.type === 'circle') {
                geometry = new THREE.CylinderGeometry(sketch.radius, sketch.radius, absDepth, CONFIG.GEOMETRY_SEGMENTS);
            } else {
                previewMat.dispose();
                return null;
            }
            const mesh = new THREE.Mesh(geometry, previewMat);
            mesh.castShadow = false;
            mesh.receiveShadow = false;

            const center2 = sketch.type === 'rect'
                ? new THREE.Vector2((sketch.p1.x + sketch.p2.x) / 2, (sketch.p1.y + sketch.p2.y) / 2)
                : sketch.center.clone();
            const centerW = (this.sketchPlane ? this.sketchToWorld(center2) : sp.origin.clone().addScaledVector(sp.u, center2.x).addScaledVector(sp.v, center2.y).addScaledVector(sp.w, sp.offset));
            mesh.position.copy(centerW);
            mesh.position.addScaledVector(sp.w, (sign * absDepth) / 2);
            mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), sp.w));
            return mesh;
        }

        // Preview from selected face (fallback)
        if (this.selectedFace) {
            const faceNormal = this.selectedFace.normal.clone();
            faceNormal.transformDirection(this.selectedFace.obj.mesh.matrixWorld);
            faceNormal.normalize();
            const facePoint = this.selectedFace.point.clone();

            const baseGeometry = this.selectedFace.obj.mesh.geometry;
            baseGeometry.computeBoundingBox();
            const bb = baseGeometry.boundingBox;
            const width = bb.max.x - bb.min.x;
            const depthBB = bb.max.z - bb.min.z;
            const geometry = new THREE.BoxGeometry(width * 0.8, absDepth, depthBB * 0.8);
            const mesh = new THREE.Mesh(geometry, previewMat);
            mesh.castShadow = false;
            mesh.receiveShadow = false;
            mesh.position.copy(facePoint);
            mesh.position.addScaledVector(faceNormal, (sign * absDepth) / 2);
            mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), faceNormal));
            return mesh;
        }

        previewMat.dispose();
        return null;
    }

    startExtrudeCommand({ title = 'Extrude' } = {}) {
        const modalId = 'm-extrude';
        const input = document.getElementById('extrude-val');
        const updatePreview = () => {
            const mesh = this.buildExtrudePreviewMesh(input?.value);
            if (mesh) this.setPreviewMesh(mesh);
            else this.clearPreview();
        };

        let onInput = null;
        this.startCommand({
            name: 'extrude',
            title,
            hudKind: 'face',
            hint: 'Enter=OK, Esc=Cancel',
            modalId,
            start: () => {
                this.openModal(modalId);
                updatePreview();
                if (input) {
                    onInput = () => updatePreview();
                    input.addEventListener('input', onInput);
                    setTimeout(() => input.focus(), 0);
                }
            },
            confirm: () => {
                if (input && onInput) input.removeEventListener('input', onInput);
                this.clearPreview();
                this.doExtrude();
            },
            cancel: () => {
                if (input && onInput) input.removeEventListener('input', onInput);
                this.clearPreview();
                this.closeModal(modalId);
            },
        });
    }

    setHUD(text, kind = null) {
        this.hudEl.textContent = text;
        if (!kind) {
            this.hudEl.className = 'hud';
            return;
        }
        this.hudEl.className = 'hud active ' + kind;
    }

    startCommand(command) {
        if (!command || typeof command !== 'object') return;
        if (this.activeCommand && this.activeCommand !== command) {
            try {
                this.activeCommand.cancel?.();
            } catch {
                // ignore
            }
        }
        this.activeCommand = command;
        try {
            command.start?.();
        } catch (err) {
            console.error('Command start failed:', err);
            this.toast('Command failed: ' + (err?.message ?? String(err)), 'error');
            this.activeCommand = null;
            this.setHUD('', null);
            return;
        }

        const hint = command.hint || 'Enter=OK, Esc=Cancel';
        this.setHUD((command.title || command.name || 'Command') + ' — ' + hint, command.hudKind || 'face');
    }

    cancelActiveCommand() {
        if (!this.activeCommand) return;
        const cmd = this.activeCommand;
        this.activeCommand = null;
        try {
            cmd.cancel?.();
        } catch (err) {
            console.error('Command cancel failed:', err);
        }
        this.setHUD('', null);
    }

    confirmActiveCommand() {
        if (!this.activeCommand) return;
        const cmd = this.activeCommand;
        this.activeCommand = null;
        try {
            cmd.confirm?.();
        } catch (err) {
            console.error('Command confirm failed:', err);
            this.toast('Command failed: ' + (err?.message ?? String(err)), 'error');
        }
        this.setHUD('', null);
    }

    startModalCommand({ modalId, title, hudKind = 'face', confirmLabel = 'OK', confirm }) {
        if (!modalId || typeof confirm !== 'function') return;
        this.startCommand({
            name: 'modal:' + modalId,
            title,
            hudKind,
            hint: 'Enter=' + confirmLabel + ', Esc=Cancel',
            start: () => this.openModal(modalId),
            confirm: () => {
                confirm();
                this.closeModal(modalId);
            },
            cancel: () => this.closeModal(modalId),
            modalId,
        });
    }

    onModalCancel(modalId) {
        if (this.activeCommand?.modalId === modalId) {
            this.cancelActiveCommand();
            return true;
        }
        this.closeModal(modalId);
        return false;
    }

    toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = msg;
        this.toastsEl.appendChild(t);
        setTimeout(() => t.remove(), CONFIG.TOAST_DURATION);
    }

    openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0a0a0a);

        // Step 9: improve picking for sketch lines
        this.raycaster.params.Line = this.raycaster.params.Line || {};
        this.raycaster.params.Line.threshold = CONFIG.SKETCH_PICK_THRESHOLD;

        if (this.sketchPointViz.group) {
            this.scene.remove(this.sketchPointViz.group);
            this.sketchPointViz.group = null;
        }

        const w = Math.max(1, this.canvas.clientWidth || 0);
        const h = Math.max(1, this.canvas.clientHeight || 0);

        this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 5000);
        this.camera.position.set(80, 60, 80);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
        this.renderer.setSize(w, h);
        this.renderer.shadowMap.enabled = true;

        this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        this.scene.add(dirLight);

        this.scene.add(new THREE.GridHelper(CONFIG.GRID_SIZE, CONFIG.GRID_DIVISIONS, 0x444444, 0x222222));

        this.orbit = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.orbit.enableDamping = true;

        this.transform = new THREE.TransformControls(this.camera, this.renderer.domElement);
        this.transform.addEventListener('dragging-changed', e => (this.orbit.enabled = !e.value));
        this.transform.addEventListener('objectChange', () => {
            if (this.selectedObj) this.updateProps();
        });
        this.scene.add(this.transform);

        this.highlight.group = new THREE.Group();
        this.highlight.group.name = 'Highlight';
        this.scene.add(this.highlight.group);
    }

    createMaterial(color = 0xf97316) {
        return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1 });
    }

    setSelectionMode(mode) {
        this.selectionMode = mode;
        const wrap = document.getElementById('sel-mode');
        if (wrap) wrap.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.selmode === mode));
    }

    updateSelectionStatus() {
        if (!this.selection || this.selection.length === 0) {
            this.statusSelEl.textContent = 'None';
            return;
        }
        const primary = this.selection[this.selection.length - 1];
        if (!primary?.obj) {
            this.statusSelEl.textContent = 'None';
            return;
        }
        if (this.selection.length === 1) {
            if (primary.kind === 'face' && typeof primary.faceIdx === 'number') {
                this.statusSelEl.textContent = primary.obj.name + ' (Face ' + primary.faceIdx + ')';
            } else if (primary.kind && primary.kind !== 'body') {
                this.statusSelEl.textContent = primary.obj.name + ' (' + primary.kind + ')';
            } else {
                this.statusSelEl.textContent = primary.obj.name;
            }
            return;
        }
        this.statusSelEl.textContent = this.selection.length + ' selected (primary: ' + primary.obj.name + ')';
    }

    isBodySelected(obj) {
        return this.selection.some(p => p?.kind === 'body' && p?.obj?.id === obj?.id);
    }

    setBodySelection(pick) {
        this.selection = pick ? [pick] : [];
        this.selectedFace = null;
        this.selectObject(pick?.obj ?? null);
        this.updateSelectionStatus();
    }

    addBodyToSelection(pick) {
        if (!pick?.obj) return;
        if (!this.isBodySelected(pick.obj)) this.selection.push(pick);
        this.selectedFace = null;
        this.selectObject(pick.obj);
        this.updateSelectionStatus();
    }

    toggleBodySelection(pick) {
        if (!pick?.obj) return;
        const exists = this.isBodySelected(pick.obj);
        if (exists) {
            this.selection = this.selection.filter(p => !(p?.kind === 'body' && p?.obj?.id === pick.obj.id));
            const primary = this.selection[this.selection.length - 1];
            this.selectObject(primary?.obj ?? null);
        } else {
            this.selection.push(pick);
            this.selectObject(pick.obj);
        }
        this.selectedFace = null;
        this.updateSelectionStatus();
        this.updateHighlights();
    }

    clearSelection() {
        this.selection = [];
        this.hoverSelection = null;
        this.selectedFace = null;
        this.selectObject(null);
        this.updateSelectionStatus();
        this.updateHighlights();
    }

    selectObject(obj) {
        if (this.selectedObj && this.selectedObj.mesh && this.selectedObj.mesh.material?.emissive) {
            this.selectedObj.mesh.material.emissive.setHex(0x000000);
        }

        this.selectedObj = obj;
        this.selectedFace = null;

        if (obj) {
            if (obj.mesh.material && obj.mesh.material.emissive) obj.mesh.material.emissive.setHex(0x333333);
            if (['move', 'rotate', 'scale'].includes(this.currentTool)) this.transform.attach(obj.mesh);
        } else {
            this.transform.detach();
        }

        this.updateSelectionStatus();

        this.updateTree();
        this.updateProps();
        this.updateHighlights();
    }

    selectFace(obj, faceIdx, point, normal) {
        this.selectedObj = obj;
        this.selectedFace = { obj, faceIdx, point: point.clone(), normal: normal.clone() };
        this.setHUD('Face selected. Press K to sketch or click Extrude.', 'face');
        this.selection = [{ kind: 'face', obj, faceIdx, point: point.clone(), normal: normal.clone() }];
        this.updateSelectionStatus();
        this.updateProps();
        this.updateHighlights();
    }

    disposeHighlightVisual(v) {
        if (!v) return;
        this.highlight.group.remove(v);
        v.geometry?.dispose?.();
        v.material?.dispose?.();
    }

    getFaceTriangleGeometry(mesh, faceIndex) {
        const geom = mesh.geometry;
        const pos = geom.getAttribute('position');
        if (!pos) return null;
        const tri = new THREE.BufferGeometry();
        const verts = new Float32Array(9);
        const index = geom.index;
        if (index) {
            const a = index.getX(faceIndex * 3);
            const b = index.getX(faceIndex * 3 + 1);
            const c = index.getX(faceIndex * 3 + 2);
            verts[0] = pos.getX(a); verts[1] = pos.getY(a); verts[2] = pos.getZ(a);
            verts[3] = pos.getX(b); verts[4] = pos.getY(b); verts[5] = pos.getZ(b);
            verts[6] = pos.getX(c); verts[7] = pos.getY(c); verts[8] = pos.getZ(c);
        } else {
            const a = faceIndex * 3;
            const b = faceIndex * 3 + 1;
            const c = faceIndex * 3 + 2;
            if (c >= pos.count) return null;
            verts[0] = pos.getX(a); verts[1] = pos.getY(a); verts[2] = pos.getZ(a);
            verts[3] = pos.getX(b); verts[4] = pos.getY(b); verts[5] = pos.getZ(b);
            verts[6] = pos.getX(c); verts[7] = pos.getY(c); verts[8] = pos.getZ(c);
        }
        tri.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        tri.computeVertexNormals();
        return tri;
    }

    // Build a geometry containing all triangles coplanar with the picked triangle.
    // This makes face highlighting look like a full quad on BoxGeometry instead of a diagonal half.
    getCoplanarFaceGeometry(mesh, faceIndex, { normalDotThreshold = 0.999, planeEps = null } = {}) {
        const geom = mesh?.geometry;
        const pos = geom?.getAttribute?.('position');
        if (!geom || !pos) return null;

        // Determine a reasonable epsilon from geometry scale
        if (planeEps == null) {
            geom.computeBoundingBox?.();
            const bb = geom.boundingBox;
            const size = bb ? new THREE.Vector3().subVectors(bb.max, bb.min).length() : 1;
            planeEps = Math.max(1e-4, size * 1e-4);
        }

        const getTriVertsLocal = (triIndex) => {
            const idx = geom.index;
            if (idx) {
                const a = idx.getX(triIndex * 3);
                const b = idx.getX(triIndex * 3 + 1);
                const c = idx.getX(triIndex * 3 + 2);
                return [
                    new THREE.Vector3(pos.getX(a), pos.getY(a), pos.getZ(a)),
                    new THREE.Vector3(pos.getX(b), pos.getY(b), pos.getZ(b)),
                    new THREE.Vector3(pos.getX(c), pos.getY(c), pos.getZ(c)),
                ];
            }

            const a = triIndex * 3;
            const b = triIndex * 3 + 1;
            const c = triIndex * 3 + 2;
            if (c >= pos.count) return null;
            return [
                new THREE.Vector3(pos.getX(a), pos.getY(a), pos.getZ(a)),
                new THREE.Vector3(pos.getX(b), pos.getY(b), pos.getZ(b)),
                new THREE.Vector3(pos.getX(c), pos.getY(c), pos.getZ(c)),
            ];
        };

        const baseVerts = getTriVertsLocal(faceIndex);
        if (!baseVerts) return null;
        const basePlane = new THREE.Plane().setFromCoplanarPoints(baseVerts[0], baseVerts[1], baseVerts[2]);
        const baseNormal = basePlane.normal.clone().normalize();

        const triCount = geom.index ? (geom.index.count / 3) : (pos.count / 3);
        const out = [];
        const v0 = new THREE.Vector3();
        const v1 = new THREE.Vector3();
        const v2 = new THREE.Vector3();
        const n = new THREE.Vector3();

        for (let t = 0; t < triCount; t++) {
            const verts = getTriVertsLocal(t);
            if (!verts) continue;
            v0.copy(verts[0]);
            v1.copy(verts[1]);
            v2.copy(verts[2]);

            // Coplanarity check
            const d0 = Math.abs(basePlane.distanceToPoint(v0));
            const d1 = Math.abs(basePlane.distanceToPoint(v1));
            const d2 = Math.abs(basePlane.distanceToPoint(v2));
            if (d0 > planeEps || d1 > planeEps || d2 > planeEps) continue;

            // Normal alignment check
            n.subVectors(v1, v0).cross(new THREE.Vector3().subVectors(v2, v0)).normalize();
            if (Math.abs(n.dot(baseNormal)) < normalDotThreshold) continue;

            out.push(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
        }

        if (out.length === 0) return null;
        const faceGeom = new THREE.BufferGeometry();
        faceGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(out), 3));
        faceGeom.computeVertexNormals();
        return faceGeom;
    }

    updateHighlights() {
        this.disposeHighlightVisual(this.highlight.hover.outline);
        this.disposeHighlightVisual(this.highlight.hover.face);
        this.disposeHighlightVisual(this.highlight.hover.vertex);
        (this.highlight.selected.outlines || []).forEach(o => this.disposeHighlightVisual(o));
        this.disposeHighlightVisual(this.highlight.selected.face);
        this.disposeHighlightVisual(this.highlight.selected.vertex);
        this.highlight.hover = { outline: null, face: null, vertex: null };
        this.highlight.selected = { outlines: [], face: null, vertex: null };

        const addOutline = (mesh, color, opacity) => {
            mesh.updateMatrixWorld(true);
            const edgesGeom = new THREE.EdgesGeometry(mesh.geometry, 15);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
            const outline = new THREE.LineSegments(edgesGeom, mat);
            // IMPORTANT: set local matrix, not only matrixWorld.
            // Scene updateMatrixWorld() recomputes matrixWorld from parent*matrix every frame.
            outline.matrix.copy(mesh.matrixWorld);
            outline.matrixWorld.copy(mesh.matrixWorld);
            outline.matrixAutoUpdate = false;
            outline.matrixWorldNeedsUpdate = false;
            this.highlight.group.add(outline);
            return outline;
        };

        const addFaceMarker = (mesh, faceIndex, color, opacity) => {
            if (faceIndex == null || faceIndex < 0) return null;
            mesh.updateMatrixWorld(true);
            const tri = this.getCoplanarFaceGeometry(mesh, faceIndex) || this.getFaceTriangleGeometry(mesh, faceIndex);
            if (!tri) return null;
            const mat = new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity,
                side: THREE.DoubleSide,
                depthTest: false,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1,
            });
            const face = new THREE.Mesh(tri, mat);
            // Keep face highlight aligned with the mesh.
            face.matrix.copy(mesh.matrixWorld);
            face.matrixWorld.copy(mesh.matrixWorld);
            face.matrixAutoUpdate = false;
            face.matrixWorldNeedsUpdate = false;
            this.highlight.group.add(face);
            return face;
        };

        const addVertexMarker = (worldPoint, color) => {
            const g = new THREE.SphereGeometry(1.2, 16, 16);
            const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthTest: false });
            const s = new THREE.Mesh(g, m);
            s.position.copy(worldPoint);
            this.highlight.group.add(s);
            return s;
        };

        const renderPick = (pick, palette, out) => {
            if (!pick?.obj?.mesh) return;
            const mesh = pick.obj.mesh;
            if (pick.kind === 'body') {
                const outline = addOutline(mesh, palette.outline, palette.outlineOpacity);
                if (Array.isArray(out.outlines)) out.outlines.push(outline);
                else out.outline = outline;
            } else if (pick.kind === 'face') {
                out.outline = addOutline(mesh, palette.outline, 0.25);
                const faceIdx = pick.faceIdx ?? pick.hit?.faceIndex;
                out.face = addFaceMarker(mesh, faceIdx, palette.face, palette.faceOpacity);
            } else if (pick.kind === 'edge') {
                out.outline = addOutline(mesh, palette.edge, palette.outlineOpacity);
            } else if (pick.kind === 'vertex') {
                out.outline = addOutline(mesh, palette.outline, 0.2);
                out.vertex = addVertexMarker(pick.point, palette.vertex);
            }
        };

        renderPick(this.hoverSelection, { outline: 0xffffff, outlineOpacity: 0.35, face: 0x06b6d4, faceOpacity: 0.25, edge: 0xffffff, vertex: 0xffffff }, this.highlight.hover);

        if (this.selection && this.selection.length > 0) {
            const primary = this.selection[this.selection.length - 1];
            const mode = this.currentTool === 'face' ? 'face' : this.selectionMode;
            if (mode === 'body') {
                this.selection
                    .filter(p => p?.kind === 'body' && p?.obj?.mesh)
                    .forEach(p => renderPick(p, { outline: 0xf97316, outlineOpacity: 0.85, face: 0xf97316, faceOpacity: 0.25, edge: 0xf97316, vertex: 0xf97316 }, this.highlight.selected));
            } else {
                renderPick(primary, { outline: 0xf97316, outlineOpacity: 0.85, face: 0xf97316, faceOpacity: 0.25, edge: 0xf97316, vertex: 0xf97316 }, this.highlight.selected);
            }
        }
    }

    pickAtMouse() {
        const meshes = this.objects.map(o => o.mesh);
        if (meshes.length === 0) return null;
        const hits = this.raycaster.intersectObjects(meshes);
        const hit = hits[0];
        if (!hit) return null;
        const obj = hit.object.userData.obj;
        if (!obj) return null;

        if (this.selectionMode === 'body') return { kind: 'body', obj, point: hit.point.clone(), hit };
        if (this.selectionMode === 'face') {
            return { kind: 'face', obj, faceIdx: hit.faceIndex, point: hit.point.clone(), normal: hit.face?.normal?.clone?.() ?? new THREE.Vector3(0, 1, 0), hit };
        }

        const pxToWorldThreshold = (px, dist) => {
            const fov = THREE.MathUtils.degToRad(this.camera.fov);
            const worldHeightAtDist = 2 * Math.tan(fov / 2) * dist;
            const worldPerPixel = worldHeightAtDist / (this.canvas.clientHeight || 1);
            return px * worldPerPixel;
        };

        if (this.selectionMode === 'edge') {
            const edgesGeom = new THREE.EdgesGeometry(hit.object.geometry, 20);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const edges = new THREE.LineSegments(edgesGeom, lineMat);
            edges.matrixWorld.copy(hit.object.matrixWorld);
            edges.matrixAutoUpdate = false;
            this.raycaster.params.Line.threshold = pxToWorldThreshold(this.pickEdgeThresholdPx, hit.distance);
            const eHits = this.raycaster.intersectObject(edges, true);
            edgesGeom.dispose();
            lineMat.dispose();
            if (eHits[0]) return { kind: 'edge', obj, point: eHits[0].point.clone(), hit: eHits[0] };
            return { kind: 'face', obj, faceIdx: hit.faceIndex, point: hit.point.clone(), normal: hit.face?.normal?.clone?.() ?? new THREE.Vector3(0, 1, 0), hit };
        }

        if (this.selectionMode === 'vertex') {
            const pos = hit.object.geometry.getAttribute('position');
            if (!pos) return null;
            const mx = (this.mouse.x * 0.5 + 0.5) * this.canvas.clientWidth;
            const my = (-this.mouse.y * 0.5 + 0.5) * this.canvas.clientHeight;
            const tmp = new THREE.Vector3();
            const world = new THREE.Vector3();
            const proj = new THREE.Vector3();
            let bestIndex = -1;
            let bestD2 = Infinity;
            let bestPoint = null;
            const step = Math.max(1, Math.floor(pos.count / 2000));
            for (let i = 0; i < pos.count; i += step) {
                tmp.fromBufferAttribute(pos, i);
                world.copy(tmp).applyMatrix4(hit.object.matrixWorld);
                proj.copy(world).project(this.camera);
                const sx = (proj.x * 0.5 + 0.5) * this.canvas.clientWidth;
                const sy = (-proj.y * 0.5 + 0.5) * this.canvas.clientHeight;
                const dx = sx - mx;
                const dy = sy - my;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestD2) {
                    bestD2 = d2;
                    bestIndex = i;
                    bestPoint = world.clone();
                }
            }
            if (bestIndex >= 0 && bestD2 <= this.pickVertexThresholdPx * this.pickVertexThresholdPx) {
                return { kind: 'vertex', obj, point: bestPoint.clone(), vertexIndex: bestIndex, hit };
            }
            return { kind: 'face', obj, faceIdx: hit.faceIndex, point: hit.point.clone(), normal: hit.face?.normal?.clone?.() ?? new THREE.Vector3(0, 1, 0), hit };
        }

        return null;
    }

    setTool(tool) {
        this.currentTool = tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('t-' + tool);
        if (btn) btn.classList.add('active');

        // Step 6: numeric HUD for transforms
        if (['move', 'rotate', 'scale'].includes(tool)) {
            this.showNumericHUD(tool);
        } else {
            this.hideNumericHUD();
        }

        if (tool === 'select' || tool === 'face') {
            this.transform.detach();
        } else if (['move', 'rotate', 'scale'].includes(tool)) {
            this.transform.setMode(tool === 'move' ? 'translate' : tool);
            if (this.selectedObj) this.transform.attach(this.selectedObj.mesh);
        }

        this.updateTransformSnapping();

        if (tool === 'face') {
            this.setHUD('Click on a face to select it', 'face');
        } else if (tool === 'measure') {
            this.setHUD('Measure: click two points (M). Esc clears.', 'face');
        } else if (['line', 'rect', 'circle'].includes(tool)) {
            // New flow: sketch starts by picking a face or the ground/grid plane.
            if (!this.sketchMode) {
                if (this.selectedFace) {
                    this.startSketchSession({ plane: this.computeSketchPlaneFromSelectedFace() });
                } else {
                    this.pendingSketchPlanePick = true;
                    this.setHUD('Sketch: click a face or grid plane to start', 'sketch');
                }
            }
            if (!this.pendingSketchPlanePick) this.setHUD('Sketch: ' + tool + ' (ESC to exit)', 'sketch');
        } else {
            if (!this.sketchMode) this.hudEl.className = 'hud';
        }

        // Leaving sketch drawing tools should clear rubber-band preview
        if (!['line', 'rect', 'circle'].includes(tool)) this.clearSketchDraft();
    }

    enterSketchMode() {
        if (this.selectedFace) {
            this.startSketchSession({ plane: this.computeSketchPlaneFromSelectedFace(), tool: 'rect' });
            this.toast('Sketch started on face', 'info');
            return;
        }
        this.pendingSketchPlanePick = true;
        this.setTool('rect');
        this.setHUD('Sketch: click a face or grid plane to start', 'sketch');
    }

    exitSketchMode() {
        this.sketchMode = false;
        this.pendingSketchPlanePick = false;
        this.clearSketchDraft();
        this.sketchPoints = [];
        this.sketchLines.forEach(line => {
            this.scene.remove(line.line);
            line.geometry?.dispose?.();
            line.line?.material?.dispose?.();
        });
        this.sketchLines = [];
        this.sketchPlane = null;
        this.clearSketchSelection();
        this.sketchConstraints = [];
        this.clearSketchViz();

        this.clearSketchHoverViz();

        if (this.sketchPointViz?.group) {
            // Dispose children meshes
            while (this.sketchPointViz.group.children.length) {
                const c = this.sketchPointViz.group.children.pop();
                c.geometry?.dispose?.();
                c.material?.dispose?.();
            }
            this.scene?.remove(this.sketchPointViz.group);
            this.sketchPointViz.group = null;
        }
        // Dispose base geometry/material templates
        this.sketchPointViz.geom?.dispose?.();
        this.sketchPointViz.mat?.dispose?.();
        this.sketchPointViz.geom = null;
        this.sketchPointViz.mat = null;
        
        this.hudEl.className = 'hud';
        this.setTool('select');
        this.toast('Sketch mode ended', 'info');
    }

    getSketchSnapPoints() {
        const pts = [];
        for (const s of this.sketchLines) {
            if (s.type === 'line') {
                pts.push(s.p1, s.p2);
            } else if (s.type === 'rect') {
                const p1 = s.p1;
                const p2 = s.p2;
                pts.push(p1, p2, new THREE.Vector2(p2.x, p1.y), new THREE.Vector2(p1.x, p2.y));
            } else if (s.type === 'circle') {
                pts.push(s.center);
            }
        }
        // Also include in-progress points
        for (const p of this.sketchPoints) pts.push(p);
        return pts;
    }

    snapSketchPoint(rawPoint2D, { disableSnap = false } = {}) {
        if (!rawPoint2D) return rawPoint2D;
        if (disableSnap) return rawPoint2D;

        const step = CONFIG.SKETCH_SNAP_GRID;
        const gridSnapped = new THREE.Vector2(
            Math.round(rawPoint2D.x / step) * step,
            Math.round(rawPoint2D.y / step) * step
        );

        // Prefer snapping to existing sketch vertices if close enough
        const candidates = this.getSketchSnapPoints();
        let best = null;
        let bestD2 = Infinity;
        const threshold = CONFIG.SKETCH_SNAP_THRESHOLD;
        for (const p of candidates) {
            if (!p) continue;
            const dx = p.x - rawPoint2D.x;
            const dy = p.y - rawPoint2D.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < bestD2) {
                bestD2 = d2;
                best = p;
            }
        }
        if (best && bestD2 <= threshold * threshold) return best.clone();

        return gridSnapped;
    }

    applySketchInference(point2D, { disableSnap = false } = {}) {
        if (disableSnap) return point2D;
        if (this.currentTool !== 'line') return point2D;
        if (this.sketchPoints.length !== 1) return point2D;

        const a = this.sketchPoints[0];
        const b = point2D.clone();
        const th = CONFIG.SKETCH_INFER_HV_THRESHOLD;
        if (Math.abs(b.x - a.x) <= th) b.x = a.x;
        if (Math.abs(b.y - a.y) <= th) b.y = a.y;
        return b;
    }

    addSketchPoint(point2D, opts = {}) {
        let p = this.snapSketchPoint(point2D, opts);
        p = this.applySketchInference(p, opts);
        this.sketchPoints.push(p);
        if (this.currentTool === 'rect' && this.sketchPoints.length === 2) {
            this.clearSketchDraft();
            this.createSketchRect(this.sketchPoints[0], this.sketchPoints[1]);
            this.sketchPoints = [];
        } else if (this.currentTool === 'circle' && this.sketchPoints.length === 2) {
            this.clearSketchDraft();
            this.createSketchCircle(this.sketchPoints[0], this.sketchPoints[1]);
            this.sketchPoints = [];
        } else if (this.currentTool === 'line' && this.sketchPoints.length === 2) {
            this.clearSketchDraft();
            this.createSketchLine(this.sketchPoints[0], this.sketchPoints[1]);
            this.sketchPoints = [this.sketchPoints[1]];
        }
    }

    createSketchRect(p1, p2) {
        const material = new THREE.LineBasicMaterial({ color: CONFIG.SKETCH_LINE_COLOR, transparent: true, opacity: 1, depthTest: false });
        const points = [
            this.sketchToWorld(new THREE.Vector2(p1.x, p1.y)),
            this.sketchToWorld(new THREE.Vector2(p2.x, p1.y)),
            this.sketchToWorld(new THREE.Vector2(p2.x, p2.y)),
            this.sketchToWorld(new THREE.Vector2(p1.x, p2.y)),
            this.sketchToWorld(new THREE.Vector2(p1.x, p1.y)),
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        line.renderOrder = 10;
        this.scene.add(line);
        const ent = { type: 'rect', p1, p2, line, geometry, baseColor: CONFIG.SKETCH_LINE_COLOR };
        this.sketchLines.push(ent);
        this.setSketchSelection(ent);
        this.startSketchDimCommand(ent);
    }

    createSketchCircle(center, edge) {
        const radius = Math.sqrt(Math.pow(edge.x - center.x, 2) + Math.pow(edge.y - center.y, 2));
        const material = new THREE.LineBasicMaterial({ color: CONFIG.SKETCH_LINE_COLOR, transparent: true, opacity: 1, depthTest: false });
        const curve = new THREE.EllipseCurve(center.x, center.y, radius, radius, 0, 2 * Math.PI, false, 0);
        const points = curve.getPoints(CONFIG.SKETCH_CIRCLE_POINTS).map(p => this.sketchToWorld(new THREE.Vector2(p.x, p.y)));
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        line.renderOrder = 10;
        this.scene.add(line);
        const ent = { type: 'circle', center, radius, line, geometry, baseColor: CONFIG.SKETCH_LINE_COLOR };
        this.sketchLines.push(ent);
        this.setSketchSelection(ent);
        this.startSketchDimCommand(ent);
    }

    createSketchLine(p1, p2) {
        const material = new THREE.LineBasicMaterial({ color: CONFIG.SKETCH_LINE_COLOR, transparent: true, opacity: 1, depthTest: false });
        const points = [this.sketchToWorld(new THREE.Vector2(p1.x, p1.y)), this.sketchToWorld(new THREE.Vector2(p2.x, p2.y))];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        line.renderOrder = 10;
        this.scene.add(line);
        const ent = { type: 'line', p1, p2, line, geometry, baseColor: CONFIG.SKETCH_LINE_COLOR };
        this.sketchLines.push(ent);
        this.setSketchSelection(ent);
        this.toast('Line added (press Enter to set length)', 'info');
    }

    addUndo(action) {
        this.undoStack.push(action);
        this.redoStack = [];
        this.updateUndoButtons();
    }

    undo() {
        if (this.undoStack.length === 0) return;
        const action = this.undoStack.pop();
        this.redoStack.push(action);
        if (action.type === 'create') {
            if (action.feature) this.removeFeatureById(action.feature.id);
            // Clear edge helper before removing from scene
            if (action.obj?.wireframeHelper) {
                action.obj.wireframeHelper.parent?.remove(action.obj.wireframeHelper);
                action.obj.wireframeHelper.geometry?.dispose?.();
                action.obj.wireframeHelper.material?.dispose?.();
                action.obj.wireframeHelper = null;
            }
            this.scene.remove(action.obj.mesh);
            this.objects = this.objects.filter(o => o.id !== action.obj.id);
            if (this.selectedObj === action.obj) this.selectObject(null);
        } else if (action.type === 'delete') {
            this.scene.add(action.obj.mesh);
            this.objects.push(action.obj);
            this.applyRenderModeToObject(action.obj);
        } else if (action.type === 'delete-multi') {
            (action.objs || []).forEach(obj => {
                this.scene.add(obj.mesh);
                this.objects.push(obj);
                this.applyRenderModeToObject(obj);
            });
        } else if (action.type === 'fillet' || action.type === 'chamfer' || action.type === 'cut') {
            if (action.feature) this.removeFeatureById(action.feature.id);
            if (action.originalGeometry && action.obj.mesh) {
                action.obj.mesh.geometry.dispose();
                action.obj.mesh.geometry = action.originalGeometry.clone();
                action.obj.mesh.geometry.computeBoundingBox();
                action.obj.mesh.geometry.computeBoundingSphere();
                this.applyRenderModeToObject(action.obj);
            }
        }
        this.updateUI();
        this.updateUndoButtons();
        this.toast('Undo');
    }

    redo() {
        if (this.redoStack.length === 0) return;
        const action = this.redoStack.pop();
        this.undoStack.push(action);
        if (action.type === 'create') {
            this.scene.add(action.obj.mesh);
            this.objects.push(action.obj);
            this.applyRenderModeToObject(action.obj);
            if (action.feature) this.insertFeature(action.feature, action.featureIndex);
        } else if (action.type === 'delete') {
            // Clear edge helper before removing
            if (action.obj?.wireframeHelper) {
                action.obj.wireframeHelper.parent?.remove(action.obj.wireframeHelper);
                action.obj.wireframeHelper.geometry?.dispose?.();
                action.obj.wireframeHelper.material?.dispose?.();
                action.obj.wireframeHelper = null;
            }
            this.scene.remove(action.obj.mesh);
            this.objects = this.objects.filter(o => o.id !== action.obj.id);
            if (this.selectedObj === action.obj) this.selectObject(null);
        } else if (action.type === 'delete-multi') {
            const deletedIds = new Set();
            (action.objs || []).forEach(obj => {
                if (obj?.wireframeHelper) {
                    obj.wireframeHelper.parent?.remove(obj.wireframeHelper);
                    obj.wireframeHelper.geometry?.dispose?.();
                    obj.wireframeHelper.material?.dispose?.();
                    obj.wireframeHelper = null;
                }
                this.scene.remove(obj.mesh);
                this.objects = this.objects.filter(o => o.id !== obj.id);
                deletedIds.add(obj.id);
            });
            if (this.selectedObj && deletedIds.has(this.selectedObj.id)) this.selectObject(null);
        } else if (action.type === 'fillet' || action.type === 'chamfer' || action.type === 'cut') {
            if (action.newGeometry && action.obj.mesh) {
                action.obj.mesh.geometry.dispose();
                action.obj.mesh.geometry = action.newGeometry.clone();
                action.obj.mesh.geometry.computeBoundingBox();
                action.obj.mesh.geometry.computeBoundingSphere();
                this.applyRenderModeToObject(action.obj);
            }
            if (action.feature) this.insertFeature(action.feature, action.featureIndex);
        }
        this.updateUI();
        this.updateUndoButtons();
        this.toast('Redo');
    }

    updateUndoButtons() {
        document.getElementById('t-undo').disabled = this.undoStack.length === 0;
        document.getElementById('t-redo').disabled = this.redoStack.length === 0;
    }

    createPrimitive(type) {
        let geometry;
        const params = {};
        switch (type) {
            case 'box':
                params.width = CONFIG.DEFAULT_BOX_SIZE;
                params.height = CONFIG.DEFAULT_BOX_SIZE;
                params.depth = CONFIG.DEFAULT_BOX_SIZE;
                geometry = new THREE.BoxGeometry(params.width, params.height, params.depth);
                break;
            case 'sphere':
                params.radius = CONFIG.DEFAULT_SPHERE_RADIUS;
                geometry = new THREE.SphereGeometry(params.radius, CONFIG.GEOMETRY_SEGMENTS, CONFIG.GEOMETRY_SEGMENTS);
                break;
            case 'cylinder':
                params.radius = CONFIG.DEFAULT_CYLINDER_RADIUS;
                params.height = CONFIG.DEFAULT_CYLINDER_HEIGHT;
                geometry = new THREE.CylinderGeometry(params.radius, params.radius, params.height, CONFIG.GEOMETRY_SEGMENTS);
                break;
            case 'cone':
                params.radius = CONFIG.DEFAULT_CONE_RADIUS;
                params.height = CONFIG.DEFAULT_CONE_HEIGHT;
                geometry = new THREE.ConeGeometry(params.radius, params.height, CONFIG.GEOMETRY_SEGMENTS);
                break;
            case 'torus':
                params.radius = CONFIG.DEFAULT_TORUS_RADIUS;
                params.tube = CONFIG.DEFAULT_TORUS_TUBE;
                geometry = new THREE.TorusGeometry(params.radius, params.tube, CONFIG.GEOMETRY_SEGMENTS_TORUS_RADIAL, CONFIG.GEOMETRY_SEGMENTS_TORUS_TUBULAR);
                break;
            default:
                return;
        }
        const mesh = new THREE.Mesh(geometry, this.createMaterial());
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        const box = new THREE.Box3().setFromObject(mesh);
        mesh.position.y = (box.max.y - box.min.y) / 2;

        const offset = this.objects.length * CONFIG.PRIMITIVE_SPACING;
        mesh.position.x = offset % CONFIG.PRIMITIVE_GRID_WIDTH;
        mesh.position.z = Math.floor(offset / CONFIG.PRIMITIVE_GRID_WIDTH) * CONFIG.PRIMITIVE_SPACING;

        this.objCounter++;
        const obj = { id: this.objCounter, name: type.charAt(0).toUpperCase() + type.slice(1) + ' ' + this.objCounter, type, mesh, params };
        mesh.userData.obj = obj;
        this.scene.add(mesh);
        mesh.updateMatrixWorld(true);
        this.objects.push(obj);
        this.applyRenderModeToObject(obj);
        this.addUndo({ type: 'create', obj });
        this.selection = [{ kind: 'body', obj, point: mesh.position.clone() }];
        this.selectObject(obj);
        this.updateUI();
        this.toast('Created ' + obj.name, 'success');
    }

    doExtrude() {
        let depth = parseFloat(document.getElementById('extrude-val').value);
        if (isNaN(depth) || depth === 0) depth = CONFIG.DEFAULT_EXTRUDE_DEPTH;
        const sign = Math.sign(depth) || 1;
        const absDepth = Math.abs(depth);
        if (absDepth < 0.1) {
            this.toast('Extrude depth must have |value| >= 0.1', 'error');
            return;
        }

        const sp = this.sketchPlane || (this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane());

        if (this.sketchLines.length > 0) {
            const sketch = this.sketchLines[this.sketchLines.length - 1];
            let geometry;
            if (sketch.type === 'rect') {
                const w = Math.abs(sketch.p2.x - sketch.p1.x);
                const d = Math.abs(sketch.p2.y - sketch.p1.y);
                geometry = new THREE.BoxGeometry(w, absDepth, d);
            } else if (sketch.type === 'circle') {
                geometry = new THREE.CylinderGeometry(sketch.radius, sketch.radius, absDepth, CONFIG.GEOMETRY_SEGMENTS);
            } else {
                this.toast('Cannot extrude this sketch type', 'error');
                return;
            }

            const mesh = new THREE.Mesh(geometry, this.createMaterial());
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const center2 = sketch.type === 'rect'
                ? new THREE.Vector2((sketch.p1.x + sketch.p2.x) / 2, (sketch.p1.y + sketch.p2.y) / 2)
                : sketch.center.clone();
            const centerW = this.sketchPlane ? this.sketchToWorld(center2) : sp.origin.clone().addScaledVector(sp.u, center2.x).addScaledVector(sp.v, center2.y).addScaledVector(sp.w, sp.offset);
            mesh.position.copy(centerW);
            mesh.position.addScaledVector(sp.w, (sign * absDepth) / 2);
            mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), sp.w));

            this.scene.remove(sketch.line);
            sketch.geometry?.dispose?.();
            this.sketchLines.pop();

            this.objCounter++;
            const obj = { id: this.objCounter, name: 'Extrusion ' + this.objCounter, type: 'extrusion', mesh, params: { depth } };
            mesh.userData.obj = obj;
            this.scene.add(mesh);
            this.objects.push(obj);
            this.applyRenderModeToObject(obj);
            const featName = 'Extrude ' + Math.abs(depth) + 'mm';
            const featureIndex = this.features.length;
            const feature = this.addFeature({ type: 'extrude', name: featName, objId: obj.id, params: { depth, from: 'sketch' } });
            this.addUndo({ type: 'create', obj, feature, featureIndex });
            this.selection = [{ kind: 'body', obj, point: mesh.position.clone() }];
            this.selectObject(obj);
            this.updateUI();
            this.toast('Extruded ' + depth + 'mm', 'success');
        } else if (this.selectedFace) {
            const faceNormal = this.selectedFace.normal.clone();
            faceNormal.transformDirection(this.selectedFace.obj.mesh.matrixWorld);
            faceNormal.normalize();
            const facePoint = this.selectedFace.point.clone();

            const baseGeometry = this.selectedFace.obj.mesh.geometry;
            baseGeometry.computeBoundingBox();
            const bb = baseGeometry.boundingBox;
            const width = bb.max.x - bb.min.x;
            const depthBB = bb.max.z - bb.min.z;
            const extrudeGeometry = new THREE.BoxGeometry(width * 0.8, absDepth, depthBB * 0.8);
            const mesh = new THREE.Mesh(extrudeGeometry, this.createMaterial());
            mesh.castShadow = true;
            mesh.position.copy(facePoint);
            mesh.position.addScaledVector(faceNormal, (sign * absDepth) / 2);
            mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), faceNormal));

            this.objCounter++;
            const obj = { id: this.objCounter, name: 'Extrusion ' + this.objCounter, type: 'extrusion', mesh, params: { depth } };
            mesh.userData.obj = obj;
            this.scene.add(mesh);
            this.objects.push(obj);
            this.applyRenderModeToObject(obj);
            const featName = 'Extrude ' + Math.abs(depth) + 'mm';
            const featureIndex = this.features.length;
            const feature = this.addFeature({ type: 'extrude', name: featName, objId: obj.id, params: { depth, from: 'face' } });
            this.addUndo({ type: 'create', obj, feature, featureIndex });
            this.selection = [{ kind: 'body', obj, point: mesh.position.clone() }];
            this.selectObject(obj);
            this.updateUI();
            this.toast('Face extruded ' + depth + 'mm', 'success');
        } else {
            this.toast('Draw a sketch or select a face first', 'warning');
        }

        this.closeModal('m-extrude');
    }

    startCutCommand() {
        const modalId = 'm-cut';
        const input = document.getElementById('cut-val');
        
        let onInput = null;
        this.startCommand({
            name: 'cut',
            title: 'Cut',
            hudKind: 'face',
            hint: 'Enter=OK, Esc=Cancel',
            modalId,
            start: () => {
                this.openModal(modalId);
                if (input) {
                    setTimeout(() => input.focus(), 0);
                }
            },
            confirm: () => {
                if (input && onInput) input.removeEventListener('input', onInput);
                this.doCut();
            },
            cancel: () => {
                if (input && onInput) input.removeEventListener('input', onInput);
                this.closeModal(modalId);
            },
        });
    }

    doCut() {
        let depth = parseFloat(document.getElementById('cut-val').value);
        if (isNaN(depth) || depth === 0) depth = CONFIG.DEFAULT_EXTRUDE_DEPTH;
        const absDepth = Math.abs(depth);
        if (absDepth < 0.1) {
            this.toast('Cut depth must be >= 0.1', 'error');
            return;
        }

        if (!this.selectedFace && this.sketchLines.length === 0) {
            this.toast('Select a face or draw a sketch first', 'warning');
            this.closeModal('m-cut');
            return;
        }

        if (!this.selectedObj && !this.selectedFace) {
            this.toast('Select an object to cut from', 'warning');
            this.closeModal('m-cut');
            return;
        }

        const targetObj = this.selectedFace ? this.selectedFace.obj : this.selectedObj;
        if (!targetObj || !targetObj.mesh) {
            this.toast('No valid object selected for cutting', 'warning');
            this.closeModal('m-cut');
            return;
        }

        const sp = this.sketchPlane || (this.selectedFace ? this.computeSketchPlaneFromSelectedFace() : this.getDefaultSketchPlane());

        let cutGeometry;
        let cutPosition = new THREE.Vector3();
        let cutQuaternion = new THREE.Quaternion();

        if (this.sketchLines.length > 0) {
            const sketch = this.sketchLines[this.sketchLines.length - 1];
            
            if (sketch.type === 'rect') {
                const w = Math.abs(sketch.p2.x - sketch.p1.x);
                const d = Math.abs(sketch.p2.y - sketch.p1.y);
                cutGeometry = new THREE.BoxGeometry(w, absDepth, d);
            } else if (sketch.type === 'circle') {
                cutGeometry = new THREE.CylinderGeometry(sketch.radius, sketch.radius, absDepth, CONFIG.GEOMETRY_SEGMENTS);
            } else {
                this.toast('Cannot cut with this sketch type', 'error');
                return;
            }

            const center2 = sketch.type === 'rect'
                ? new THREE.Vector2((sketch.p1.x + sketch.p2.x) / 2, (sketch.p1.y + sketch.p2.y) / 2)
                : sketch.center.clone();
            const centerW = this.sketchPlane ? this.sketchToWorld(center2) : sp.origin.clone().addScaledVector(sp.u, center2.x).addScaledVector(sp.v, center2.y).addScaledVector(sp.w, sp.offset);
            
            // Position the cut tool to go INTO the object (negative direction)
            cutPosition.copy(centerW);
            cutPosition.addScaledVector(sp.w, -absDepth / 2);
            cutQuaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sp.w);

            // Remove sketch
            this.scene.remove(sketch.line);
            sketch.geometry?.dispose?.();
            this.sketchLines.pop();

        } else if (this.selectedFace) {
            const faceNormal = this.selectedFace.normal.clone();
            faceNormal.transformDirection(this.selectedFace.obj.mesh.matrixWorld);
            faceNormal.normalize();
            const facePoint = this.selectedFace.point.clone();

            const baseGeometry = this.selectedFace.obj.mesh.geometry;
            baseGeometry.computeBoundingBox();
            const bb = baseGeometry.boundingBox;
            const width = bb.max.x - bb.min.x;
            const depthBB = bb.max.z - bb.min.z;
            cutGeometry = new THREE.BoxGeometry(width * 0.8, absDepth, depthBB * 0.8);
            
            // Position the cut tool to go INTO the object (opposite to face normal)
            cutPosition.copy(facePoint);
            cutPosition.addScaledVector(faceNormal, -absDepth / 2);
            cutQuaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), faceNormal);
        }

        if (!cutGeometry) {
            this.toast('Failed to create cut geometry', 'error');
            this.closeModal('m-cut');
            return;
        }

        // Perform CSG boolean subtraction using our embedded CSG library
        let targetGeom = null;
        try {
            const targetMesh = targetObj.mesh;
            targetMesh.updateMatrixWorld(true);
            
            // Ensure geometry has normals
            if (!cutGeometry.attributes.normal) {
                cutGeometry.computeVertexNormals();
            }
            targetGeom = targetMesh.geometry.clone();
            if (!targetGeom.attributes.normal) {
                targetGeom.computeVertexNormals();
            }
            
            // Create CSG from target mesh geometry (with world transform applied)
            const baseCSG = CSG.fromGeometry(targetGeom, targetMesh.matrixWorld);
            
            // Create a temporary mesh for the cut tool to get its world matrix
            const cutMeshTemp = new THREE.Mesh(cutGeometry);
            cutMeshTemp.position.copy(cutPosition);
            cutMeshTemp.quaternion.copy(cutQuaternion);
            cutMeshTemp.updateMatrixWorld(true);
            
            // Create CSG from cut geometry (with world transform applied)
            const cutCSG = CSG.fromGeometry(cutGeometry, cutMeshTemp.matrixWorld);
            
            // Perform subtraction
            const resultCSG = baseCSG.subtract(cutCSG);
            
            // Convert result back to Three.js geometry
            const resultGeometry = resultCSG.toGeometry();
            
            if (resultGeometry.attributes.position.count > 0) {
                // Store old geometry for undo (clone so history isn't tied to live/disposed geometry)
                const oldGeometry = targetMesh.geometry.clone();
                const liveOldGeometry = targetMesh.geometry;
                
                // Reset mesh transforms since geometry is now in world space
                // We need to transform the result back to local space
                const inverseMatrix = new THREE.Matrix4().copy(targetMesh.matrixWorld).invert();
                resultGeometry.applyMatrix4(inverseMatrix);
                
                // Apply result to target mesh
                targetMesh.geometry = resultGeometry;
                liveOldGeometry.dispose(); // Dispose old live geometry
                targetMesh.geometry.computeBoundingBox();
                targetMesh.geometry.computeBoundingSphere();
                
                // Add feature
                const featureIndex = this.features.length;
                const feature = this.addFeature({ 
                    type: 'cut', 
                    name: 'Cut ' + absDepth + 'mm', 
                    objId: targetObj.id, 
                    params: { depth: absDepth, from: this.selectedFace ? 'face' : 'sketch' } 
                });
                
                this.addUndo({
                    type: 'cut',
                    obj: targetObj,
                    originalGeometry: oldGeometry,
                    newGeometry: targetMesh.geometry.clone(),
                    feature,
                    featureIndex,
                });

                // Keep edge overlays in sync if active
                this.applyRenderModeToObject(targetObj);
                
                // Dispose temporary geometries
                cutGeometry.dispose();
                targetGeom.dispose();
                
                this.updateUI();
                this.toast('Cut ' + absDepth + 'mm', 'success');
                this.closeModal('m-cut');
                return;
            } else {
                throw new Error('CSG resulted in empty geometry');
            }
        } catch (err) {
            console.error('CSG cut failed:', err);
            this.toast('Cut failed: ' + err.message, 'error');
        }
        
        // Dispose temporary geometries on failure path
        if (cutGeometry) cutGeometry.dispose();
        if (targetGeom) targetGeom.dispose();
        
        this.closeModal('m-cut');
    }

    doFillet() {
        if (!this.selectedObj || this.selectedObj.type !== 'box') {
            this.toast('Select a box to fillet', 'warning');
            this.closeModal('m-fillet');
            return;
        }
        let radius = parseFloat(document.getElementById('fillet-val').value);
        if (isNaN(radius) || radius === 0) radius = CONFIG.DEFAULT_FILLET_RADIUS;
        if (radius < 0.1) {
            this.toast('Fillet radius must be >= 0.1', 'error');
            return;
        }
        const p = this.selectedObj.params;
        const shape = new THREE.Shape();
        const w = p.width / 2, h = p.depth / 2;
        const r = Math.min(radius, Math.min(w, h) * CONFIG.FILLET_CHAMFER_MAX_RATIO);
        shape.moveTo(-w + r, -h);
        shape.lineTo(w - r, -h);
        shape.quadraticCurveTo(w, -h, w, -h + r);
        shape.lineTo(w, h - r);
        shape.quadraticCurveTo(w, h, w - r, h);
        shape.lineTo(-w + r, h);
        shape.quadraticCurveTo(-w, h, -w, h - r);
        shape.lineTo(-w, -h + r);
        shape.quadraticCurveTo(-w, -h, -w + r, -h);
        const geometry = new THREE.ExtrudeGeometry(shape, {
            depth: p.height,
            bevelEnabled: true,
            bevelThickness: r,
            bevelSize: r,
            bevelSegments: CONFIG.BEVEL_SEGMENTS,
        });
        geometry.center();
        geometry.rotateX(Math.PI / 2);
        const oldGeom = this.selectedObj.mesh.geometry.clone();
        const liveOldGeom = this.selectedObj.mesh.geometry;
        this.selectedObj.mesh.geometry = geometry;
        liveOldGeom.dispose(); // Dispose the old live geometry
        this.selectedObj.params.fillet = radius;
        const featureIndex = this.features.length;
        const feature = this.addFeature({ type: 'fillet', name: 'Fillet ' + radius + 'mm', objId: this.selectedObj.id, params: { radius } });
        this.addUndo({ type: 'fillet', obj: this.selectedObj, radius, originalGeometry: oldGeom, newGeometry: geometry.clone(), feature, featureIndex });
        this.applyRenderModeToObject(this.selectedObj);
        this.toast('Fillet applied: ' + radius + 'mm', 'success');
        this.closeModal('m-fillet');
    }

    doChamfer() {
        if (!this.selectedObj || this.selectedObj.type !== 'box') {
            this.toast('Select a box to chamfer', 'warning');
            this.closeModal('m-chamfer');
            return;
        }
        let dist = parseFloat(document.getElementById('chamfer-val').value);
        if (isNaN(dist) || dist === 0) dist = CONFIG.DEFAULT_CHAMFER_DISTANCE;
        if (dist < 0.1) {
            this.toast('Chamfer distance must be >= 0.1', 'error');
            return;
        }
        const p = this.selectedObj.params;
        const shape = new THREE.Shape();
        const w = p.width / 2, h = p.depth / 2;
        const c = Math.min(dist, Math.min(w, h) * CONFIG.FILLET_CHAMFER_MAX_RATIO);
        shape.moveTo(-w + c, -h);
        shape.lineTo(w - c, -h);
        shape.lineTo(w, -h + c);
        shape.lineTo(w, h - c);
        shape.lineTo(w - c, h);
        shape.lineTo(-w + c, h);
        shape.lineTo(-w, h - c);
        shape.lineTo(-w, -h + c);
        shape.closePath();
        const geometry = new THREE.ExtrudeGeometry(shape, { depth: p.height, bevelEnabled: false });
        geometry.center();
        geometry.rotateX(Math.PI / 2);
        const oldGeom = this.selectedObj.mesh.geometry.clone();
        const liveOldGeom = this.selectedObj.mesh.geometry;
        this.selectedObj.mesh.geometry = geometry;
        liveOldGeom.dispose(); // Dispose the old live geometry
        this.selectedObj.params.chamfer = dist;
        const featureIndex = this.features.length;
        const feature = this.addFeature({ type: 'chamfer', name: 'Chamfer ' + dist + 'mm', objId: this.selectedObj.id, params: { dist } });
        this.addUndo({ type: 'chamfer', obj: this.selectedObj, dist, originalGeometry: oldGeom, newGeometry: geometry.clone(), feature, featureIndex });
        this.applyRenderModeToObject(this.selectedObj);
        this.toast('Chamfer applied: ' + dist + 'mm', 'success');
        this.closeModal('m-chamfer');
    }

    deleteSelected() {
        const targetsMap = new Map();
        (this.selection || []).forEach(p => {
            if (p?.obj?.id) targetsMap.set(p.obj.id, p.obj);
        });
        if (targetsMap.size === 0 && this.selectedObj?.id) targetsMap.set(this.selectedObj.id, this.selectedObj);
        const targets = [...targetsMap.values()];
        if (targets.length === 0) return;

        targets.forEach(obj => {
            // Dispose edge helper if present
            if (obj.wireframeHelper) {
                obj.wireframeHelper.parent?.remove(obj.wireframeHelper);
                obj.wireframeHelper.geometry?.dispose?.();
                obj.wireframeHelper.material?.dispose?.();
                obj.wireframeHelper = null;
            }
            this.scene.remove(obj.mesh);
            this.objects = this.objects.filter(o => o.id !== obj.id);
        });
        this.addUndo(targets.length === 1 ? { type: 'delete', obj: targets[0] } : { type: 'delete-multi', objs: targets });
        this.toast('Deleted ' + (targets.length === 1 ? targets[0].name : targets.length + ' objects'));
        this.clearSelection();
        this.updateUI();
    }

    duplicateSelected() {
        if (!this.selectedObj) return;
        const mesh = this.selectedObj.mesh.clone();
        mesh.material = this.selectedObj.mesh.material.clone();
        mesh.geometry = this.selectedObj.mesh.geometry.clone();
        mesh.position.x += 20;
        mesh.position.z += 20;
        this.objCounter++;
        const obj = { id: this.objCounter, name: this.selectedObj.name + ' Copy', type: this.selectedObj.type, mesh, params: { ...this.selectedObj.params } };
        mesh.userData.obj = obj;
        this.scene.add(mesh);
        this.objects.push(obj);
        this.applyRenderModeToObject(obj);
        this.addUndo({ type: 'create', obj });
        this.selection = [{ kind: 'body', obj, point: mesh.position.clone() }];
        this.selectObject(obj);
        this.updateUI();
        this.toast('Duplicated');
    }

    exportSTL() {
        if (this.objects.length === 0) {
            this.toast('No objects to export', 'warning');
            return;
        }
        try {
            const geometries = [];
            this.objects.forEach(obj => {
                const geom = obj.mesh.geometry.clone();
                obj.mesh.updateMatrixWorld(true);
                geom.applyMatrix4(obj.mesh.matrixWorld);
                if (geom.index) {
                    const nonIndexed = geom.toNonIndexed();
                    geom.dispose(); // Dispose the indexed clone
                    geometries.push(nonIndexed);
                } else {
                    geometries.push(geom);
                }
            });
            const mergedGeom = new THREE.BufferGeometry();
            const positions = [];
            geometries.forEach(geom => {
                const pos = geom.getAttribute('position');
                for (let i = 0; i < pos.count; i++) positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
            });
            mergedGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            mergedGeom.computeVertexNormals();
            const tempMesh = new THREE.Mesh(mergedGeom);
            const exporter = new THREE.STLExporter();
            const stl = exporter.parse(tempMesh);
            const blob = new Blob([stl], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'model.stl';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            geometries.forEach(g => g.dispose());
            mergedGeom.dispose();
            this.toast('STL exported!', 'success');
        } catch (err) {
            console.error('Export error:', err);
            this.toast('Export failed: ' + err.message, 'error');
        }
    }

    exportSTEP() {
        if (this.objects.length === 0) {
            this.toast('No objects to export', 'warning');
            return;
        }
        try {
            // Generate a basic STEP file format
            const stepContent = this.generateSTEPContent();
            const blob = new Blob([stepContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'model.step';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            this.toast('STEP exported! (Note: Basic format)', 'success');
        } catch (err) {
            console.error('STEP Export error:', err);
            this.toast('STEP Export failed: ' + err.message, 'error');
        }
    }

    generateSTEPContent() {
        const date = new Date();
        const dateStr = date.toISOString().split('T')[0].replace(/-/g, '');
        const timeStr = date.toTimeString().split(' ')[0].replace(/:/g, '');
        
        let content = `ISO-10303-21;
HEADER;
FILE_DESCRIPTION(('BulletCAD Exported Model'),
    '2;1',
    2022,
    ('Generated by BulletCAD'),
    (''),
    '',
    '',
    '');
FILE_NAME('model.step',
    '${dateStr}T${timeStr}',
    (''),
    (''),
    'BulletCAD',
    'BulletCAD',
    '');
FILE_SCHEMA(('AUTOMOTIVE_DESIGN { 0 0 10303 214 1 1 1 1 }'));
ENDSEC;
DATA;
`;

        // NOTE: This is a minimal, metadata-only STEP stub.
        // It avoids broken references but does not encode solid geometry.
        let idCounter = 1;
        const applicationContextId = idCounter++;
        const productContextId = idCounter++;
        content += `#${applicationContextId}=APPLICATION_CONTEXT('Core Data for Automotive Mechanical Design Process');\n`;
        content += `#${productContextId}=PRODUCT_CONTEXT('',#${applicationContextId},'mechanical');\n`;

        this.objects.forEach((obj) => {
            const safeName = String(obj?.name ?? 'Part').replace(/'/g, "''");
            const productId = idCounter++;
            content += `#${productId}=PRODUCT('${safeName}','','',(#${productContextId}));\n`;
        });

        content += `ENDSEC;\nEND-ISO-10303-21;`;
        return content;
    }

    setRenderMode(mode) {
        const buttons = document.querySelectorAll('.render-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        // Remember selection so newly created objects can be synced later if needed
        this.renderMode = mode;

        const clearEdgeHelper = (obj) => {
            const h = obj?.wireframeHelper;
            if (!h) return;
            h.parent?.remove(h);
            h.geometry?.dispose?.();
            h.material?.dispose?.();
            obj.wireframeHelper = null;
        };
        
        if (mode === 'shaded') {
            document.getElementById('render-shaded').classList.add('active');
            this.objects.forEach(obj => {
                obj.mesh.material.wireframe = false;
                clearEdgeHelper(obj);
            });
        } else if (mode === 'wireframe') {
            document.getElementById('render-wireframe').classList.add('active');
            this.objects.forEach(obj => {
                clearEdgeHelper(obj);
                obj.mesh.material.wireframe = true;
            });
        } else if (mode === 'edges') {
            document.getElementById('render-edges').classList.add('active');
            this.objects.forEach(obj => {
                obj.mesh.material.wireframe = false;
                // Rebuild helper so it stays in sync if geometry changed
                clearEdgeHelper(obj);
                const edgeGeometry = new THREE.EdgesGeometry(obj.mesh.geometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xf97316 });
                obj.wireframeHelper = new THREE.LineSegments(edgeGeometry, lineMaterial);
                obj.mesh.add(obj.wireframeHelper);
            });
        }
        this.toast(`Render mode: ${mode}`, 'success');
    }

    applyRenderModeToObject(obj) {
        if (!obj?.mesh) return;
        const mode = this.renderMode || 'shaded';
        
        // Clear any existing edge helper
        const h = obj.wireframeHelper;
        if (h) {
            h.parent?.remove(h);
            h.geometry?.dispose?.();
            h.material?.dispose?.();
            obj.wireframeHelper = null;
        }
        
        if (mode === 'wireframe') {
            obj.mesh.material.wireframe = true;
        } else if (mode === 'edges') {
            obj.mesh.material.wireframe = false;
            const edgeGeometry = new THREE.EdgesGeometry(obj.mesh.geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xf97316 });
            obj.wireframeHelper = new THREE.LineSegments(edgeGeometry, lineMaterial);
            obj.mesh.add(obj.wireframeHelper);
        } else {
            obj.mesh.material.wireframe = false;
        }
    }

    importSTL() {
        this.stlFileInputEl.click();
    }

    handleSTLImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(e.target.result);
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);
                const mesh = new THREE.Mesh(geometry, this.createMaterial());
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                const box = new THREE.Box3().setFromObject(mesh);
                mesh.position.y = (box.max.y - box.min.y) / 2;
                const offset = this.objects.length * CONFIG.PRIMITIVE_SPACING;
                mesh.position.x = offset % CONFIG.PRIMITIVE_GRID_WIDTH;
                mesh.position.z = Math.floor(offset / CONFIG.PRIMITIVE_GRID_WIDTH) * CONFIG.PRIMITIVE_SPACING;
                this.objCounter++;
                const obj = { id: this.objCounter, name: file.name.replace(/\.stl$/i, '') || 'Imported ' + this.objCounter, type: 'imported', mesh, params: {} };
                mesh.userData.obj = obj;
                this.scene.add(mesh);
                this.objects.push(obj);
                this.applyRenderModeToObject(obj);
                this.addUndo({ type: 'create', obj });
                this.selection = [{ kind: 'body', obj, point: mesh.position.clone() }];
                this.selectObject(obj);
                this.updateUI();
                this.toast('Imported ' + obj.name, 'success');
            } catch (err) {
                console.error('Import error:', err);
                this.toast('Import failed: ' + err.message, 'error');
            }
        };
        reader.onerror = () => this.toast('Failed to read file', 'error');
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    updateUI() {
        this.updateTree();
        this.updateFeatures();
        this.statusObjEl.textContent = this.objects.length;
    }

    updateTree() {
        if (this.objects.length === 0) {
            this.treeEl.innerHTML = '<div class="empty">No objects. Create a primitive.</div>';
            return;
        }

        const selectedIds = new Set((this.selection || []).filter(p => p?.kind === 'body' && p?.obj?.id).map(p => p.obj.id));
        this.treeEl.innerHTML = this.objects
            .map(obj => `<div class="tree-item ${(selectedIds.has(obj.id) || this.selectedObj === obj) ? 'selected' : ''}" data-id="${obj.id}"><span>📦</span><span>${obj.name}</span></div>`)
            .join('');
        this.treeEl.querySelectorAll('.tree-item').forEach(el => {
            el.addEventListener('click', (evt) => {
                const obj = this.objects.find(o => o.id === parseInt(el.dataset.id));
                if (obj) {
                    const pick = { kind: 'body', obj, point: obj.mesh.position.clone() };
                    if (evt.shiftKey) this.addBodyToSelection(pick);
                    else if (evt.ctrlKey || evt.metaKey) this.toggleBodySelection(pick);
                    else this.setBodySelection(pick);
                }
            });
        });
    }

    addFeature({ type, name, objId = null, params = {} } = {}, { atIndex = null } = {}) {
        this.featureCounter++;
        const feature = {
            id: this.featureCounter,
            type: type || 'feature',
            name: name || (type ? type[0].toUpperCase() + type.slice(1) : 'Feature'),
            objId,
            params: params || {},
            ts: Date.now(),
        };
        if (typeof atIndex === 'number' && atIndex >= 0 && atIndex <= this.features.length) this.features.splice(atIndex, 0, feature);
        else this.features.push(feature);
        this.updateFeatures();
        return feature;
    }

    insertFeature(feature, atIndex) {
        if (!feature) return;
        this.featureCounter = Math.max(this.featureCounter, feature.id || 0);
        if (typeof atIndex === 'number' && atIndex >= 0 && atIndex <= this.features.length) this.features.splice(atIndex, 0, feature);
        else this.features.push(feature);
        this.updateFeatures();
    }

    removeFeatureById(id) {
        if (!id) return;
        const before = this.features.length;
        this.features = this.features.filter(f => f?.id !== id);
        if (this.selectedFeatureId === id) this.selectedFeatureId = null;
        if (this.features.length !== before) this.updateFeatures();
    }

    updateFeatures() {
        if (!this.featuresEl) return;
        if (!this.features || this.features.length === 0) {
            this.featuresEl.innerHTML = '<div class="empty">No features yet.</div>';
            return;
        }

        const selectedId = this.selectedFeatureId;
        const iconFor = (t) => {
            if (t === 'extrude') return '⬆';
            if (t === 'cut') return '⬇';
            if (t === 'fillet') return '◜';
            if (t === 'chamfer') return '⟂';
            return '•';
        };

        this.featuresEl.innerHTML = this.features
            .map(f => `<div class="feature-item ${selectedId === f.id ? 'selected' : ''}" data-id="${f.id}"><span>${iconFor(f.type)}</span><span>${f.name}</span></div>`)
            .join('');

        this.featuresEl.querySelectorAll('.feature-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = parseInt(el.dataset.id);
                const f = this.features.find(x => x.id === id);
                this.selectedFeatureId = id;
                this.updateFeatures();
                if (f?.objId) {
                    const obj = this.objects.find(o => o.id === f.objId);
                    if (obj) {
                        const pick = { kind: 'body', obj, point: obj.mesh.position.clone() };
                        this.setBodySelection(pick);
                    }
                }
            });
        });
    }

    computeGeometryStats(obj) {
        const geom = obj.mesh.geometry;
        if (!geom) return { volume: 0, surfaceArea: 0, vertexCount: 0, triangleCount: 0 };

        obj.mesh.updateMatrixWorld(true);
        const worldMatrix = obj.mesh.matrixWorld;
        
        const posAttr = geom.getAttribute('position');
        const vertexCount = posAttr ? posAttr.count : 0;
        const idx = geom.index;
        const triangleCount = idx ? idx.count / 3 : vertexCount / 3;
        
        // Simple volume approximation using bounding box
        geom.computeBoundingBox();
        const bb = geom.boundingBox;
        const localVolume = bb ? (bb.max.x - bb.min.x) * (bb.max.y - bb.min.y) * (bb.max.z - bb.min.z) : 0;
        const s = obj.mesh.scale;
        const volume = localVolume * Math.abs((s?.x ?? 1) * (s?.y ?? 1) * (s?.z ?? 1));
        
        // Surface area approximation
        let surfaceArea = 0;
        if (posAttr) {
            const a = new THREE.Vector3();
            const b = new THREE.Vector3();
            const c = new THREE.Vector3();
            const ab = new THREE.Vector3();
            const ac = new THREE.Vector3();

            const triArea = (ai, bi, ci) => {
                a.fromBufferAttribute(posAttr, ai).applyMatrix4(worldMatrix);
                b.fromBufferAttribute(posAttr, bi).applyMatrix4(worldMatrix);
                c.fromBufferAttribute(posAttr, ci).applyMatrix4(worldMatrix);
                ab.subVectors(b, a);
                ac.subVectors(c, a);
                return ab.cross(ac).length() / 2;
            };

            if (idx) {
                for (let i = 0; i < idx.count; i += 3) {
                    surfaceArea += triArea(idx.getX(i), idx.getX(i + 1), idx.getX(i + 2));
                }
            } else {
                for (let i = 0; i + 2 < posAttr.count; i += 3) {
                    surfaceArea += triArea(i, i + 1, i + 2);
                }
            }
        }
        
        return { volume: Math.abs(volume), surfaceArea, vertexCount, triangleCount };
    }
