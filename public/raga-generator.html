    const SA_FREQUENCY = 240;
    const noteToFrequency = (semitone) => SA_FREQUENCY * Math.pow(2, semitone / 12);

    // Group ragas by time of day for better organization
    const RAGA_GROUPS = {
      "🌅 Morning (6 AM - 12 PM)": ['bhairav', 'ahirbhairav', 'todi', 'miyanKiTodi', 'jaunpuri', 'bhairavi', 'asavari', 'hindol'],
      "☀️ Afternoon (12 PM - 6 PM)": ['kafi', 'brindavaniSarang', 'madhuvanti', 'bhimpalasi', 'multani'],
      "🌆 Evening Twilight (5-7 PM)": ['marwa', 'puriya', 'shree', 'puriyaDhanashree'],
      "🌙 Night - First Prahar (6-9 PM)": ['yaman', 'yamanKalyan', 'bhupali', 'kedar', 'bihag', 'bihagda', 'hansdhwani', 'jaijaiwanti'],
      "🌃 Night - Second Prahar (9 PM - 12 AM)": ['durga', 'bageshree', 'des', 'khamaj', 'rageshree', 'tilakKamod', 'jhinjhoti', 'hameer', 'tilang', 'gorakhKalyan'],
      "🌌 Late Night (12-6 AM)": ['malkauns', 'darbari', 'shivranjani', 'chandrakauns', 'keeravani', 'lalit', 'basant', 'adana'],
      "🎭 Light / Any Time": ['pilu', 'pahadi', 'charukeshi'],
    };

    // ============================================================================
    // SECTION 2: GENERATION ENGINE - Stochastic Transition Kernel
    // ============================================================================

    /**
     * Procedural melody generator using weighted stochastic transitions.
     * Respects raga grammar: vadi/samvadi emphasis, forbidden transitions,
     * aroha/avaroha patterns, and characteristic phrases (pakad).
     */
    class RagaGeneratorEngine {
      /**
       * @param {RagaDefinition} raga - The raga definition to use
       * @param {number} [temperature=1.0] - Softmax temperature (0.1=deterministic, 2.0=random)
       */
      constructor(raga, temperature = 1.0) {
        // Defensive: Validate raga structure
        console.assert(raga && typeof raga === 'object', 'RagaGeneratorEngine: raga must be an object');
        console.assert(Array.isArray(raga.scale) && raga.scale.length > 0, 'RagaGeneratorEngine: raga.scale must be non-empty array');
        console.assert(typeof raga.vadi === 'number', 'RagaGeneratorEngine: raga.vadi must be a number');
        
        this.raga = raga;
        this.temperature = Math.max(0.01, Math.min(5.0, temperature)); // Clamp to safe range
        this.currentNote = 0;
        this.direction = 1;  // 1 = ascending, -1 = descending
        this.beatInCycle = 0;
        this.lastNotes = [0, 0, 0];  // History for phrase matching
        this.totalBeats = 0;
        this.pakadQueue = [];  // Queue for forced pakad phrases
        this.beatsSincePakad = 0;  // Track when we last played a pakad
      }

      /**
       * Set the temperature parameter for softmax sampling.
       * @param {number} temp - Temperature value (clamped to 0.01-5.0)
       */
      setTemperature(temp) {
        this.temperature = Math.max(0.01, Math.min(5.0, temp));
      }

      /**
       * Change the active raga and reset generator state.
       * @param {RagaDefinition} raga - New raga definition
       */
      setRaga(raga) {
        console.assert(raga && Array.isArray(raga.scale), 'setRaga: invalid raga object');
        this.raga = raga;
        this.reset();
      }

      /**
       * Convert weights to probabilities using temperature-scaled softmax.
       * @param {number[]} weights - Raw selection weights
       * @param {number} temperature - Softmax temperature
       * @returns {number[]} Normalized probabilities summing to 1.0
       */
      softmax(weights, temperature) {
        if (weights.length === 0) return [];
        const maxWeight = Math.max(...weights);
        const expWeights = weights.map(w => Math.exp((w - maxWeight) / temperature));
        const sum = expWeights.reduce((a, b) => a + b, 0);
        if (sum === 0) return weights.map(() => 1 / weights.length); // Fallback to uniform
        return expWeights.map(w => w / sum);
      }

      /**
       * Check if a transition between two notes is forbidden by raga grammar.
       * @param {number} from - Source note (semitone)
       * @param {number} to - Target note (semitone)
       * @returns {boolean} True if transition is forbidden
       */
      isForbidden(from, to) {
        if (!this.raga.forbidden || !Array.isArray(this.raga.forbidden)) return false;
        return this.raga.forbidden.some(([f, t]) => f === from && t === to);
      }

      getSafeTransitions(currentNote) {
        return this.raga.scale.filter(note => !this.isForbidden(currentNote, note));
      }

      getDistanceWeight(from, to) {
        const distance = Math.abs(to - from);
        if (distance === 0) {
          // Repeating note: higher weight for important notes
          // Handle octave equivalence for Vadi/Samvadi
          const noteInOctave = ((to % 12) + 12) % 12;  // Normalize to 0-11
          const vadiInOctave = ((this.raga.vadi % 12) + 12) % 12;
          const samvadiInOctave = ((this.raga.samvadi % 12) + 12) % 12;
          
          const isVadi = noteInOctave === vadiInOctave;
          const isSamvadi = noteInOctave === samvadiInOctave;
          const isSa = noteInOctave === 0;
          
          if (isVadi || isSamvadi) return 1.2;
          if (isSa) return 0.8;
          return 0.4;
        }
        if (distance <= 2) return 1.5;
        if (distance <= 4) return 1.0;
        if (distance <= 7) return 0.6;
        return 0.3;
      }

      // New: Weight notes based on register and performance progression
      getRegisterWeight(note) {
        // Register unlocking over time, BUT respecting each raga's natural home
        // The raga's weight system already encodes which registers are important
        // We just add gradual unlocking, not blanket penalties
        
        const phase = Math.min(this.totalBeats / 48, 3);
        
        const isMandra = note < 0;
        const isTaar = note > 11;
        
        // Check if this raga has significant weight in mandra/taar
        // If so, don't penalize those registers as much
        const ragaWeights = this.raga.weights;
        let ragaUsesMandra = false;
        let ragaUsesTaar = false;
        
        for (const key of Object.keys(ragaWeights)) {
          const n = parseInt(key);
          if (n < 0 && ragaWeights[key] >= 0.3) ragaUsesMandra = true;
          if (n > 11 && ragaWeights[key] >= 0.5) ragaUsesTaar = true;
        }
        
        let weight = 1.0;
        
        if (isMandra) {
          if (ragaUsesMandra) {
            // Raga naturally uses mandra - gentle phase unlocking only
            if (phase < 0.5) {
              weight = 0.4;  // Slight hold-back at very start
            } else {
              weight = 1.0;  // Let raga weights handle it
            }
          } else {
            // Raga doesn't emphasize mandra - stronger phase gating
            if (phase < 1) weight = 0.1;
            else if (phase < 2) weight = 0.4;
            else weight = 0.6;
          }
        } else if (isTaar) {
          if (ragaUsesTaar) {
            // Raga naturally uses taar - gentle phase unlocking
            if (phase < 1) {
              weight = 0.5;  // Slight hold-back early
            } else {
              weight = 1.0;  // Let raga weights handle it
            }
          } else {
            // Raga doesn't emphasize taar - stronger phase gating
            if (phase < 1.5) weight = 0.2;
            else if (phase < 2.5) weight = 0.5;
            else weight = 0.7;
          }
        }
        
        return weight;
      }

      // Rubber band effect - prevent runaway into extremes, but respect raga character
      getRubberBandWeight(note) {
        const lastNote = this.lastNotes[this.lastNotes.length - 1];
        const secondLastNote = this.lastNotes[this.lastNotes.length - 2];
        const thirdLastNote = this.lastNotes.length > 2 ? this.lastNotes[this.lastNotes.length - 3] : 0;
        
        // Only activate after 3+ consecutive notes in extreme register
        const consecutiveMandra = lastNote < 0 && secondLastNote < 0 && thirdLastNote < 0;
        const consecutiveTaar = lastNote > 11 && secondLastNote > 11 && thirdLastNote > 11;
        
        if (consecutiveMandra) {
          // Been in mandra too long - gentle pull back
          if (note >= 0 && note <= 5) {
            return 1.4;  // Mild boost to lower madhya (smooth return)
          } else if (note < lastNote) {
            return 0.5;  // Discourage going even lower
          }
        }
        
        if (consecutiveTaar) {
          // Been in taar too long - gentle pull back
          if (note >= 7 && note <= 11) {
            return 1.4;  // Mild boost to upper madhya (smooth return)
          } else if (note > lastNote) {
            return 0.5;  // Discourage going even higher
          }
        }
        
        return 1.0;
      }

      // New: Taal-aware density - returns probability of playing vs rest
      getTaalDensity(beatInCycle) {
        // Teental structure:
        // Beats 0-3 (after Sam): medium density - establishing
        // Beats 4-7: can breathe, slightly sparse
        // Beats 8-11 (Khali section): building
        // Beats 12-15: dense, approaching Sam
        if (beatInCycle >= 12) return 0.95;  // Almost always play approaching Sam
        if (beatInCycle >= 8) return 0.88;   // Building energy
        if (beatInCycle >= 4) return 0.75;   // Breathing room
        return 0.85;                          // After Sam - establishing
      }

      // New: Check if we should trigger a tihai (3x repeat landing on Sam)
      shouldTriggerTihai(beatInCycle) {
        // Tihai needs ~6 beats to complete (2 notes × 3 repetitions)
        // Trigger around beat 10-11 with some probability
        if (beatInCycle >= 10 && beatInCycle <= 11 && Math.random() < 0.25) {
          return true;
        }
        return false;
      }

      // New: Generate a simple tihai pattern
      generateTihaiPhrase() {
        // Pick a short phrase from characteristic phrases or create one
        const shortPhrases = this.raga.characteristicPhrases.filter(p => p.length <= 3);
        if (shortPhrases.length > 0) {
          const phrase = shortPhrases[Math.floor(Math.random() * shortPhrases.length)];
          // Repeat 3 times
          return [...phrase, ...phrase, ...phrase];
        }
        // Fallback: simple pattern
        return [this.raga.vadi, this.raga.samvadi, this.raga.vadi, this.raga.samvadi, 0];
      }

      getDirectionWeight(from, to) {
        const moveDirection = Math.sign(to - from);
        if (moveDirection === this.direction) return 1.3;
        if (moveDirection === 0) return 1.0;
        return 0.7;
      }

      // Weight notes based on aroha (ascending) / avaroha (descending) grammar
      getArohaAvarohaWeight(note) {
        const aroha = this.raga.aroha;
        const avaroha = this.raga.avaroha;
        
        if (!aroha || !avaroha) return 1.0;
        
        // Normalize note to single octave for matching
        const noteInOctave = ((note % 12) + 12) % 12;
        
        // Check if note is in the appropriate scale for current direction
        const inAroha = aroha.some(n => ((n % 12) + 12) % 12 === noteInOctave);
        const inAvaroha = avaroha.some(n => ((n % 12) + 12) % 12 === noteInOctave);
        
        if (this.direction >= 0) {
          // Ascending - prefer aroha notes
          if (inAroha && !inAvaroha) return 2.0;  // Aroha-only note - strongly prefer
          if (inAroha) return 1.4;
          if (inAvaroha && !inAroha) return 0.3;  // Avaroha-only - discourage in ascent
        } else {
          // Descending - prefer avaroha notes  
          if (inAvaroha && !inAroha) return 2.0;  // Avaroha-only note - strongly prefer
          if (inAvaroha) return 1.4;
          if (inAroha && !inAvaroha) return 0.3;  // Aroha-only - discourage in descent
        }
        
        return 1.0;
      }

      getResolutionWeight(note, beatInCycle) {
        // Vadi is the emotional home - phrases should gravitate toward it
        // Not just at sam, but throughout the cycle with varying intensity
        
        const noteInOctave = ((note % 12) + 12) % 12;
        const vadiInOctave = ((this.raga.vadi % 12) + 12) % 12;
        const samvadiInOctave = ((this.raga.samvadi % 12) + 12) % 12;
        
        const isVadi = noteInOctave === vadiInOctave;
        const isSamvadi = noteInOctave === samvadiInOctave;
        const isSa = noteInOctave === 0;
        
        // Distance from vadi (for gravitational pull)
        const distFromVadi = Math.min(
          Math.abs(note - this.raga.vadi),
          Math.abs(note - (this.raga.vadi + 12)),
          Math.abs(note - (this.raga.vadi - 12))
        );
        
        // Approaching sam (beats 12-15): strong pull to Sa and vadi
        if (beatInCycle >= 12) {
          if (isSa) return 2.5;
          if (isVadi) return 2.0;
          if (isSamvadi) return 1.5;
          // Gentle pull toward Sa even for other notes
          if (distFromVadi <= 4) return 1.3;
        }
        
        // First half of cycle: vadi territory
        if (beatInCycle < 8) {
          if (isVadi) return 1.6;
          if (isSamvadi) return 1.2;
        }
        
        // Second half (before sam approach): samvadi territory
        if (beatInCycle >= 8 && beatInCycle < 12) {
          if (isSamvadi) return 1.5;
          if (isVadi) return 1.3;
        }
        
        // General slight preference for vadi/samvadi
        if (isVadi) return 1.2;
        if (isSamvadi) return 1.1;
        
        return 1.0;
      }

      getPhraseWeight(noteHistory, candidate) {
        // Match characteristic phrases from ANY position, not just single notes
        // Longer matches = stronger weight (we're deeper into a phrase)
        
        const history = noteHistory.slice(-5); // Last 5 notes for matching
        let bestWeight = 1.0;
        
        for (const phrase of this.raga.characteristicPhrases) {
          // Try to find where we are in this phrase
          for (let phrasePos = 0; phrasePos < phrase.length - 1; phrasePos++) {
            
            // Check if last N notes match phrase starting at phrasePos
            // Try matching 4, 3, 2, 1 notes (longer = better)
            for (let matchLen = Math.min(4, history.length, phrase.length - phrasePos - 1); matchLen >= 1; matchLen--) {
              const historySlice = history.slice(-matchLen);
              const phraseSlice = phrase.slice(phrasePos, phrasePos + matchLen);
              
              // Check if they match
              let matches = true;
              for (let i = 0; i < matchLen; i++) {
                if (historySlice[i] !== phraseSlice[i]) {
                  matches = false;
                  break;
                }
              }
              
              if (matches) {
                // We found a match! Check if candidate continues the phrase
                const nextInPhrase = phrase[phrasePos + matchLen];
                if (nextInPhrase === candidate) {
                  // Weight increases with match length
                  const weight = matchLen === 4 ? 25.0 :
                                 matchLen === 3 ? 15.0 :
                                 matchLen === 2 ? 8.0 : 4.0;
                  bestWeight = Math.max(bestWeight, weight);
                }
              }
            }
          }
        }
        
        return bestWeight;
      }

      generateNextNote(beatInCycle) {
        this.beatInCycle = beatInCycle;
        this.beatsSincePakad++;
        
        // === PAKAD INJECTION ===
        // Periodically force a characteristic phrase to establish raga identity
        // Only inject at musically appropriate moments (stable notes, phrase boundaries)
        
        if (this.pakadQueue.length === 0) {
          // Check if we're on a stable note (good place to start a phrase)
          const currentNoteInOctave = ((this.currentNote % 12) + 12) % 12;
          const vadiInOctave = ((this.raga.vadi % 12) + 12) % 12;
          const samvadiInOctave = ((this.raga.samvadi % 12) + 12) % 12;
          const isStableNote = currentNoteInOctave === 0 ||  // Sa
                               currentNoteInOctave === vadiInOctave ||
                               currentNoteInOctave === samvadiInOctave;
          
          // Consider starting a new pakad
          const shouldInject = 
            isStableNote && (
              (beatInCycle === 0 && Math.random() < 0.35) ||   // At sam from stable note
              (beatInCycle === 4 && Math.random() < 0.2) ||    // Beat 5
              (beatInCycle === 8 && Math.random() < 0.25) ||   // At khali
              (beatInCycle === 12 && Math.random() < 0.3) ||   // Approaching sam
              (this.beatsSincePakad > 16 && Math.random() < 0.4) ||  // Been too long
              (this.beatsSincePakad > 24)    // Definitely need one
            );
          
          if (shouldInject && this.raga.characteristicPhrases.length > 0) {
            // Pick a random characteristic phrase
            const phrases = this.raga.characteristicPhrases;
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            
            // Find a phrase that starts near our current note (within a 4th)
            let bestPhrase = phrase;
            let bestDistance = Math.abs(phrase[0] - this.currentNote);
            
            for (const p of phrases) {
              const dist = Math.abs(p[0] - this.currentNote);
              if (dist < bestDistance) {
                bestDistance = dist;
                bestPhrase = p;
              }
            }
            
            // Queue the phrase (skip first note if we're already there)
            if (bestPhrase[0] === this.currentNote && bestPhrase.length > 1) {
              this.pakadQueue = bestPhrase.slice(1);
            } else {
              this.pakadQueue = [...bestPhrase];
            }
            this.beatsSincePakad = 0;
          }
        }
        
        // If we have queued pakad notes, use the next one
        if (this.pakadQueue.length > 0) {
          const nextNote = this.pakadQueue.shift();
          
          // Update state
          if (nextNote !== this.currentNote) {
            this.direction = Math.sign(nextNote - this.currentNote);
          }
          this.lastNotes.shift();
          this.lastNotes.push(nextNote);
          this.currentNote = nextNote;
          this.totalBeats++;
          
          const noteIndex = this.raga.scale.indexOf(nextNote);
          const noteName = noteIndex >= 0 ? this.raga.noteNames[noteIndex] : '?';
          
          return {
            note: nextNote,
            frequency: noteToFrequency(nextNote),
            noteName: noteName,
          };
        }
        
        // === NORMAL WEIGHTED RANDOM GENERATION ===
        const safeNotes = this.getSafeTransitions(this.currentNote);
        
        if (safeNotes.length === 0) {
          this.currentNote = 0;
          return { note: 0, frequency: SA_FREQUENCY, noteName: 'Sa' };
        }

        const weights = safeNotes.map(note => {
          // Note: weights object keys are strings, so we need to handle negative numbers
          let weight = this.raga.weights[note.toString()] || this.raga.weights[note] || 0.5;
          weight *= this.getDistanceWeight(this.currentNote, note);
          weight *= this.getDirectionWeight(this.currentNote, note);
          weight *= this.getArohaAvarohaWeight(note);
          weight *= this.getResolutionWeight(note, beatInCycle);
          weight *= this.getPhraseWeight(this.lastNotes, note);
          weight *= this.getRegisterWeight(note);
          weight *= this.getRubberBandWeight(note);
          return weight;
        });

        const probabilities = this.softmax(weights, this.temperature);

        const random = Math.random();
        let cumulative = 0;
        let selectedIndex = 0;
        
        for (let i = 0; i < probabilities.length; i++) {
          cumulative += probabilities[i];
          if (random <= cumulative) {
            selectedIndex = i;
            break;
          }
        }

        const selectedNote = safeNotes[selectedIndex];
        
        if (selectedNote !== this.currentNote) {
          this.direction = Math.sign(selectedNote - this.currentNote);
        }
        
        this.lastNotes.shift();
        this.lastNotes.push(selectedNote);
        
        if (Math.random() < 0.05) {
          this.direction *= -1;
        }

        if (selectedNote > 16 && Math.random() < 0.3) {
          this.direction = -1;
        } else if (selectedNote < 4 && Math.random() < 0.3) {
          this.direction = 1;
        }

        this.currentNote = selectedNote;
        this.totalBeats++;
        
        const noteIndex = this.raga.scale.indexOf(selectedNote);
        const noteName = noteIndex >= 0 ? this.raga.noteNames[noteIndex] : '?';
        
        return {
          note: selectedNote,
          frequency: noteToFrequency(selectedNote),
          noteName: noteName,
        };
      }

      reset() {
        this.currentNote = 0;
        this.direction = 1;
        this.beatInCycle = 0;
        this.lastNotes = [0, 0, 0];
        this.totalBeats = 0;
        this.pakadQueue = [];
        this.beatsSincePakad = 0;
      }
    }

    // ============================================================================
    // SECTION 3: AUDIO ENGINE - Web Audio API with Instrument Synthesis
    // ============================================================================
    
    /**
     * Audio synthesis engine using Web Audio API.
     * Implements sitar, flute, harmonium with physical modeling.
     * Manages tanpura drone and master volume.
     */
    class AudioEngine {
      constructor() {
        /** @type {AudioContext|null} */
        this.audioContext = null;
        /** @type {GainNode|null} */
        this.masterGain = null;
        /** @type {GainNode|null} */
        this.tablaGain = null;
        /** @type {DynamicsCompressorNode|null} */
        this.tablaCompressor = null;
        /** @type {AnalyserNode|null} */
        this.analyser = null;
        /** @type {MediaStreamAudioDestinationNode|null} */
        this.mediaStreamDestination = null;
        /** @type {MediaRecorder|null} */
        this.mediaRecorder = null;
        /** @type {BlobPart[]} */
        this._recordedChunks = [];
        /** @type {boolean} */
        this._isRecording = false;
        /** @type {Array<{osc: OscillatorNode, lfo: OscillatorNode}>|null} */
        this.tanpura = null;
        /** @type {GainNode[]} */
        this.tanpuraGains = [];
        /** @type {Set<AudioBufferSourceNode>} Track active sources for cleanup */
        this._activeSources = new Set();

        /** @type {Promise<void>|null} */
        this._resumePromise = null;
      }

      /**
       * Returns a start time that is guaranteed to be in the future.
       * This prevents "first note" dropouts caused by heavy first-call synthesis/JIT,
       * where start/stop times computed early end up in the past by the time we call start().
       * @param {number|null|undefined} when
       * @param {number} [leadSeconds=0.02]
       * @returns {number}
       */
      _safeStartTime(when = null, leadSeconds = 0.02) {
        if (!this.audioContext) return 0;
        const now = this.audioContext.currentTime;
        const base = (typeof when === 'number' && Number.isFinite(when)) ? when : now;
        const lead = Math.max(0, leadSeconds);
        return Math.max(base, now + lead);
      }

      /**
       * Initialize or resume the audio context. Must be called after user interaction.
       * @returns {boolean} True if successfully initialized
       */
      initialize() {
        try {
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.audioContext.createGain();
            this.masterGain.gain.value = 0.5;

            // Tabla bus (extra gain so tabla doesn't sound too mild)
            this.tablaGain = this.audioContext.createGain();
            this.tablaGain.gain.value = 2.2;

            // Gentle bus compression to add "thump" and presence (more realistic)
            this.tablaCompressor = this.audioContext.createDynamicsCompressor();
            this.tablaCompressor.threshold.value = -24;
            this.tablaCompressor.knee.value = 18;
            this.tablaCompressor.ratio.value = 3.2;
            this.tablaCompressor.attack.value = 0.004;
            this.tablaCompressor.release.value = 0.12;

            this.tablaGain.connect(this.tablaCompressor);
            this.tablaCompressor.connect(this.masterGain);

            // Route: masterGain -> analyser -> destination
            // Also tee analyser to a MediaStream destination for recording.
            this.analyser = this.audioContext.createAnalyser();
            this.analyser.fftSize = 2048;
            this.analyser.smoothingTimeConstant = 0.8;

            this.mediaStreamDestination = this.audioContext.createMediaStreamDestination();

            this.masterGain.connect(this.analyser);
            this.analyser.connect(this.audioContext.destination);
            this.analyser.connect(this.mediaStreamDestination);
          }
          if (this.audioContext.state === 'suspended') {
            // Resume is async; capture the promise so callers can await via ensureRunning().
            this._resumePromise = this.audioContext.resume().catch((e) => {
              console.warn('AudioEngine: resume() failed (likely missing user gesture):', e);
            });
          }
          console.assert(this.audioContext !== null, 'AudioEngine: Failed to create AudioContext');
          return true;
        } catch (e) {
          console.error('AudioEngine initialization failed:', e);
          return false;
        }
      }

      /**
       * Initialize and ensure the AudioContext is running (resumed).
       * @returns {Promise<boolean>}
       */
      async ensureRunning() {
        const ok = this.initialize();
        if (!ok || !this.audioContext) return false;
        if (this.audioContext.state !== 'running') {
          try {
            if (this._resumePromise) await this._resumePromise;
            // If still suspended, try once more (in case initialize() ran before gesture).
            if (this.audioContext.state === 'suspended') {
              await this.audioContext.resume();
            }
          } catch (e) {
            console.warn('AudioEngine: ensureRunning() failed:', e);
          }
        }
        return this.audioContext.state === 'running';
      }

      /**
       * Get the analyser node (used for spectrogram/visualization).
       * @returns {AnalyserNode|null}
       */
      getAnalyser() {
        return this.analyser;
      }

      /**
       * Start recording the master output.
       * @param {string[]} [preferredMimeTypes]
       * @returns {boolean}
       */
      startRecording(preferredMimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg']) {
        if (!this.audioContext || !this.mediaStreamDestination) {
          const ok = this.initialize();
          if (!ok) return false;
        }
        if (!this.mediaStreamDestination) return false;
        if (this._isRecording) return true;

        if (typeof MediaRecorder === 'undefined') {
          console.warn('MediaRecorder not available in this browser; recording disabled.');
          return false;
        }

        let mimeType = '';
        for (const mt of preferredMimeTypes) {
          try {
            if (MediaRecorder.isTypeSupported(mt)) {
              mimeType = mt;
              break;
            }
          } catch (e) {
            // ignore
          }
        }

        this._recordedChunks = [];
        try {
          this.mediaRecorder = mimeType
            ? new MediaRecorder(this.mediaStreamDestination.stream, { mimeType })
            : new MediaRecorder(this.mediaStreamDestination.stream);
        } catch (e) {
          console.error('Failed to create MediaRecorder:', e);
          this.mediaRecorder = null;
          return false;
        }

        this.mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) this._recordedChunks.push(ev.data);
        };

        this.mediaRecorder.onerror = (ev) => {
          console.error('MediaRecorder error:', ev);
        };

        try {
          this.mediaRecorder.start();
          this._isRecording = true;
          return true;
        } catch (e) {
          console.error('Failed to start recording:', e);
          this._isRecording = false;
          return false;
        }
      }

      /**
       * Stop recording and resolve to a Blob.
       * @returns {Promise<Blob|null>}
       */
      stopRecording() {
        if (!this.mediaRecorder || !this._isRecording) {
          this._isRecording = false;
          return Promise.resolve(null);
        }

        return new Promise((resolve) => {
          const recorder = this.mediaRecorder;
          const mimeType = recorder.mimeType || 'audio/webm';

          recorder.onstop = () => {
            try {
              const blob = new Blob(this._recordedChunks, { type: mimeType });
              this._recordedChunks = [];
              this._isRecording = false;
              resolve(blob);
            } catch (e) {
              console.error('Failed to finalize recording blob:', e);
              this._recordedChunks = [];
              this._isRecording = false;
              resolve(null);
            }
          };

          try {
            recorder.stop();
          } catch (e) {
            console.error('Failed to stop MediaRecorder:', e);
            this._isRecording = false;
            resolve(null);
          }
        });
      }

      /**
       * @returns {boolean}
       */
      isRecording() {
        return this._isRecording;
      }

      // ==================== Tabla (simple synthesis) ====================
      _clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      _randRange(lo, hi) {
        return lo + Math.random() * (hi - lo);
      }

      _makeNoiseBuffer(seconds, decay = 0.35) {
        const sr = this.audioContext.sampleRate;
        const length = Math.max(1, Math.floor(sr * seconds));
        const buffer = this.audioContext.createBuffer(1, length, sr);
        const data = buffer.getChannelData(0);

        // Slightly "pink-ish" noise via 1st-order smoothing, then exponential decay.
        let s = 0;
        const smooth = 0.92;
        for (let i = 0; i < length; i++) {
          const t = i / sr;
          const w = Math.random() * 2 - 1;
          s = smooth * s + (1 - smooth) * w;
          const env = Math.exp(-t / Math.max(0.02, seconds * decay));
          data[i] = s * env;
        }
        return buffer;
      }

      _makeQuickEnvelope(gainParam, now, peak, attack, decay) {
        gainParam.cancelScheduledValues(now);
        gainParam.setValueAtTime(0.0001, now);
        gainParam.linearRampToValueAtTime(Math.max(0.0002, peak), now + attack);
        gainParam.exponentialRampToValueAtTime(0.0001, now + attack + decay);
      }

      _playDayan(now, volume, brightness = 1.0, open = true) {
        if (!this.audioContext || !this.masterGain) return;

        // Dayan: transient "ta" + membrane modes (modal synthesis), plus a hint of noisy air.
        const sr = this.audioContext.sampleRate;
        const dur = open ? 0.22 : 0.12;

        const noise = this.audioContext.createBufferSource();
        noise.buffer = this._makeNoiseBuffer(dur, open ? 0.55 : 0.35);

        // Transient click (short HP noise) for realism
        const click = this.audioContext.createBufferSource();
        click.buffer = this._makeNoiseBuffer(0.02, 0.18);
        const clickHP = this.audioContext.createBiquadFilter();
        clickHP.type = 'highpass';
        clickHP.frequency.value = 3200;
        clickHP.Q.value = 0.8;

        // Fundamental and modes (roughly around 220-360 depending on brightness)
        const base = 230 * brightness * this._randRange(0.985, 1.015);
        const modes = [
          { f: base * 1.00, q: open ? 10 : 7, g: 1.0 },
          { f: base * 1.52, q: open ? 12 : 9, g: 0.55 },
          { f: base * 2.05, q: open ? 11 : 8, g: 0.38 },
          { f: base * 2.92, q: open ? 9 : 7, g: 0.22 },
          // Slight higher ring adds "tin" quality
          { f: 1500 * brightness, q: 5.5, g: open ? 0.18 : 0.12 },
        ];

        const modeSum = this.audioContext.createGain();
        modeSum.gain.value = 1;

        // Parallel resonators driven by the same noise excitation
        modes.forEach(m => {
          const peak = this.audioContext.createBiquadFilter();
          peak.type = 'peaking';
          peak.frequency.value = Math.max(80, Math.min(m.f, sr / 2 - 200));
          peak.Q.value = m.q;
          peak.gain.value = 10 + m.g * 14;
          noise.connect(peak);
          peak.connect(modeSum);
        });

        // Add airy bandpassed noise for finger/slap texture
        const airBP = this.audioContext.createBiquadFilter();
        airBP.type = 'bandpass';
        airBP.frequency.value = 2200 * brightness;
        airBP.Q.value = 1.6;
        const airGain = this.audioContext.createGain();
        airGain.gain.value = open ? 0.22 : 0.18;
        noise.connect(airBP);
        airBP.connect(airGain);

        // Click path
        const clickGain = this.audioContext.createGain();
        clickGain.gain.value = open ? 0.12 : 0.16;
        click.connect(clickHP);
        clickHP.connect(clickGain);

        const out = this.audioContext.createGain();
        // Slightly hotter peak; envelope gives punch without being purely synthetic
        this._makeQuickEnvelope(out.gain, now, Math.max(0.0002, volume) * (open ? 1.1 : 0.95), 0.0015, open ? 0.22 : 0.12);

        const sum = this.audioContext.createGain();
        sum.gain.value = 1;
        modeSum.connect(sum);
        airGain.connect(sum);
        clickGain.connect(sum);
        sum.connect(out);
        out.connect(this.tablaGain || this.masterGain);

        noise.start(now);
        noise.stop(now + dur);
        click.start(now);
        click.stop(now + 0.03);
      }

      _playBayan(now, volume, open = true) {
        if (!this.audioContext || !this.masterGain) return;
        const sr = this.audioContext.sampleRate;

        // Bayan: low fundamental + a few partials + soft "hand" noise.
        const dur = open ? 0.35 : 0.22;
        const base = (open ? 92 : 78) * this._randRange(0.985, 1.02);

        const osc1 = this.audioContext.createOscillator();
        const osc2 = this.audioContext.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'sine';

        // Gentle pitch drop like real membrane settling
        osc1.frequency.setValueAtTime(base, now);
        osc1.frequency.exponentialRampToValueAtTime(base * 0.72, now + (open ? 0.18 : 0.12));
        osc2.frequency.setValueAtTime(base * 2.01, now);
        osc2.frequency.exponentialRampToValueAtTime(base * 2.01 * 0.76, now + (open ? 0.18 : 0.12));

        const oscMix = this.audioContext.createGain();
        oscMix.gain.value = 1;
        const g1 = this.audioContext.createGain();
        const g2 = this.audioContext.createGain();
        g1.gain.value = 1.0;
        g2.gain.value = 0.28;
        osc1.connect(g1);
        osc2.connect(g2);
        g1.connect(oscMix);
        g2.connect(oscMix);

        // Hand/noise component (lowpassed + a bit of mid thump)
        const hand = this.audioContext.createBufferSource();
        hand.buffer = this._makeNoiseBuffer(open ? 0.08 : 0.06, 0.25);
        const handLP = this.audioContext.createBiquadFilter();
        handLP.type = 'lowpass';
        handLP.frequency.value = open ? 520 : 420;
        handLP.Q.value = 0.7;

        const thump = this.audioContext.createBiquadFilter();
        thump.type = 'peaking';
        thump.frequency.value = open ? 190 : 160;
        thump.Q.value = 1.1;
        thump.gain.value = 6;

        const handGain = this.audioContext.createGain();
        handGain.gain.value = open ? 0.28 : 0.22;

        hand.connect(handLP);
        handLP.connect(thump);
        thump.connect(handGain);

        // Shape and saturate lightly
        const lp = this.audioContext.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = open ? 520 : 420;
        lp.Q.value = 0.8;

        const out = this.audioContext.createGain();
        this._makeQuickEnvelope(out.gain, now, Math.max(0.0002, volume) * 1.05, 0.0035, open ? 0.35 : 0.22);

        const sum = this.audioContext.createGain();
        sum.gain.value = 1;
        oscMix.connect(lp);
        lp.connect(sum);
        handGain.connect(sum);
        sum.connect(out);
        out.connect(this.tablaGain || this.masterGain);

        osc1.start(now);
        osc2.start(now);
        hand.start(now);

        osc1.stop(now + dur);
        osc2.stop(now + dur);
        hand.stop(now + 0.1);
      }

      /**
       * Play a tabla bol (very lightweight model).
       * Supported bols: Dha, Dhin, Tin, Ta
       */
      playTablaBol(bol, when = null, volume = 0.25, accent = 1.0) {
        if (!this.audioContext) return;
        // Tiny humanization (kept very small so taal stays locked)
        const now = (when ?? this.audioContext.currentTime) + this._randRange(-0.004, 0.004);
        const base = Math.max(0, Math.min(5, volume));
        const acc = Math.max(0.4, Math.min(2.0, accent));
        // Allow up to 5x user scaling, but keep the final level bounded.
        const v = Math.min(5, base * acc);

        switch (bol) {
          case 'Dha':
            this._playBayan(now, v * 0.75, true);
            this._playDayan(now, v * 0.55, 1.02, true);
            break;
          case 'Dhin':
            this._playBayan(now, v * 0.6, true);
            this._playDayan(now, v * 0.48, 0.96, true);
            break;
          case 'Tin':
            this._playDayan(now, v * 0.62, 1.12, true);
            break;
          case 'Ta':
            // Muted stroke
            this._playDayan(now, v * 0.52, 1.35, false);
            break;
          default:
            // no-op
            break;
        }
      }

      /**
       * Create ADSR envelope on a gain node.
       * @param {GainNode} gainNode - Target gain node
       * @param {number} duration - Total note duration in seconds
       * @param {number} [attack=0.02] - Attack time
       * @param {number} [decay=0.1] - Decay time  
       * @param {number} [sustain=0.8] - Sustain level (0-1)
       * @param {number} [release=0.08] - Release time
       */
      createEnvelope(gainNode, duration, attack = 0.02, decay = 0.1, sustain = 0.8, release = 0.08, startTime = null) {
        if (!this.audioContext) return;
        const now = this._safeStartTime(startTime, 0.005);
        
        // Scale envelope times for very short notes, but maintain legato
        const scale = Math.min(1, duration / 0.15);
        const actualAttack = Math.max(0.005, attack * scale);
        const actualDecay = decay * scale;
        // Release extends slightly beyond note for overlap
        const actualRelease = Math.min(release, duration * 0.2);
        
        const attackEnd = now + actualAttack;
        const decayEnd = attackEnd + actualDecay;
        const sustainEnd = now + duration;
        
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(1, attackEnd);
        gainNode.gain.linearRampToValueAtTime(sustain, decayEnd);
        gainNode.gain.setValueAtTime(sustain, sustainEnd - actualRelease);
        // Fade out but next note will already be playing
        gainNode.gain.linearRampToValueAtTime(0.01, sustainEnd + actualRelease);
      }

      /**
       * Apply a slow pitch oscillation (andolan) to a buffer source by modulating playbackRate.
       * This keeps timbre consistent for buffer-based instruments (flute/harmonium/sitar).
       * @param {AudioBufferSourceNode} source
       * @param {number} startTime
       * @param {number} duration
       * @param {number} baseFrequency
       * @param {number|null|undefined} depthHz
       * @param {number} [rateHz=4.5]
       * @returns {{lfo: OscillatorNode, lfoGain: GainNode}|null}
       */
      _attachAndolanToPlaybackRate(source, startTime, duration, baseFrequency, depthHz, rateHz = 4.5) {
        if (!this.audioContext) return null;
        const depth = (typeof depthHz === 'number' && Number.isFinite(depthHz)) ? Math.max(0, depthHz) : 0;
        if (!(depth > 0) || !(baseFrequency > 0)) return null;

        // playbackRate is a ratio; approximate +/-depthHz by +/- depthHz/baseFrequency.
        // Clamp to avoid extreme warble at very low notes.
        const depthRatio = Math.min(0.08, depth / baseFrequency);

        const lfo = this.audioContext.createOscillator();
        const lfoGain = this.audioContext.createGain();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(rateHz, startTime);
        lfoGain.gain.setValueAtTime(depthRatio, startTime);

        // Ensure a stable base value; connected signals add to this.
        source.playbackRate.setValueAtTime(1, startTime);
        lfo.connect(lfoGain);
        lfoGain.connect(source.playbackRate);

        lfo.start(startTime);
        lfo.stop(startTime + duration + 0.05);
        return { lfo, lfoGain };
      }

      // Instrument-specific note playing methods
      
      /**
       * Play a note using bansuri (Indian bamboo flute) synthesis.
       * @param {number} frequency - Target frequency in Hz
       * @param {number} duration - Note duration in seconds
       * @param {number} [volume=0.3] - Volume level 0-1
       * @param {number|null} [prevFrequency=null] - Previous note for meend (glide)
       */
      playFlute(frequency, duration, volume = 0.3, prevFrequency = null, andolanDepthHz = null) {
        if (!this.audioContext) return;
        
        // === BANSURI SYNTHESIS CONSTANTS ===
        const MEEND_DURATION = 0.22;        // Meend glide time in seconds
        const VIBRATO_RATE = 4.8;           // Hz - slower than Western flute
        const VIBRATO_DEPTH = 0.012;        // Pitch deviation ratio
        const VIBRATO_ONSET = 0.3;          // Seconds before vibrato starts
        const PITCH_WANDER_CHANCE = 0.002;  // Probability per sample
        const PITCH_WANDER_RANGE = 0.004;   // Max pitch deviation
        const ATTACK_TIME = 0.08;           // Attack envelope time
        const RELEASE_TIME = 0.12;          // Release envelope time
        
        // Harmonic amplitudes: fundamental-heavy for hollow bamboo sound
        const HARMONIC_AMPS = [1.0, 0.18, 0.06, 0.02];
        
        // Breath mix ratios (low, mid, high air components)
        const BREATH_MIX = { low: 0.15, mid: 0.3, high: 0.2, tone: 0.55, breath: 0.45 };
        
        // NOTE: Do not capture "now" early. First-call synthesis can be slow and schedule times
        // into the past if we compute them before heavy buffer generation.
        const sampleRate = this.audioContext.sampleRate;
        const bufferSize = Math.ceil(sampleRate * duration);
        const buffer = this.audioContext.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        
        // BANSURI - Indian bamboo flute
        // Key character: breathy, hollow, airy, intimate, NOT bright/focused like Western flute
        // The breath sound is integral to the tone, not a defect
        
        // Meend - very important in bansuri playing
        let currentFreq = prevFrequency && Math.abs(frequency - prevFrequency) > 5 ? prevFrequency : frequency;
        const targetFreq = frequency;
        const meendSamples = Math.floor(MEEND_DURATION * sampleRate);
        
        // Breath/air noise states - this is crucial for bansuri
        let breathState1 = 0;
        let breathState2 = 0;
        let breathState3 = 0;
        
        // Pitch instability - bansuri has natural micro-variations
        let pitchWander = 0;
        let pitchWanderTarget = 0;
        
        // Phase for tone generation
        let phase = 0;
        
        // Breath pressure variation (simulates natural breathing)
        let breathPressure = 0;
        
        for (let i = 0; i < bufferSize; i++) {
          const t = i / sampleRate;
          
          // Meend with very smooth curve
          if (i < meendSamples && prevFrequency && currentFreq !== targetFreq) {
            const mt = i / meendSamples;
            // Very smooth S-curve for vocal-like meend
            const curve = mt * mt * mt * (mt * (6 * mt - 15) + 10);
            currentFreq = prevFrequency + (targetFreq - prevFrequency) * curve;
          } else {
            currentFreq = targetFreq;
          }
          
          // Natural pitch instability (micro-wandering)
          if (Math.random() < PITCH_WANDER_CHANCE) {
            pitchWanderTarget = (Math.random() - 0.5) * PITCH_WANDER_RANGE;
          }
          pitchWander += (pitchWanderTarget - pitchWander) * 0.001;
          
          // Vibrato - Indian classical style
          let vibrato = 0;
          if (t > VIBRATO_ONSET) {
            const vibT = t - VIBRATO_ONSET;
            // Gradual onset, slight irregularity
            const vibEnv = Math.min(1, vibT / 0.5);
            const vibRate = VIBRATO_RATE + Math.sin(t * 0.7) * 0.3; // Slight rate variation
            vibrato = Math.sin(2 * Math.PI * vibRate * vibT) * VIBRATO_DEPTH * vibEnv;
          }
          
          const instantFreq = currentFreq * (1 + vibrato + pitchWander);
          
          // === BREATH/AIR SOUND - The soul of bansuri ===
          // Multiple filtered noise layers to create complex breath texture
          
          const whiteNoise = Math.random() * 2 - 1;
          
          // Layer 1: Low rumble (breath from chest)
          breathState1 = breathState1 * 0.95 + whiteNoise * 0.05;
          
          // Layer 2: Mid breath (throat/mouth cavity)
          breathState2 = breathState2 * 0.8 + whiteNoise * 0.2;
          
          // Layer 3: High air (at embouchure)
          breathState3 = breathState3 * 0.6 + whiteNoise * 0.4;
          
          // Breath pressure envelope - soft attack, constant presence
          const attackTime = 0.15;
          if (t < attackTime) {
            breathPressure = (t / attackTime) * (2 - t / attackTime); // Soft rise
          } else {
            // Subtle breathing variation during sustain
            breathPressure = 0.85 + Math.sin(t * 2.5) * 0.1 + Math.sin(t * 1.1) * 0.05;
          }
          
          // === FREQUENCY-DEPENDENT BREATH ===
          // Lower notes have more air sound (larger finger holes, more turbulence)
          const freqRatio = Math.min(frequency / 400, 1.5); // Normalize around middle register
          const breathIntensity = 1.2 - freqRatio * 0.3; // More breath in low notes
          
          // Combine breath layers with frequency-dependent mixing
          const breathSound = (
            breathState1 * 0.15 * (1.3 - freqRatio * 0.2) +  // Low component stronger for low notes
            breathState2 * 0.3 +   // Mid component  
            breathState3 * 0.2 * (0.7 + freqRatio * 0.3)     // High air stronger for high notes
          ) * breathPressure * breathIntensity;
          
          // === TONE GENERATION - Bamboo tube resonance model ===
          phase += (2 * Math.PI * instantFreq) / sampleRate;
          
          // Bansuri harmonic structure varies with register
          // Lower notes: stronger fundamental, weaker harmonics (more hollow)
          // Higher notes: slightly more harmonic content
          let tone = 0;
          
          // Fundamental - always dominant
          tone += Math.sin(phase) * 1.0;
          
          // Second harmonic - varies with register
          const h2Amp = 0.12 + freqRatio * 0.08; // 0.12-0.20
          tone += Math.sin(phase * 2) * h2Amp;
          
          // Third harmonic - bamboo creates slight odd-harmonic emphasis
          const h3Amp = 0.04 + freqRatio * 0.04; // 0.04-0.08
          tone += Math.sin(phase * 3) * h3Amp;
          
          // Fourth harmonic - very weak
          tone += Math.sin(phase * 4) * 0.02;
          
          // === BAMBOO TUBE RESONANCE ===
          // Real bamboo has formant-like resonances from tube shape
          // Add subtle resonance peaks that shift with frequency
          const tubeResonance1 = Math.sin(phase * 1.5) * 0.03 * Math.sin(t * 3.7);
          const tubeResonance2 = Math.sin(phase * 2.5) * 0.02 * Math.sin(t * 5.3);
          tone += tubeResonance1 + tubeResonance2;
          
          // Breath-tone interaction - breath affects tone stability
          tone *= (1 + breathState2 * 0.06);
          
          // === EMBOUCHURE TURBULENCE ===
          // Edge tone from air splitting at blowing edge
          // This is pitched noise that tracks the fundamental
          const edgeTurbulence = breathState3 * 0.15 * breathPressure;
          const edgeTone = edgeTurbulence * Math.sin(phase * 0.5 + breathState2 * 0.5);
          
          // Slight pitch instability from turbulent airflow
          const turbulentPitch = Math.sin(phase + breathState3 * 0.3) * 0.02 * breathPressure;
          
          // === FINAL MIX ===
          // Tone shaped by breath pressure (breath gives life to the tone)
          const shapedTone = tone * breathPressure * 0.52;
          
          // Breath is always audible - integral to bansuri character
          const prominentBreath = breathSound * 0.48;
          
          // Combine with edge effects
          let output = shapedTone + prominentBreath + edgeTone + turbulentPitch;
          
          // Bamboo tube soft limiting (natural compression)
          output = Math.tanh(output * 0.85) * 0.9;
          
          data[i] = output;
        }
        
        // Amplitude envelope - legato with breath-like onset
        const attackSamples = Math.floor(0.06 * sampleRate); // Slightly faster attack
        const releaseSamples = Math.floor(0.15 * sampleRate);
        const releaseStart = bufferSize - releaseSamples / 2;
        
        for (let i = 0; i < bufferSize; i++) {
          let env = 1;
          if (i < attackSamples) {
            // Breath building - not perfectly smooth (real breath has micro-variations)
            const t = i / attackSamples;
            const breathVariation = 1 + Math.sin(i * 0.01) * 0.05;
            env = t * t * breathVariation;
          } else if (i > releaseStart) {
            // Breath trailing off
            const t = (i - releaseStart) / releaseSamples;
            env = Math.max(0.01, Math.exp(-t * 2.5));
          }
          data[i] *= env * volume * 1.5;
        }
        
        // Play through filters that enhance bamboo character
        const source = this.audioContext.createBufferSource();
        source.buffer = buffer;

        const startTime = this._safeStartTime(null, 0.02);
        const andolan = this._attachAndolanToPlaybackRate(source, startTime, duration, frequency, andolanDepthHz, 4.5);
        
        // Bamboo body resonance - warm, hollow
        const bodyResonance = this.audioContext.createBiquadFilter();
        bodyResonance.type = 'peaking';
        bodyResonance.frequency.value = frequency * 0.8; // Below fundamental
        bodyResonance.Q.value = 1.5;
        bodyResonance.gain.value = 3;
        
        // Hollow character - slight dip in upper mids
        const hollowness = this.audioContext.createBiquadFilter();
        hollowness.type = 'peaking';
        hollowness.frequency.value = 2000;
        hollowness.Q.value = 0.8;
        hollowness.gain.value = -3; // Cut, not boost
        
        // Gentle high roll-off (bansuri is not bright)
        const warmth = this.audioContext.createBiquadFilter();
        warmth.type = 'lowpass';
        warmth.frequency.value = Math.min(frequency * 5, 6000); // Much lower than before
        warmth.Q.value = 0.5;
        
        // Breath presence in high-mids
        const breathPresence = this.audioContext.createBiquadFilter();
        breathPresence.type = 'peaking';
        breathPresence.frequency.value = 3500;
        breathPresence.Q.value = 1;
        breathPresence.gain.value = 2;
        
        source.connect(bodyResonance);
        bodyResonance.connect(hollowness);
        hollowness.connect(warmth);
        warmth.connect(breathPresence);
        breathPresence.connect(this.masterGain);
        
        // Memory cleanup: disconnect all nodes when done
        source.onended = () => {
          try {
            source.disconnect();
            bodyResonance.disconnect();
            hollowness.disconnect();
            warmth.disconnect();
            breathPresence.disconnect();
            if (andolan) {
              andolan.lfo.disconnect();
              andolan.lfoGain.disconnect();
            }
            this._activeSources.delete(source);
          } catch (e) { /* Already disconnected */ }
        };
        this._activeSources.add(source);

        source.start(startTime);
        source.stop(startTime + duration);
      }

      playHarmonium(frequency, duration, volume = 0.3, prevFrequency = null, andolanDepthHz = null) {
        if (!this.audioContext) return;
        // NOTE: Avoid capturing "now" early; first call can be slow.
        const sampleRate = this.audioContext.sampleRate;
        const bufferSize = Math.ceil(sampleRate * duration);
        const buffer = this.audioContext.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        
        // Harmonium reed physical modeling
        // Multiple reeds slightly detuned (like real harmonium)
        const reeds = [
          { freq: frequency, amp: 1.0, detune: 0 },
          { freq: frequency, amp: 0.8, detune: 1.5 },  // Slightly sharp
          { freq: frequency, amp: 0.6, detune: -1.2 }, // Slightly flat
        ];
        
        // Reed harmonic content - harmonium has strong odd harmonics
        const harmonicAmps = [1.0, 0.0, 0.6, 0.0, 0.35, 0.0, 0.2, 0.1, 0.15, 0.08];
        
        // Bellows simulation - slight amplitude and pitch wobble
        const bellowsRate = 3.5; // Hz
        const bellowsPitchDepth = 0.003;
        const bellowsAmpDepth = 0.08;
        
        // Phase accumulators for each reed
        const phases = reeds.map(() => Math.random() * Math.PI * 2);
        
        for (let i = 0; i < bufferSize; i++) {
          const t = i / sampleRate;
          
          // Bellows modulation
          const bellowsPhase = 2 * Math.PI * bellowsRate * t;
          const bellowsPitch = 1 + Math.sin(bellowsPhase) * bellowsPitchDepth;
          const bellowsAmp = 1 + Math.sin(bellowsPhase * 1.1) * bellowsAmpDepth;
          
          let output = 0;
          
          // Sum all reeds
          for (let r = 0; r < reeds.length; r++) {
            const reed = reeds[r];
            const reedFreq = (reed.freq + reed.detune) * bellowsPitch;
            phases[r] += (2 * Math.PI * reedFreq) / sampleRate;
            
            // Generate harmonics for this reed
            let reedOutput = 0;
            for (let h = 0; h < harmonicAmps.length; h++) {
              const hFreq = reedFreq * (h + 1);
              if (hFreq < sampleRate / 2 && harmonicAmps[h] > 0) {
                reedOutput += Math.sin(phases[r] * (h + 1)) * harmonicAmps[h];
              }
            }
            
            // Reed nonlinearity - soft clipping
            reedOutput = Math.tanh(reedOutput * 0.8);
            
            output += reedOutput * reed.amp;
          }
          
          output = output / reeds.length * bellowsAmp;
          
          // Add subtle air/pump noise
          const noise = (Math.random() * 2 - 1) * 0.02 * bellowsAmp;
          output += noise;
          
          data[i] = output;
        }
        
        // Envelope - legato style, bellows continuous
        const attackTime = 0.1;
        const releaseTime = 0.15;
        const attackSamples = Math.floor(attackTime * sampleRate);
        const releaseSamples = Math.floor(releaseTime * sampleRate);
        const releaseStart = bufferSize - releaseSamples / 2;
        
        for (let i = 0; i < bufferSize; i++) {
          let env = 1;
          if (i < attackSamples) {
            // Bellows attack
            const t = i / attackSamples;
            env = 1 - Math.exp(-t * 5);
          } else if (i > releaseStart) {
            // Gentle release with overlap
            const t = (i - releaseStart) / releaseSamples;
            env = Math.max(0.01, Math.exp(-t * 2));
          }
          data[i] *= env * volume * 0.8;
        }
        
        // Play buffer
        const source = this.audioContext.createBufferSource();
        source.buffer = buffer;

        const startTime = this._safeStartTime(null, 0.02);
        const andolan = this._attachAndolanToPlaybackRate(source, startTime, duration, frequency, andolanDepthHz, 4.5);
        
        // Harmonium body resonance - warm low-mid boost
        const bodyResonance = this.audioContext.createBiquadFilter();
        bodyResonance.type = 'peaking';
        bodyResonance.frequency.value = 400;
        bodyResonance.Q.value = 1;
        bodyResonance.gain.value = 4;
        
        // Roll off harsh highs
        const lpf = this.audioContext.createBiquadFilter();
        lpf.type = 'lowpass';
        lpf.frequency.value = 4000;
        lpf.Q.value = 0.7;
        
        source.connect(bodyResonance);
        bodyResonance.connect(lpf);
        lpf.connect(this.masterGain);
        
        // Memory cleanup: disconnect all nodes when done
        source.onended = () => {
          try {
            source.disconnect();
            bodyResonance.disconnect();
            lpf.disconnect();
            if (andolan) {
              andolan.lfo.disconnect();
              andolan.lfoGain.disconnect();
            }
            this._activeSources.delete(source);
          } catch (e) { /* Already disconnected */ }
        };
        this._activeSources.add(source);

        source.start(startTime);
        source.stop(startTime + duration);
      }

      playSitar(frequency, duration, volume = 0.3, prevFrequency = null, useKanSwar = false, kanFrequency = null, andolanDepthHz = null) {
        if (!this.audioContext) return;
        const now = this.audioContext.currentTime;
        
        // Kan swar for sitar - quick grace note
        if (useKanSwar && kanFrequency) {
          this.playSitarNote(kanFrequency, 0.06, volume * 0.5, now);
        }
        
        const startTime = useKanSwar ? now + 0.05 : now;
        this.playSitarNote(frequency, duration, volume, startTime, prevFrequency, andolanDepthHz);
      }

      /**
       * Advanced Sitar Physical Model
       * 
       * Based on real sitar acoustics research:
       * - Dual coupled strings (main + chikari)
       * - Curved jawari bridge with nonlinear string-bridge interaction
       * - Frequency-dependent damping from gourd body
       * - Accurate inharmonicity from wound steel strings
       * - Modal synthesis for body resonances
       */
      playSitarNote(frequency, duration, volume, startTime, prevFrequency = null, andolanDepthHz = null) {
        const sampleRate = this.audioContext.sampleRate;
        const bufferSize = Math.ceil(sampleRate * Math.max(duration, 3.0));
        const buffer = this.audioContext.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        
        // === PHYSICAL MODEL CONSTANTS ===
        // Derived from actual sitar measurements and recordings
        
        // String parameters (steel main string, ~0.4mm diameter)
        const STRING_TENSION = 60;              // Newtons (typical sitar tuning)
        const STRING_LENGTH = 0.9;              // Meters (vibrating length)
        const LINEAR_DENSITY = 0.003;           // kg/m
        const PLUCK_POSITION = 0.13;            // Ratio - near bridge for brightness
        
        // Inharmonicity coefficient B = (pi^3 * E * d^4) / (64 * T * L^2)
        // For steel string, this creates the characteristic stretched partials
        const INHARMONICITY = 0.00012;
        
        // Jawari (curved bridge) - THE signature of sitar sound
        // The string grazes against the curved bridge, creating complex harmonics
        const JAWARI_CURVATURE = 0.015;         // Bridge curve depth
        const JAWARI_WIDTH = 0.008;             // Contact zone width
        const JAWARI_HARDNESS = 0.92;           // Bone/ivory hardness (affects buzz)
        
        // Decay characteristics
        const DECAY_FUNDAMENTAL = 0.9996;       // Very long ring
        const DECAY_HARMONICS = 0.9985;         // Harmonics decay faster
        const FREQ_DEPENDENT_DAMPING = 0.00001; // Higher = more damping at high freq
        
        // Meend (pitch bend) physics
        const MEEND_TIME = 0.28;
        const MEEND_OVERSHOOT = 0.015;          // Slight overshoot at end of bend
        
        // === MULTI-DELAY LINE WAVEGUIDE MODEL ===
        // Using extended Karplus-Strong with multiple coupled delay lines
        
        const fundamentalDelay = Math.round(sampleRate / frequency);
        
        // Main string delay line
        const mainString = new Float32Array(fundamentalDelay);
        
        // Second delay line for the "chikari" drone strings effect
        // Tuned to Sa (tonic) - adds characteristic drone quality
        const chikariDelay = Math.round(sampleRate / (frequency * 2)); // Octave above
        const chikariString = new Float32Array(chikariDelay);
        
        // Third delay for jawari resonance modeling
        const jawariDelay = Math.round(sampleRate / (frequency * 3.17)); // Non-harmonic for buzz
        const jawariLine = new Float32Array(jawariDelay);
        
        // === EXCITATION SIGNAL ===
        // Model the mizrab (metal plectrum) striking the string
        
        const pluckSamples = Math.floor(fundamentalDelay * PLUCK_POSITION);
        
        // Generate sophisticated excitation
        for (let i = 0; i < fundamentalDelay; i++) {
          let excitation = 0;
          
          // Main pluck shape - raised cosine (smoother than triangle)
          if (i < pluckSamples * 2) {
            const phase = Math.PI * i / (pluckSamples * 2);
            excitation = Math.sin(phase);
          }
          
          // Add mizrab (pick) transient - metallic click
          // This is crucial for the "attack" character
          if (i < 20) {
            const mizrabPhase = i / 20;
            // Multiple impulses for realistic pick sound
            excitation += (1 - mizrabPhase) * 0.6 * Math.sin(mizrabPhase * Math.PI * 8);
            excitation += (1 - mizrabPhase) * 0.3 * Math.sin(mizrabPhase * Math.PI * 17);
          }
          
          // Colored noise component - filtered through pluck position
          // This simulates the chaotic initial vibration
          const noise = (Math.random() * 2 - 1);
          // Apply comb filter effect from pluck position
          const combDelay = Math.floor(fundamentalDelay / PLUCK_POSITION);
          const combNoise = i > combDelay ? noise - mainString[(i - combDelay) % fundamentalDelay] * 0.5 : noise;
          
          excitation += combNoise * 0.25 * Math.exp(-i / (fundamentalDelay * 0.3));
          
          mainString[i] = excitation;
        }
        
        // Initialize chikari with sympathetic excitation
        for (let i = 0; i < chikariDelay; i++) {
          chikariString[i] = (Math.random() * 2 - 1) * 0.02;
        }
        
        // === PROCESSING STATE ===
        let mainIndex = 0;
        let chikariIndex = 0;
        let jawariIndex = 0;
        
        // Filter states for each delay line
        let mainPrev = 0, mainPrevPrev = 0;
        let chikariPrev = 0;
        let jawariPrev = 0;
        
        // Allpass interpolation for pitch bending
        let allpass1 = 0, allpass2 = 0;
        
        // Meend setup
        let currentFreq = (prevFrequency && Math.abs(frequency - prevFrequency) > 5) 
          ? prevFrequency : frequency;
        const targetFreq = frequency;
        const meendSamples = Math.floor(MEEND_TIME * sampleRate);
        
        // Jawari state - models the nonlinear bridge contact
        let jawariContact = 0;        // How much string is touching bridge
        let jawariVelocity = 0;       // Rate of change
        const jawariMass = 0.0001;    // Effective vibrating mass at contact
        const jawariSpring = 40000;   // Bridge stiffness
        
        // DC blocker state
        let dcPrev = 0, dcOut = 0;
        
        // === MAIN SYNTHESIS LOOP ===
        for (let i = 0; i < bufferSize; i++) {
          const t = i / sampleRate;
          
          // --- MEEND (Pitch Bend) with realistic physics ---
          if (i < meendSamples && prevFrequency && Math.abs(targetFreq - prevFrequency) > 5) {
            const bendProgress = i / meendSamples;
            // Use critically damped response for natural feel
            const omega = 8;  // Natural frequency of bend
            const zeta = 0.85; // Damping ratio (slightly underdamped for overshoot)
            const expTerm = Math.exp(-zeta * omega * bendProgress);
            const curve = 1 - expTerm * (Math.cos(omega * Math.sqrt(1 - zeta*zeta) * bendProgress) 
              + (zeta / Math.sqrt(1 - zeta*zeta)) * Math.sin(omega * Math.sqrt(1 - zeta*zeta) * bendProgress));
            
            currentFreq = prevFrequency + (targetFreq - prevFrequency) * Math.min(curve, 1 + MEEND_OVERSHOOT);
          } else {
            currentFreq = targetFreq;
          }
          
          // Calculate current delay length for pitch
          const currentDelay = sampleRate / currentFreq;
          const delayInt = Math.floor(currentDelay);
          const delayFrac = currentDelay - delayInt;
          
          // --- READ FROM MAIN STRING with fractional delay ---
          const mainIdx = mainIndex % mainString.length;
          const mainSample = mainString[mainIdx];
          
          // First-order allpass interpolation for fractional delay
          const allpassCoef = (1 - delayFrac) / (1 + delayFrac);
          const interpolated = allpassCoef * mainSample + allpass1 - allpassCoef * allpass2;
          allpass1 = mainSample;
          allpass2 = interpolated;
          
          // --- KARPLUS-STRONG FILTERING with enhancements ---
          
          // Frequency-dependent damping (higher harmonics decay faster)
          const freqDampFactor = 1 - FREQ_DEPENDENT_DAMPING * currentFreq;
          const effectiveDecay = DECAY_FUNDAMENTAL * freqDampFactor;
          
          // Two-point average (standard KS) with brightness control
          const brightness = 0.55 + (currentFreq / 1000) * 0.05; // Brighter at higher pitches
          const filtered = brightness * interpolated + (1 - brightness) * mainPrev;
          
          // String stiffness dispersion (creates inharmonicity)
          // d[n] = y[n] + B * (y[n] - 2*y[n-1] + y[n-2])
          const stiff = filtered + INHARMONICITY * currentFreq * (filtered - 2*mainPrev + mainPrevPrev);
          
          // --- JAWARI (Bridge Buzz) PHYSICAL MODEL ---
          // This is the heart of sitar sound - nonlinear string-bridge interaction
          
          // Model: string displacement causes contact with curved bridge
          // When contact occurs, it creates additional harmonics and buzz
          
          const stringDisplacement = stiff;
          const displacementAbs = Math.abs(stringDisplacement);
          
          // Calculate contact force using Hertzian contact model
          // F = k * (x - gap)^1.5 for x > gap
          const bridgeGap = JAWARI_CURVATURE * (1 + 0.3 * Math.sin(currentFreq * 0.01)); // Freq-dependent gap
          let jawariOutput = 0;
          
          if (displacementAbs > bridgeGap) {
            const penetration = displacementAbs - bridgeGap;
            // Hertzian contact force (power 1.5)
            const contactForce = Math.pow(penetration / JAWARI_WIDTH, 1.5) * Math.sign(stringDisplacement);
            
            // Bridge resonator - creates the buzz frequencies
            const jawariDrive = contactForce * (1 - JAWARI_HARDNESS);
            jawariVelocity += (jawariSpring * (jawariDrive - jawariContact) - 0.3 * jawariVelocity) / sampleRate;
            jawariContact += jawariVelocity / sampleRate;
            
            // The jawari buzz signal
            jawariOutput = jawariContact * 0.6;
            
            // Add to jawari delay line for sustained buzz
            const jIdx = jawariIndex % jawariLine.length;
            jawariLine[jIdx] = jawariOutput * 0.4 + jawariLine[(jawariIndex + 1) % jawariLine.length] * 0.55;
            
            // Non-harmonic buzz components (crucial for realism)
            // These arise from the irregular bridge surface
            jawariOutput += Math.sin(i * 2 * Math.PI * currentFreq * 2.17 / sampleRate) * penetration * 0.15;
            jawariOutput += Math.sin(i * 2 * Math.PI * currentFreq * 3.41 / sampleRate) * penetration * 0.08;
            jawariOutput += Math.sin(i * 2 * Math.PI * currentFreq * 5.13 / sampleRate) * penetration * 0.04;
          } else {
            // No contact - decay the buzz smoothly
            jawariContact *= 0.995;
            jawariVelocity *= 0.98;
            jawariOutput = jawariLine[jawariIndex % jawariLine.length] * 0.7;
          }
          
          // Read from jawari delay line (adds sustain to buzz)
          const jReadIdx = (jawariIndex + 1) % jawariLine.length;
          const jawariDelayed = jawariLine[jReadIdx];
          jawariLine[jawariIndex % jawariLine.length] = (jawariOutput + jawariDelayed * 0.5) * 0.97;
          jawariIndex++;
          
          // --- CHIKARI STRING (sympathetic coupling) ---
          // Adds the characteristic "halo" around each note
          
          const chikariIdx = chikariIndex % chikariString.length;
          let chikariSample = chikariString[chikariIdx];
          
          // Couple main string energy into chikari
          const coupling = 0.008 * Math.exp(-t * 0.5); // Coupling decays over time
          chikariSample += mainSample * coupling;
          
          // Chikari filtering (brighter than main string)
          const chikariFiltered = 0.6 * chikariSample + 0.4 * chikariPrev;
          chikariString[chikariIdx] = chikariFiltered * 0.9992;
          chikariPrev = chikariFiltered;
          chikariIndex++;
          
          // --- COMBINE ALL COMPONENTS ---
          let output = stiff;                          // Main string
          output += jawariOutput * 0.35;               // Jawari buzz
          output += jawariDelayed * 0.15;              // Sustained buzz
          output += chikariFiltered * 0.12;            // Chikari resonance
          
          // --- WRITE BACK TO DELAY LINE ---
          mainString[mainIndex % mainString.length] = stiff * effectiveDecay;
          mainPrevPrev = mainPrev;
          mainPrev = filtered;
          mainIndex++;
          
          // --- DC BLOCKER (removes any DC offset buildup) ---
          dcOut = output - dcPrev + 0.995 * dcOut;
          dcPrev = output;
          output = dcOut;
          
          data[i] = output;
        }
        
        // === AMPLITUDE ENVELOPE ===
        // Sitar has very sharp attack, initial decay, then long sustain
        
        const attackMs = 0.8;
        const attackSamples = Math.floor(attackMs * sampleRate / 1000);
        const bodyDecayMs = 50;
        const bodyDecaySamples = Math.floor(bodyDecayMs * sampleRate / 1000);
        
        for (let i = 0; i < bufferSize; i++) {
          const t = i / sampleRate;
          let env = 1;
          
          if (i < attackSamples) {
            // Sharp attack with slight overshoot
            const attackPhase = i / attackSamples;
            env = attackPhase * (1 + 0.2 * Math.sin(attackPhase * Math.PI));
          } else if (i < attackSamples + bodyDecaySamples) {
            // Quick initial decay (body resonance settling)
            const decayPhase = (i - attackSamples) / bodyDecaySamples;
            env = 1.1 - 0.25 * decayPhase;
          } else {
            // Long sustain with natural decay and subtle beating
            const sustainStart = (i - attackSamples - bodyDecaySamples) / sampleRate;
            
            // Multiple beating frequencies (from sympathetic string interactions)
            const beat1 = Math.sin(sustainStart * 4.7) * 0.015;
            const beat2 = Math.sin(sustainStart * 7.3) * 0.01;
            const beat3 = Math.sin(sustainStart * 11.1) * 0.008;
            
            // Main decay envelope
            const mainDecay = Math.exp(-sustainStart * 0.45);
            
            env = 0.85 * mainDecay * (1 + beat1 + beat2 + beat3);
            env = Math.max(env, 0.005);
          }
          
          data[i] *= env * volume * 2.2;
        }
        
        // === ADD SYMPATHETIC STRING RESONANCE ===
        this.addSympathetic(data, frequency, sampleRate, volume * 0.2);
        
        // === BODY RESONANCE MODELING ===
        // Sitar has a gourd (tumba) body with specific resonance modes
        
        const source = this.audioContext.createBufferSource();
        source.buffer = buffer;

        const safeStartTime = this._safeStartTime(startTime, 0.02);
        const andolan = this._attachAndolanToPlaybackRate(source, safeStartTime, duration, frequency, andolanDepthHz, 4.5);
        
        // Primary gourd resonance (~180-250 Hz)
        const gourdResonance = this.audioContext.createBiquadFilter();
        gourdResonance.type = 'peaking';
        gourdResonance.frequency.value = 220;
        gourdResonance.Q.value = 3;
        gourdResonance.gain.value = 4;
        
        // Tabli (soundboard) resonance (~400-600 Hz)
        const tabliResonance = this.audioContext.createBiquadFilter();
        tabliResonance.type = 'peaking';
        tabliResonance.frequency.value = 480;
        tabliResonance.Q.value = 2.5;
        tabliResonance.gain.value = 2;
        
        // Presence peak (characteristic sitar "ring")
        const presencePeak = this.audioContext.createBiquadFilter();
        presencePeak.type = 'peaking';
        presencePeak.frequency.value = frequency * 2;
        presencePeak.Q.value = 1.8;
        presencePeak.gain.value = 3;
        
        // Air resonance notch (hole in gourd)
        const airNotch = this.audioContext.createBiquadFilter();
        airNotch.type = 'notch';
        airNotch.frequency.value = 350;
        airNotch.Q.value = 4;
        
        // High frequency detail (string brightness)
        const highShelf = this.audioContext.createBiquadFilter();
        highShelf.type = 'highshelf';
        highShelf.frequency.value = 2500;
        highShelf.gain.value = 2.5;
        
        // Very high shimmer
        const shimmer = this.audioContext.createBiquadFilter();
        shimmer.type = 'peaking';
        shimmer.frequency.value = 6000;
        shimmer.Q.value = 2;
        shimmer.gain.value = 1.5;
        
        // Connect chain
        source.connect(gourdResonance);
        gourdResonance.connect(tabliResonance);
        tabliResonance.connect(presencePeak);
        presencePeak.connect(airNotch);
        airNotch.connect(highShelf);
        highShelf.connect(shimmer);
        shimmer.connect(this.masterGain);
        
        // Memory cleanup
        source.onended = () => {
          try {
            source.disconnect();
            gourdResonance.disconnect();
            tabliResonance.disconnect();
            presencePeak.disconnect();
            airNotch.disconnect();
            highShelf.disconnect();
            shimmer.disconnect();
            if (andolan) {
              andolan.lfo.disconnect();
              andolan.lfoGain.disconnect();
            }
            this._activeSources.delete(source);
          } catch (e) { /* Already disconnected */ }
        };
        this._activeSources.add(source);

        source.start(safeStartTime);
        source.stop(safeStartTime + duration);
      }

      /**
       * Advanced Sympathetic String (Taraf) Model
       * 
       * Real sitar has 11-13 taraf strings that:
       * - Are tuned to the raga being played
       * - Resonate via coupling through the bridge
       * - Create the characteristic shimmering sustain
       * - Exhibit nonlinear "buzzing" when strongly excited
       * 
       * This model uses coupled waveguide synthesis with:
       * - Accurate frequency relationships (just intonation)
       * - Energy transfer from main string
       * - Individual string damping characteristics
       * - Beating between closely-tuned strings
       */
      addSympathetic(data, frequency, sampleRate, amount) {
        // Taraf tuning - based on typical raga setup
        // Using just intonation ratios relative to the played note
        // Real sitarists tune these to the specific raga
        const tarafTunings = [
          { ratio: 0.5,     name: "Sa-",  resonance: 0.7  },  // Lower octave
          { ratio: 0.5625,  name: "Re-",  resonance: 0.4  },  // 9/16
          { ratio: 0.667,   name: "Ma-",  resonance: 0.5  },  // 2/3 (fourth below)
          { ratio: 0.75,    name: "Pa-",  resonance: 0.6  },  // 3/4 (fifth below)
          { ratio: 1.0,     name: "Sa",   resonance: 1.0  },  // Unison - strongest
          { ratio: 1.122,   name: "Re",   resonance: 0.45 },  // ~9/8
          { ratio: 1.26,    name: "Ga",   resonance: 0.4  },  // ~5/4
          { ratio: 1.335,   name: "Ma",   resonance: 0.5  },  // ~4/3
          { ratio: 1.5,     name: "Pa",   resonance: 0.7  },  // 3/2 - strong
          { ratio: 1.682,   name: "Dha",  resonance: 0.4  },  // ~5/3
          { ratio: 1.888,   name: "Ni",   resonance: 0.35 },  // ~15/8
          { ratio: 2.0,     name: "Sa+",  resonance: 0.8  },  // Upper octave - strong
          { ratio: 3.0,     name: "Pa+",  resonance: 0.5  },  // Twelfth
        ];
        
        // Pre-calculate which harmonics of the main note will excite each taraf string
        // A taraf string resonates when its frequency matches a harmonic of the main string
        const mainHarmonics = [];
        for (let h = 1; h <= 16; h++) {
          mainHarmonics.push(frequency * h);
        }
        
        // Process each taraf string
        for (const taraf of tarafTunings) {
          // Add realistic detuning (strings drift slightly)
          const detuneCents = (Math.random() - 0.5) * 8; // ±4 cents
          const detuneRatio = Math.pow(2, detuneCents / 1200);
          const tarafFreq = frequency * taraf.ratio * detuneRatio;
          
          // Calculate resonance coupling strength
          // Stronger when taraf frequency matches a harmonic of the main string
          let couplingStrength = 0.15; // Base coupling through bridge
          for (const harmonic of mainHarmonics) {
            const freqDiff = Math.abs(tarafFreq - harmonic) / tarafFreq;
            if (freqDiff < 0.03) { // Within 3%
              // Gaussian-like resonance curve
              couplingStrength += (1 - freqDiff / 0.03) * 0.5;
            }
          }
          couplingStrength *= taraf.resonance;
          couplingStrength = Math.min(couplingStrength, 1.0);
