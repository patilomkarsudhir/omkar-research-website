    /**
     * Main React component for the Raga Generator application.
     * Manages state, audio playback, and canvas visualization.
     */
    function RagaGenerator() {
      // === STATE ===
      const [activeTab, setActiveTab] = useState('generator'); // 'generator' or 'tutorials'
      const [selectedRaga, setSelectedRaga] = useState('yaman');
      const [isPlaying, setIsPlaying] = useState(false);
      const [bpm, setBpm] = useState(80);
      const [temperature, setTemperature] = useState(1.0);
      const [volume, setVolume] = useState(0.5);
      const [currentBeat, setCurrentBeat] = useState(0);
      const [currentNote, setCurrentNote] = useState({ note: 0, noteName: 'Sa', frequency: SA_FREQUENCY });
      const [melodyHistory, setMelodyHistory] = useState([]);
      const [showTanpura, setShowTanpura] = useState(true);
      const [showTabla, setShowTabla] = useState(false);
      const [tablaVolume, setTablaVolume] = useState(0.6);
      const [showSpectrogram, setShowSpectrogram] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [instrument, setInstrument] = useState('sitar');
      const [toastMessage, setToastMessage] = useState('');
      const [showMetronome, setShowMetronome] = useState(true);

      // === REFS ===
      const canvasRef = useRef(null);
      const spectrogramRef = useRef(null);
      const audioEngineRef = useRef(null);
      const generatorRef = useRef(null);
      const intervalRef = useRef(null);
      const animationRef = useRef(null);

      const spectrogramDataRef = useRef(null);
      const spectrogramLastUpdateRef = useRef(0);

      const SETTINGS_KEY = 'generativeRaga.v2.settings';

      // === INITIALIZATION ===
      useEffect(() => {
        // Restore settings (best-effort)
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            if (s && typeof s === 'object') {
              if (typeof s.activeTab === 'string') setActiveTab(s.activeTab);
              if (typeof s.selectedRaga === 'string' && RAGAS[s.selectedRaga]) setSelectedRaga(s.selectedRaga);
              if (typeof s.bpm === 'number' && Number.isFinite(s.bpm)) setBpm(Math.max(40, Math.min(1280, s.bpm)));
              if (typeof s.temperature === 'number' && Number.isFinite(s.temperature)) setTemperature(Math.max(0.1, Math.min(2.0, s.temperature)));
              if (typeof s.volume === 'number' && Number.isFinite(s.volume)) setVolume(Math.max(0, Math.min(1, s.volume)));
              if (typeof s.showTanpura === 'boolean') setShowTanpura(s.showTanpura);
              if (typeof s.showTabla === 'boolean') setShowTabla(s.showTabla);
              if (typeof s.tablaVolume === 'number' && Number.isFinite(s.tablaVolume)) setTablaVolume(Math.max(0, Math.min(5, s.tablaVolume)));
              if (typeof s.showSpectrogram === 'boolean') setShowSpectrogram(s.showSpectrogram);
              if (typeof s.instrument === 'string') setInstrument(s.instrument);
            }
          }
        } catch (e) {
          // ignore
        }

        audioEngineRef.current = new AudioEngine();
        generatorRef.current = new RagaGeneratorEngine(RAGAS[selectedRaga], temperature);
        
        return () => {
          if (audioEngineRef.current) {
            audioEngineRef.current.cleanup();
          }
          if (intervalRef.current) {
            clearInterval(intervalRef.current);
          }
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, []);

      // Persist settings
      useEffect(() => {
        try {
          const payload = {
            activeTab,
            selectedRaga,
            bpm,
            temperature,
            volume,
            showTanpura,
            showTabla,
            tablaVolume,
            showSpectrogram,
            instrument,
          };
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
        } catch (e) {
          // ignore
        }
      }, [activeTab, selectedRaga, bpm, temperature, volume, showTanpura, showTabla, tablaVolume, showSpectrogram, instrument]);

      // Keyboard shortcuts
      useEffect(() => {
        const shouldIgnore = (el) => {
          if (!el) return false;
          const tag = (el.tagName || '').toLowerCase();
          return tag === 'input' || tag === 'select' || tag === 'textarea' || el.isContentEditable;
        };

        const onKeyDown = (e) => {
          if (e.defaultPrevented) return;
          if (shouldIgnore(document.activeElement)) return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;

          const key = e.key;
          if (key === ' ') {
            e.preventDefault();
            togglePlay();
            return;
          }

          if (key === 'r' || key === 'R') {
            // Record only while playing (matches button behavior)
            if (isPlaying || isRecording) {
              e.preventDefault();
              toggleRecording();
            }
            return;
          }

          if (key === 't' || key === 'T') {
            if (!isPlaying) {
              e.preventDefault();
              setShowTanpura(v => !v);
            }
            return;
          }

          if (key === 'b' || key === 'B') {
            if (!isPlaying) {
              e.preventDefault();
              setShowTabla(v => !v);
            }
            return;
          }

          if (key === '[') {
            e.preventDefault();
            setBpm(v => Math.max(40, Math.round(v - 5)));
            return;
          }
          if (key === ']') {
            e.preventDefault();
            setBpm(v => Math.min(1280, Math.round(v + 5)));
            return;
          }
          if (key === '-') {
            e.preventDefault();
            setTemperature(v => Math.max(0.1, Math.round((v - 0.05) * 100) / 100));
            return;
          }
          if (key === '=' ) {
            e.preventDefault();
            setTemperature(v => Math.min(2.0, Math.round((v + 0.05) * 100) / 100));
            return;
          }
        };

        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [togglePlay, toggleRecording, isPlaying, isRecording]);

      const downloadAudioBlob = useCallback((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        // MediaRecorder is typically webm/ogg; name it accordingly.
        const ext = (blob.type && blob.type.includes('ogg')) ? 'ogg' : 'webm';
        a.download = `raga-${selectedRaga}-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Show toast notification
        setToastMessage('🎵 Recording saved!');
        setTimeout(() => setToastMessage(''), 3000);
        // Revoke shortly after click to allow download to start.
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }, [selectedRaga]);

      const toggleRecording = useCallback(() => {
        const engine = audioEngineRef.current;
        if (!engine) return;

        if (isRecording) {
          engine.stopRecording().then((blob) => {
            downloadAudioBlob(blob);
          });
          setIsRecording(false);
          return;
        }

        // Only record once audio is initialized (requires user gesture).
        if (!isPlaying) return;
        const ok = engine.startRecording();
        if (ok) setIsRecording(true);
      }, [isRecording, isPlaying, downloadAudioBlob]);

      useEffect(() => {
        if (generatorRef.current) {
          generatorRef.current.setRaga(RAGAS[selectedRaga]);
          setMelodyHistory([]);
        }
      }, [selectedRaga]);

      useEffect(() => {
        if (generatorRef.current) {
          generatorRef.current.setTemperature(temperature);
        }
      }, [temperature]);

      useEffect(() => {
        if (audioEngineRef.current) {
          audioEngineRef.current.setMasterVolume(volume);
        }
      }, [volume]);

      const togglePlay = useCallback(async () => {
        if (!audioEngineRef.current) return;

        if (isPlaying) {
          if (intervalRef.current) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
          }

          // If recording, stop and auto-download.
          if (audioEngineRef.current.isRecording && audioEngineRef.current.isRecording()) {
            audioEngineRef.current.stopRecording().then((blob) => {
              downloadAudioBlob(blob);
            });
            setIsRecording(false);
          }

          audioEngineRef.current.stopTanpura();
          setIsPlaying(false);
        } else {
          const ok = await audioEngineRef.current.ensureRunning();
          if (!ok) return;
          
          if (showTanpura) {
            audioEngineRef.current.startTanpura();
          }
          
          let beat = 0;
          let prevFrequency = SA_FREQUENCY;
          let prevNote = 0;
          let tihaiQueue = [];  // For tihai patterns
          const beatDuration = 60 / bpm;
          
          const playBeat = () => {
            const cyclePosition = beat % 16;
            setCurrentBeat(cyclePosition);
            
            const raga = generatorRef.current.raga;
            let noteData;
            
            // Check for tihai
            if (tihaiQueue.length > 0) {
              const tihaiNote = tihaiQueue.shift();
              noteData = {
                note: tihaiNote,
                frequency: noteToFrequency(tihaiNote),
                noteName: raga.noteNames[raga.scale.indexOf(tihaiNote)] || '?'
              };
            } else {
              // Check if we should start a tihai
              if (generatorRef.current.shouldTriggerTihai(cyclePosition)) {
                tihaiQueue = generatorRef.current.generateTihaiPhrase();
                const tihaiNote = tihaiQueue.shift();
                noteData = {
                  note: tihaiNote,
                  frequency: noteToFrequency(tihaiNote),
                  noteName: raga.noteNames[raga.scale.indexOf(tihaiNote)] || '?'
                };
              } else {
                noteData = generatorRef.current.generateNextNote(cyclePosition);
              }
            }
            
            setCurrentNote(noteData);
            
            setMelodyHistory(prev => {
              const newHistory = [...prev, { ...noteData, beat: cyclePosition, timestamp: Date.now() }];
              return newHistory.slice(-64);
            });

            // Metronome click on Sam (beat 0)
            if (showMetronome && cyclePosition === 0 && audioEngineRef.current) {
              const ac = audioEngineRef.current.audioContext;
              if (ac && ac.state === 'running') {
                const now = ac.currentTime;
                const osc = ac.createOscillator();
                const env = ac.createGain();
                osc.frequency.value = 880; // A5 click
                osc.connect(env);
                env.connect(audioEngineRef.current.masterGain);
                env.gain.setValueAtTime(0.15, now);
                env.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
              }
            }

            // Tabla accompaniment (plays even when the melody rests)
            if (showTabla && audioEngineRef.current && audioEngineRef.current.playTablaBol) {
              const bols = ['Dha', 'Dhin', 'Dhin', 'Dha', 'Dha', 'Dhin', 'Dhin', 'Dha', 'Dha', 'Tin', 'Tin', 'Ta', 'Ta', 'Dhin', 'Dhin', 'Dha'];
              const bol = bols[cyclePosition] || 'Dha';
              const accent = (cyclePosition === 0 || cyclePosition === 4 || cyclePosition === 12) ? 1.35 : (cyclePosition === 8 ? 0.85 : 1.0);
              audioEngineRef.current.playTablaBol(bol, null, tablaVolume, accent);
            }
            
            let noteDuration = beatDuration * 1.05; // Slight overlap for legato
            if (cyclePosition === 0) noteDuration = beatDuration * 1.15;
            if (cyclePosition === 8) noteDuration = beatDuration * 1.1;
            
            // Hold Vadi/Samvadi/Sa longer
            // Check if important note (handle octave equivalence)
            const noteInOctave = ((noteData.note % 12) + 12) % 12;
            const vadiInOctave = ((raga.vadi % 12) + 12) % 12;
            const samvadiInOctave = ((raga.samvadi % 12) + 12) % 12;
            const isImportantNote = noteInOctave === 0 ||  // Sa in any octave
                                    noteInOctave === vadiInOctave || 
                                    noteInOctave === samvadiInOctave;
            if (isImportantNote && Math.random() < 0.4) {
              noteDuration = beatDuration * 1.5; // Hold important notes longer
            }
            
            // Taal-aware density - check if we should rest
            const density = generatorRef.current.getTaalDensity(cyclePosition);
            if (Math.random() > density && cyclePosition !== 0 && cyclePosition !== 15) {
              // Rest - skip this note but still update state
              prevFrequency = noteData.frequency;
              prevNote = noteData.note;
              beat++;
              return;
            }
            
            // Determine if this note needs andolan
            // Only at slower tempos where it's perceptible
            const needsAndolan = bpm < 150 && 
                                 raga.andolanNotes && 
                                 raga.andolanNotes.includes(noteData.note) && 
                                 noteDuration > beatDuration * 0.8;
            
            // Determine if we should use kan swar (grace note)
            // More likely on important notes and when coming from a distance
            // Disable at high speeds (>200 BPM)
            const distance = Math.abs(noteData.note - prevNote);
            const useKanSwar = bpm < 200 && distance >= 3 && Math.random() < 0.35;
            let kanFrequency = null;
            if (useKanSwar) {
              // Kan swar is typically the note just below or above the target
              const kanNote = noteData.note > prevNote ? noteData.note - 1 : noteData.note + 1;
              if (raga.scale.includes(kanNote)) {
                kanFrequency = noteToFrequency(kanNote);
              }
            }
            
            // Determine if we should use meend (glide)
            // More common at slower tempos and for certain intervals
            // Disable above 120 BPM
            const useMeend = bpm < 120 && distance >= 2 && distance <= 5 && Math.random() < 0.5;
            
            // Play with selected instrument.
            // IMPORTANT: do NOT route andolan notes through the generic synth;
            // it causes a timbre change that sounds like a different instrument.
            const andolanDepthHz = needsAndolan ? 3 : null;
            switch (instrument) {
              case 'flute':
                audioEngineRef.current.playFlute(noteData.frequency, noteDuration, 0.4, useMeend ? prevFrequency : null, andolanDepthHz);
                break;
              case 'harmonium':
                audioEngineRef.current.playHarmonium(noteData.frequency, noteDuration, 0.4, useMeend ? prevFrequency : null, andolanDepthHz);
                break;
              case 'sitar':
                audioEngineRef.current.playSitar(noteData.frequency, noteDuration, 0.4, useMeend ? prevFrequency : null, useKanSwar, kanFrequency, andolanDepthHz);
                break;
              default:
                if (needsAndolan) {
                  audioEngineRef.current.playNoteWithAndolan(noteData.frequency, noteDuration, 0.4, 3);
                } else {
                  audioEngineRef.current.playNote(noteData.frequency, noteDuration, 0.4, useMeend ? prevFrequency : null, useKanSwar, kanFrequency);
                }
            }
            
            prevFrequency = noteData.frequency;
            prevNote = noteData.note;
            beat++;
          };
          
          playBeat();
          intervalRef.current = setInterval(playBeat, (60 / bpm) * 1000);
          setIsPlaying(true);
        }
      }, [isPlaying, bpm, showTanpura, instrument, showTabla, tablaVolume, downloadAudioBlob, showMetronome]);

      // Canvas visualization
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const sizeRef = { w: 0, h: 0, dpr: 1 };

        const ensureHiDpi = (c, context) => {
          const rect = c.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.floor(rect.width * dpr));
          const h = Math.max(1, Math.floor(rect.height * dpr));
          if (c.width !== w || c.height !== h || sizeRef.dpr !== dpr) {
            c.width = w;
            c.height = h;
            sizeRef.w = w;
            sizeRef.h = h;
            sizeRef.dpr = dpr;
          }
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          return { width: rect.width, height: rect.height, dpr };
        };

        const draw = () => {
          const { width, height, dpr } = ensureHiDpi(canvas, ctx);
          const gradient = ctx.createLinearGradient(0, 0, 0, height);
          gradient.addColorStop(0, '#1a1a2e');
          gradient.addColorStop(1, '#16213e');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);

          const raga = RAGAS[selectedRaga];
          const padding = 40;
          const graphWidth = width - 2 * padding;
          const graphHeight = height - 2 * padding;

          // Grid lines for taal
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = 1;
          
          for (let i = 0; i <= 16; i++) {
            const x = padding + (i / 16) * graphWidth;
            ctx.beginPath();
            ctx.moveTo(x, padding);
            ctx.lineTo(x, height - padding);
            ctx.stroke();
            
            if (i === 0 || i === 8) {
              ctx.fillStyle = i === 0 ? 'rgba(255, 200, 100, 0.2)' : 'rgba(100, 200, 255, 0.2)';
              ctx.fillRect(x, padding, graphWidth / 16, graphHeight);
            }
          }

          // Note lines - extended range from -12 to 24
          const noteMin = -12;
          const noteMax = 24;
          const noteRange = noteMax - noteMin;  // 36 semitones (3 octaves)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
          for (let i = 0; i <= noteRange; i += 2) {
            const y = height - padding - (i / noteRange) * graphHeight;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(width - padding, y);
            ctx.stroke();
          }

          // Sa lines at all three octaves (mandra, madhya, taar)
          [-12, 0, 12, 24].forEach(note => {
            const normalizedNote = note - noteMin;
            const y = height - padding - (normalizedNote / noteRange) * graphHeight;
            ctx.strokeStyle = note === 0 ? 'rgba(255, 200, 100, 0.4)' : 'rgba(255, 200, 100, 0.2)';
            ctx.lineWidth = note === 0 ? 2 : 1;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(width - padding, y);
            ctx.stroke();
            ctx.lineWidth = 1;
          });

          // Vadi/Samvadi gravity lines (octave-equivalent)
          const vadiPc = ((raga.vadi % 12) + 12) % 12;
          const samvadiPc = ((raga.samvadi % 12) + 12) % 12;
          const isPitchClass = (note, pc) => (((note % 12) + 12) % 12) === pc;

          for (let note = noteMin; note <= noteMax; note++) {
            if (!isPitchClass(note, vadiPc) && !isPitchClass(note, samvadiPc)) continue;
            const normalized = note - noteMin;
            const y = height - padding - (normalized / noteRange) * graphHeight;
            if (isPitchClass(note, vadiPc)) {
              ctx.strokeStyle = 'rgba(255, 200, 100, 0.16)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(padding, y);
              ctx.lineTo(width - padding, y);
              ctx.stroke();
            }
            if (isPitchClass(note, samvadiPc)) {
              ctx.strokeStyle = 'rgba(200, 150, 255, 0.14)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(padding, y);
              ctx.lineTo(width - padding, y);
              ctx.stroke();
            }
          }

          // Gravity summary (how close recent notes stay to vadi/samvadi pitch-classes)
          const distToPc = (note, pc) => {
            const base = pc;
            const k = Math.round((note - base) / 12);
            const c0 = base + 12 * k;
            const c1 = c0 + 12;
            const c2 = c0 - 12;
            return Math.min(Math.abs(note - c0), Math.abs(note - c1), Math.abs(note - c2));
          };

          const recent = melodyHistory.slice(-32);
          if (recent.length > 0) {
            const vAvg = recent.reduce((acc, n) => acc + distToPc(n.note, vadiPc), 0) / recent.length;
            const sAvg = recent.reduce((acc, n) => acc + distToPc(n.note, samvadiPc), 0) / recent.length;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`Vadi gravity: ${(1 / (1 + vAvg)).toFixed(2)}`, width - padding, 18);
            ctx.fillText(`Samvadi gravity: ${(1 / (1 + sAvg)).toFixed(2)}`, width - padding, 34);
            ctx.textAlign = 'left';
          }

          // Melody trajectory
          if (melodyHistory.length > 1) {
            const noteMin = -12;
            const noteMax = 24;
            const noteRange = noteMax - noteMin;
            
            ctx.strokeStyle = 'rgba(100, 255, 200, 0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const visibleNotes = melodyHistory.slice(-32);
            visibleNotes.forEach((noteData, i) => {
              const x = padding + ((i + 0.5) / 32) * graphWidth;
              const normalizedNote = noteData.note - noteMin;
              const y = height - padding - (normalizedNote / noteRange) * graphHeight;
              
              if (i === 0) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            });
            ctx.stroke();

            // Note points
            visibleNotes.forEach((noteData, i) => {
              const x = padding + ((i + 0.5) / 32) * graphWidth;
              const normalizedNote = noteData.note - noteMin;
              const y = height - padding - (normalizedNote / noteRange) * graphHeight;
              
              // Check note type with octave equivalence
              const noteInOctave = ((noteData.note % 12) + 12) % 12;
              const vadiInOctave = ((raga.vadi % 12) + 12) % 12;
              const samvadiInOctave = ((raga.samvadi % 12) + 12) % 12;
              
              const isVadi = noteInOctave === vadiInOctave;
              const isSamvadi = noteInOctave === samvadiInOctave;
              const isSa = noteInOctave === 0;
              
              const age = (visibleNotes.length - 1 - i) / visibleNotes.length;
              const glowSize = (1 - age) * 15 + 5;
              
              const glow = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
              if (isVadi) {
                glow.addColorStop(0, 'rgba(255, 200, 100, 0.8)');
                glow.addColorStop(1, 'rgba(255, 200, 100, 0)');
              } else if (isSamvadi) {
                glow.addColorStop(0, 'rgba(200, 150, 255, 0.8)');
                glow.addColorStop(1, 'rgba(200, 150, 255, 0)');
              } else if (isSa) {
                glow.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
              } else {
                glow.addColorStop(0, 'rgba(100, 255, 200, 0.6)');
                glow.addColorStop(1, 'rgba(100, 255, 200, 0)');
              }
              
              ctx.fillStyle = glow;
              ctx.beginPath();
              ctx.arc(x, y, glowSize, 0, Math.PI * 2);
              ctx.fill();
              
              ctx.fillStyle = isVadi ? '#ffcc66' : isSamvadi ? '#cc99ff' : isSa ? '#ffffff' : '#66ffcc';
              ctx.beginPath();
              ctx.arc(x, y, 4, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          // Current beat indicator
          const beatX = padding + ((currentBeat + 0.5) / 16) * graphWidth;
          ctx.strokeStyle = 'rgba(255, 100, 100, 0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(beatX, padding);
          ctx.lineTo(beatX, height - padding);
          ctx.stroke();

          // Beat numbers
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.font = '12px monospace';
          ctx.textAlign = 'center';
          for (let i = 0; i < 16; i++) {
            const x = padding + ((i + 0.5) / 16) * graphWidth;
            const label = i === 0 ? 'Sam' : i === 8 ? 'Khali' : (i + 1).toString();
            ctx.fillText(label, x, height - 15);
          }

          // Current note info
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(`Note: ${currentNote.noteName}`, padding, 25);
          ctx.fillText(`Freq: ${currentNote.frequency.toFixed(1)} Hz`, padding + 120, 25);

          animationRef.current = requestAnimationFrame(draw);

          // Spectrogram (waterfall) drawn in a separate canvas
          if (showSpectrogram && spectrogramRef.current && audioEngineRef.current) {
            const analyser = audioEngineRef.current.getAnalyser ? audioEngineRef.current.getAnalyser() : null;
            if (analyser) {
              const sCanvas = spectrogramRef.current;
              const sCtx = sCanvas.getContext('2d');
              const sRect = sCanvas.getBoundingClientRect();
              const sdpr = window.devicePixelRatio || 1;
              const sw = Math.max(1, Math.floor(sRect.width * sdpr));
              const sh = Math.max(1, Math.floor(sRect.height * sdpr));
              if (sCanvas.width !== sw || sCanvas.height !== sh) {
                sCanvas.width = sw;
                sCanvas.height = sh;
              }

              // Throttle to ~30fps
              const nowMs = performance.now();
              if (nowMs - spectrogramLastUpdateRef.current > 33) {
                spectrogramLastUpdateRef.current = nowMs;

                if (!spectrogramDataRef.current || spectrogramDataRef.current.length !== analyser.frequencyBinCount) {
                  spectrogramDataRef.current = new Uint8Array(analyser.frequencyBinCount);
                }
                analyser.getByteFrequencyData(spectrogramDataRef.current);

                const shift = Math.max(1, Math.round(sdpr));
                // Scroll left by ~1 CSS px
                sCtx.drawImage(sCanvas, -shift, 0);
                // Clear right-most column(s)
                sCtx.fillStyle = 'rgba(0,0,0,0.18)';
                sCtx.fillRect(sw - shift, 0, shift, sh);

                const nyquist = (audioEngineRef.current.audioContext?.sampleRate || 48000) / 2;
                const minHz = 40;
                const maxHz = Math.min(8000, nyquist);
                const logMin = Math.log10(minHz);
                const logMax = Math.log10(maxHz);

                for (let y = 0; y < sh; y++) {
                  const t = 1 - (y / (sh - 1));
                  const hz = Math.pow(10, logMin + (logMax - logMin) * t);
                  const bin = Math.max(0, Math.min(analyser.frequencyBinCount - 1, Math.floor((hz / nyquist) * analyser.frequencyBinCount)));
                  const v = spectrogramDataRef.current[bin] / 255;

                  // Simple color map leaning toward the existing emerald accent
                  const r = Math.floor(40 + v * 80);
                  const g = Math.floor(60 + v * 195);
                  const b = Math.floor(70 + v * 120);
                  sCtx.fillStyle = `rgb(${r},${g},${b})`;
                  sCtx.fillRect(sw - shift, sh - 1 - y, shift, 1);
                }
              }
            }
          }
        };

        draw();

        return () => {
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, [melodyHistory, currentBeat, currentNote, selectedRaga, showSpectrogram]);

      const raga = RAGAS[selectedRaga];

      const exportMelodyJSON = useCallback(() => {
        if (melodyHistory.length === 0) {
          setToastMessage('⚠️ No melody to export yet');
          setTimeout(() => setToastMessage(''), 2000);
          return;
        }
        const data = {
          raga: selectedRaga,
          ragaName: raga.name,
          bpm,
          temperature,
          instrument,
          timestamp: new Date().toISOString(),
          notes: melodyHistory.map(n => ({
            beat: n.beat,
            note: n.note,
            noteName: n.noteName,
            frequency: Math.round(n.frequency * 10) / 10
          }))
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `raga-${selectedRaga}-melody-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setToastMessage('📥 Melody exported!');
        setTimeout(() => setToastMessage(''), 2000);
      }, [melodyHistory, selectedRaga, raga.name, bpm, temperature, instrument]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white p-4 md:p-6">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-gray-800 border border-emerald-400 text-white px-4 py-3 rounded-lg shadow-lg z-50 text-sm flex items-center gap-2">
              {toastMessage}
            </div>
          )}
          <div className="max-w-6xl mx-auto">
            {/* Header */}
            <div className="text-center mb-4">
              <h1 className="text-3xl md:text-4xl font-bold mb-2 bg-gradient-to-r from-amber-400 via-orange-500 to-red-500 bg-clip-text text-transparent">
                🎵 Raga Generator
              </h1>
              <p className="text-gray-400 text-sm md:text-base">Procedural Indian Classical Music • 46 Ragas • Stochastic Transition Kernels</p>
            </div>

            {/* Tab Navigation */}
            <div className="flex justify-center mb-6">
              <div className="bg-gray-800/50 backdrop-blur rounded-xl p-1 border border-gray-700 inline-flex">
                <button
                  onClick={() => { if (!isPlaying) setActiveTab('generator'); }}
                  className={`px-6 py-2 rounded-lg font-semibold transition-all ${
                    activeTab === 'generator'
                      ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white'
                      : 'text-gray-400 hover:text-white hover:bg-gray-700/50'
                  } ${isPlaying ? 'cursor-not-allowed' : ''}`}
                  disabled={isPlaying}
                >
                  🎶 Tune Generator
                </button>
                <button
                  onClick={() => { if (!isPlaying) setActiveTab('tutorials'); }}
                  className={`px-6 py-2 rounded-lg font-semibold transition-all ${
                    activeTab === 'tutorials'
                      ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white'
                      : 'text-gray-400 hover:text-white hover:bg-gray-700/50'
                  } ${isPlaying ? 'cursor-not-allowed' : ''}`}
                  disabled={isPlaying}
                >
                  📚 Raga Tutorials
                </button>
              </div>
            </div>

            {/* Conditional Content Based on Tab */}
            {activeTab === 'tutorials' ? (
              <RagaTutorials 
                selectedRaga={selectedRaga} 
                setSelectedRaga={setSelectedRaga}
                audioEngine={audioEngineRef.current}
              />
            ) : (
              <>
                {/* Main Content - Generator */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
              {/* Left Panel - Raga Info */}
              <div className="bg-gray-800/50 backdrop-blur rounded-xl p-4 md:p-5 border border-gray-700">
                <h2 className="text-lg md:text-xl font-semibold mb-3 text-amber-400">🎶 {raga.name}</h2>
                
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span className="text-gray-400">Thaat:</span>
                    <span className="text-white">{raga.thaat}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Time:</span>
                    <span className="text-white text-right text-xs">{raga.time}</span>
                  </div>
                  <div>
                    <span className="text-gray-400">Mood:</span>
                    <span className="ml-2 text-white text-xs">{raga.mood}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Vadi (King):</span>
                    <span className="text-amber-400 font-semibold">
                      {raga.noteNames[raga.scale.indexOf(raga.vadi)]}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Samvadi (Queen):</span>
                    <span className="text-purple-400 font-semibold">
                      {raga.noteNames[raga.scale.indexOf(raga.samvadi)]}
                    </span>
                  </div>
                  
                  <div className="pt-2 border-t border-gray-700">
                    <span className="text-gray-400 text-xs">Aroha (↑):</span>
                    <div className="mt-1 text-white font-mono text-xs bg-gray-900/50 p-2 rounded overflow-x-auto whitespace-nowrap">
                      {raga.aroha.map(n => raga.noteNames[raga.scale.indexOf(n)]).join(' → ')}
                    </div>
                  </div>
                  
                  <div>
                    <span className="text-gray-400 text-xs">Avaroha (↓):</span>
                    <div className="mt-1 text-white font-mono text-xs bg-gray-900/50 p-2 rounded overflow-x-auto whitespace-nowrap">
                      {raga.avaroha.map(n => raga.noteNames[raga.scale.indexOf(n)]).join(' → ')}
                    </div>
                  </div>
                </div>

                {/* Scale Display */}
                <div className="mt-3 pt-3 border-t border-gray-700">
                  <span className="text-gray-400 text-xs">Scale Notes:</span>
                  <div className="flex flex-wrap gap-1 mt-2">
                    {raga.scale.slice(0, Math.min(8, raga.noteNames.length)).map((note, i) => {
                      const isVadi = note === raga.vadi;
                      const isSamvadi = note === raga.samvadi;
                      return (
                        <span
                          key={i}
                          className={`px-2 py-1 rounded text-xs font-mono ${
                            isVadi 
                              ? 'bg-amber-500/30 text-amber-300 border border-amber-500' 
                              : isSamvadi 
                                ? 'bg-purple-500/30 text-purple-300 border border-purple-500'
                                : 'bg-gray-700 text-gray-300'
                          }`}
                        >
                          {raga.noteNames[i]}
                        </span>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Center Panel - Visualization */}
              <div className="lg:col-span-2 bg-gray-800/50 backdrop-blur rounded-xl p-4 md:p-5 border border-gray-700">
                <h2 className="text-base md:text-lg font-semibold mb-3 text-gray-300">Melody Trajectory (Teental - 16 Beats)</h2>
                <canvas
                  ref={canvasRef}
                  width={700}
                  height={300}
                  className="w-full rounded-lg border border-gray-600"
                />

                {/* Spectrogram (optional) */}
                <div className="mt-3 flex items-center justify-between">
                  <label className={`flex items-center gap-2 text-xs text-gray-400 cursor-pointer ${isPlaying ? 'opacity-100' : ''}`}>
                    <input
                      type="checkbox"
                      checked={showSpectrogram}
                      onChange={(e) => setShowSpectrogram(e.target.checked)}
                      className="accent-emerald-400"
                    />
                    Spectrogram
                  </label>
                  <div className="text-[10px] text-gray-500">Uses the live master output</div>
                </div>
                {showSpectrogram && (
                  <canvas
                    ref={spectrogramRef}
                    width={700}
                    height={120}
                    className="mt-2 w-full rounded-lg border border-gray-600"
                  />
                )}
                
                {/* Taal Display */}
                <div className="mt-3 flex justify-center gap-1 flex-wrap">
                  {Array.from({ length: 16 }, (_, i) => (
                    <div
                      key={i}
                      className={`w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center text-xs font-mono transition-all duration-150 ${
                        i === currentBeat
                          ? 'bg-red-500 text-white scale-110'
                          : i === 0
                            ? 'bg-amber-500/30 text-amber-300 border border-amber-500'
                            : i === 8
                              ? 'bg-blue-500/30 text-blue-300 border border-blue-500'
                              : 'bg-gray-700 text-gray-400'
                      }`}
                    >
                      {i === 0 ? '×' : i === 8 ? '○' : i + 1}
                    </div>
                  ))}
                </div>
                <div className="text-center text-xs text-gray-500 mt-2">
                  × = Sam | ○ = Khali | Teental: Dha Dhin Dhin Dha | Dha Dhin Dhin Dha | Dha Tin Tin Ta | Ta Dhin Dhin Dha
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="mt-4 md:mt-6 bg-gray-800/50 backdrop-blur rounded-xl p-4 md:p-5 border border-gray-700">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-8 gap-4">
                {/* Raga Selection */}
                <div className="lg:col-span-2">
                  <label className="block text-sm text-gray-400 mb-2">Raga (46 Ragas by Time)</label>
                  <select
                    value={selectedRaga}
                    onChange={(e) => setSelectedRaga(e.target.value)}
                    className="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm"
                    disabled={isPlaying}
                  >
                    {Object.entries(RAGA_GROUPS).map(([group, ragas]) => (
                      <optgroup key={group} label={group}>
                        {ragas.map(key => (
                          <option key={key} value={key}>{RAGAS[key].name}</option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                </div>

                {/* Instrument Selection */}
                <div>
                  <label className="block text-sm text-gray-400 mb-2">Instrument</label>
                  <select
                    value={instrument}
                    onChange={(e) => setInstrument(e.target.value)}
                    className="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm"
                    disabled={isPlaying}
                  >
                    <option value="sitar">🪕 Sitar</option>
                    <option value="flute">🎶 Flute</option>
                    <option value="harmonium">🎹 Harmonium</option>
                    <option value="default">🔊 Synth</option>
                  </select>
                </div>

                {/* BPM */}
                <div>
                  <label className="block text-sm text-gray-400 mb-2">
                    Speed: {bpm} BPM
                  </label>
                  <input
                    type="range"
                    min="40"
                    max="1280"
                    value={bpm}
                    onChange={(e) => setBpm(Number(e.target.value))}
                    className="w-full accent-amber-500"
                    disabled={isPlaying}
                  />
                </div>

                {/* Temperature */}
                <div>
                  <label className="block text-sm text-gray-400 mb-2">
                    Temp: {temperature.toFixed(2)}
                  </label>
                  <input
                    type="range"
                    min="0.1"
                    max="2"
                    step="0.05"
                    value={temperature}
                    onChange={(e) => setTemperature(Number(e.target.value))}
                    className="w-full accent-purple-500"
                  />
                  <div className="flex justify-between text-xs text-gray-500">
                    <span>Safe</span>
                    <span>Wild</span>
                  </div>
                </div>

                {/* Volume */}
                <div>
                  <label className="block text-sm text-gray-400 mb-2">
                    Vol: {Math.round(volume * 100)}%
                  </label>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={volume}
                    onChange={(e) => setVolume(Number(e.target.value))}
                    className="w-full accent-green-500"
                  />
                </div>

                {/* Tabla Volume */}
                <div>
                  <label className="block text-sm text-gray-400 mb-2">
                    Tabla: {tablaVolume.toFixed(2)}×
                  </label>
                  <input
                    type="range"
                    min="0"
                    max="5"
                    step="0.1"
                    value={tablaVolume}
                    onChange={(e) => setTablaVolume(Number(e.target.value))}
                    className="w-full accent-blue-500"
                    disabled={!showTabla}
                  />
                  <div className="flex justify-between text-xs text-gray-500">
                    <span>0×</span>
                    <span>5×</span>
                  </div>
                </div>

                {/* Play/Stop & Tanpura */}
                <div className="flex flex-col gap-2">
                  <button
                    onClick={togglePlay}
                    className={`px-4 py-2 rounded-lg font-semibold transition-all text-sm ${
                      isPlaying
                        ? 'bg-red-500 hover:bg-red-600 text-white'
                        : 'bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white'
                    }`}
                  >
                    {isPlaying ? '⏹ Stop' : '▶ Play'}
                  </button>

                  <button
                    onClick={toggleRecording}
                    disabled={!isPlaying && !isRecording}
                    className={`px-4 py-2 rounded-lg font-semibold transition-all text-sm ${
                      isRecording
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                        : 'bg-gray-700 hover:bg-gray-600 text-white'
                    } ${(!isPlaying && !isRecording) ? 'opacity-50 cursor-not-allowed' : ''}`}
                    title={isPlaying ? 'Stops + downloads on click' : 'Start playback to enable recording'}
                  >
                    {isRecording ? '⏺ Recording… (Click to stop)' : '● Record'}
                  </button>

                  <button
                    onClick={exportMelodyJSON}
                    disabled={isPlaying || melodyHistory.length === 0}
                    className="px-4 py-2 rounded-lg font-semibold transition-all text-sm bg-blue-700 hover:bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed"
                    title="Export current melody as JSON"
                  >
                    📥 Export JSON
                  </button>

                  <label className="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showTanpura}
                      onChange={(e) => setShowTanpura(e.target.checked)}
                      className="accent-amber-500"
                      disabled={isPlaying}
                    />
                    Tanpura Drone
                  </label>

                  <label className="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showTabla}
                      onChange={(e) => setShowTabla(e.target.checked)}
                      className="accent-blue-400"
                      disabled={isPlaying}
                    />
                    Tabla (Teental)
                  </label>

                  <label className="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showMetronome}
                      onChange={(e) => setShowMetronome(e.target.checked)}
                      className="accent-cyan-400"
                      disabled={isPlaying}
                    />
                    Metronome Click
                  </label>
                </div>
              </div>
            </div>

            {/* Raga Quick Reference Grid */}
            <div className="mt-4 bg-gray-800/30 rounded-xl p-4 border border-gray-700/50">
              <h3 className="text-sm font-semibold mb-3 text-gray-400">Quick Select - All 46 Ragas</h3>
              <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-5 lg:grid-cols-8 gap-2 text-xs">
                {Object.entries(RAGAS).map(([key, r]) => (
                  <button
                    key={key}
                    onClick={() => !isPlaying && setSelectedRaga(key)}
                    disabled={isPlaying}
                    className={`p-2 rounded-lg text-left transition-all ${
                      selectedRaga === key 
                        ? 'bg-amber-500/30 border border-amber-500 ring-1 ring-amber-400' 
                        : 'bg-gray-700/50 border border-gray-600 hover:bg-gray-700 hover:border-gray-500'
                    } ${isPlaying ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
                  >
                    <div className="font-semibold text-white truncate">{r.name}</div>
                    <div className="text-gray-400 truncate text-[10px]">{r.thaat}</div>
                  </button>
                ))}
              </div>
            </div>

            {/* Info Panel */}
            <div className="mt-4 bg-gray-800/30 rounded-xl p-4 md:p-5 border border-gray-700/50">
              <h3 className="text-base md:text-lg font-semibold mb-3 text-gray-300">How It Works</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs md:text-sm text-gray-400">
                <div>
                  <h4 className="text-amber-400 font-semibold mb-1">🎯 Constraint System</h4>
                  <p>Each Raga defines allowed notes, weighted probabilities for Vadi/Samvadi, and forbidden transitions that preserve musical authenticity.</p>
                </div>
                <div>
                  <h4 className="text-purple-400 font-semibold mb-1">🎲 Stochastic Kernel</h4>
                  <p>A weighted softmax samples the next note based on distance, direction, phrase patterns, and resolution weights (approaching Sam).</p>
                </div>
                <div>
                  <h4 className="text-green-400 font-semibold mb-1">🌡️ Temperature Control</h4>
                  <p>Low temperature: predictable, stays close to Vadi/Samvadi. High temperature: more exploration and unexpected melodic movements.</p>
                </div>
              </div>
            </div>

            {/* Legend */}
            <div className="mt-3 flex justify-center gap-4 md:gap-6 text-xs text-gray-500 flex-wrap">
              <span className="flex items-center gap-1">
                <span className="w-3 h-3 rounded-full bg-amber-400"></span> Vadi (King)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-3 h-3 rounded-full bg-purple-400"></span> Samvadi (Queen)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-3 h-3 rounded-full bg-white"></span> Sa (Tonic)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-3 h-3 rounded-full bg-emerald-400"></span> Other Notes
              </span>
            </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RagaGenerator />);
  </script>
</body>
</html>
